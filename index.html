const STORAGE_KEY = "career_app_v2";
let state = { current: -1, answers: {} };

function load() { try { const s = localStorage.getItem(STORAGE_KEY); if (s) state = JSON.parse(s); } catch(e){} }
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
function reset() {
  if (confirm("정말 처음부터 다시 시작하시겠어요? 모든 답변이 사라집니다.")) {
    state = { current: -1, answers: {} }; save(); render();
  }
}

function render() {
  const main = document.getElementById("main");
  const total = questions.length;
  if (state.current === -1) { renderStart(main); updateProgress(0, total); return; }
  if (state.current >= total) { renderResult(main); updateProgress(total, total); return; }
  renderQuestion(main, questions[state.current]);
  updateProgress(state.current, total);
}

function updateProgress(cur, total) {
  document.getElementById("progressFill").style.width = (cur/total*100) + "%";
  if (cur === 0) document.getElementById("progressText").textContent = "시작 · 답변은 자동 저장";
  else if (cur >= total) document.getElementById("progressText").textContent = "완료 · 결과 확인";
  else document.getElementById("progressText").textContent = cur + " / " + total + " 문항 · 자동 저장됨";
}

function renderStart(main) {
  const answered = Object.keys(state.answers).length;
  main.innerHTML = '<div class="stage-label faith">시작 화면</div>'
    + '<h2 style="font-size:22px;margin-bottom:12px">진로 탐색을 시작하시겠어요?</h2>'
    + '<p style="margin-bottom:14px">총 <b>' + questions.length + '개 문항</b>입니다. 6단계로 구성되어 있어요.</p>'
    + '<div class="info-box"><b>설계 원칙</b><br>이 앱은 본인의 기독교적 가치관(하나님 사랑·이웃 사랑·정직·공정)을 진로 선택의 <b>최상위 기준</b>으로 둡니다. 0단계 4개 문항이 기준점을 잡고, 이후 환경·흥미·강점 답변과 결합해 13개 후보 기관에 대한 가중치 점수를 계산합니다.</div>'
    + '<div class="info-box"><b>진행 방식</b><br>• 한 번에 다 답하지 않으셔도 됩니다. 답변은 브라우저에 자동 저장됩니다.<br>• 어려운 질문은 비워두거나 \'잘 모르겠음\'이라고 적어도 됩니다.<br>• 마지막에 적합 기관 순위, 준비 로드맵, 자기소개서 방향이 자동 생성됩니다.</div>'
    + (answered > 0 ? '<div class="warning-box">이전에 답하신 ' + answered + '개 문항이 저장되어 있습니다.</div>' : "")
    + '<div class="nav"><button class="btn-secondary btn" onclick="reset()">처음부터</button>'
    + '<button class="btn" onclick="state.current=0;save();render()">' + (answered > 0 ? "이어서 시작" : "시작하기") + '</button></div>';
}

function renderQuestion(main, q) {
  const v = state.answers[q.id];
  let body = "";
  if (q.type === "single") {
    body = '<div class="options">' + q.options.map(o =>
      '<button class="option ' + (v===o.val?"selected":"") + '" onclick="selectSingle(\''+q.id+'\',\''+o.val+'\')">' + o.text + '</button>'
    ).join("") + '</div>';
  } else if (q.type === "multi") {
    const arr = Array.isArray(v) ? v : [];
    body = '<div class="options">' + q.options.map(o =>
      '<button class="option multi ' + (arr.includes(o.val)?"selected":"") + '" onclick="toggleMulti(\''+q.id+'\',\''+o.val+'\')">' + o.text + '</button>'
    ).join("") + '</div>';
  } else if (q.type === "text") {
    body = '<textarea rows="6" placeholder="자유롭게 적어주세요..." oninput="setText(\''+q.id+'\',this.value)">' + (v||"") + '</textarea>';
  } else if (q.type === "rank") {
    const obj = v || {};
    body = q.items.map(it =>
      '<div class="rank-row"><span>' + it.text + '</span>'
      + '<input type="number" min="1" max="' + q.items.length + '" value="' + (obj[it.val]||"") + '"'
      + ' onchange="setRank(\''+q.id+'\',\''+it.val+'\',this.value)"></div>'
    ).join("");
  } else if (q.type === "weight") {
    const obj = v || {};
    let total = 0;
    body = q.items.map(it => {
      const cur = obj[it.val] !== undefined ? obj[it.val] : it.default;
      total += Number(cur)||0;
      return '<div class="weight-row"><label>' + it.text + '</label>'
        + '<input type="number" min="0" max="100" value="' + cur + '"'
        + ' onchange="setWeight(\''+q.id+'\',\''+it.val+'\',this.value)"> 점</div>';
    }).join("");
    body += '<div class="weight-total ' + (total===100?"good":"bad") + '" id="weightTotal">합계: ' + total + ' / 100점</div>';
  }
  const isFaith = q.faith ? "faith" : "";
  main.innerHTML = '<div class="stage-label ' + isFaith + '">' + q.label + '</div>'
    + '<div class="question">' + q.question + '</div>'
    + '<div class="helper">' + (q.helper||"") + '</div>'
    + body
    + '<div class="nav"><button class="btn btn-secondary" ' + (state.current===0?"disabled":"") + ' onclick="prev()">이전</button>'
    + '<button class="btn" onclick="next()">' + (state.current===questions.length-1?"결과 보기":"다음") + '</button></div>'
    + '<div class="save-status">자동 저장됨 · 언제든 닫고 다시 오셔도 됩니다</div>';
}

function selectSingle(id, val) { state.answers[id] = val; save(); render(); }
function toggleMulti(id, val) {
  if (!Array.isArray(state.answers[id])) state.answers[id] = [];
  const idx = state.answers[id].indexOf(val);
  if (idx >= 0) state.answers[id].splice(idx,1); else state.answers[id].push(val);
  save(); render();
}
function setText(id, val) { state.answers[id] = val; save(); }
function setRank(id, key, val) { if (!state.answers[id]) state.answers[id] = {}; state.answers[id][key] = Number(val); save(); }
function setWeight(id, key, val) {
  if (!state.answers[id]) state.answers[id] = {};
  state.answers[id][key] = Number(val); save();
  const q = questions.find(qq => qq.id === id);
  let total = 0;
  q.items.forEach(it => {
    const cur = state.answers[id][it.val] !== undefined ? state.answers[id][it.val] : it.default;
    total += Number(cur)||0;
  });
  const el = document.getElementById("weightTotal");
  if (el) { el.textContent = "합계: " + total + " / 100점"; el.className = "weight-total " + (total===100?"good":"bad"); }
}
function prev() { if (state.current > 0) { state.current--; save(); render(); window.scrollTo(0,0); } }
function next() { state.current++; save(); render(); window.scrollTo(0,0); }

function computeResults() {
  const a = state.answers;
  const calling = a.q0_calling || "discern";
  const faithOrgPref = a.q0_faith_org || "open";
  const honesty = a.q0_honesty || "voice";
  const commute = a.q1_commute || "metro";
  const study = a.q2_study || "3m";
  const employment = a.q3_employment || "intern_ok";
  const helping = a.q8_helping || "indirect";
  const skills = a.q10_skills || [];
  const itInvest = a.q11_it_invest || "5h";
  const strengths = a.q15_strengths || [];

  const wRaw = a.q17_weights || {};
  const w = {};
  questions.find(q => q.id === "q17_weights").items.forEach(it => {
    w[it.val] = wRaw[it.val] !== undefined ? wRaw[it.val] : it.default;
  });
  const wSum = Object.values(w).reduce((s,v) => s + (Number(v)||0), 0) || 100;
  Object.keys(w).forEach(k => w[k] = (Number(w[k])||0) / wSum);

  const commuteOK = { anyang:["anyang"], metro:["anyang","metro"],
    gyeonggi:["anyang","metro","gyeonggi"], anywhere:["anyang","metro","gyeonggi","anywhere"] }[commute];
  const studyOK = { "1m":["1m"], "3m":["1m","3m"], "6m":["1m","3m","6m"] }[study];

  const ranked = orgs.map(org => {
    let blocked = false; let blockReason = "";
    if (!commuteOK.includes(org.commute)) { blocked = true; blockReason = "통근 거리 초과"; }
    if (org.employment === "regular" && !studyOK.includes(org.studyLevel)) { blocked = true; blockReason = "필기시험 준비 시간 부족"; }

    let callingBonus = 0;
    if (org.fitFor.includes(calling)) callingBonus = 8;
    let faithOrgBonus = 0;
    if (faithOrgPref === "prefer" && org.industry.includes("nonprofit") && org.scores.faith >= 90) faithOrgBonus = 10;
    if (faithOrgPref === "public" && org.industry.includes("public")) faithOrgBonus = 5;
    if (faithOrgPref === "avoid_church" && org.industry.includes("nonprofit") && org.scores.faith >= 90) faithOrgBonus = -8;
    let helpingBonus = 0;
    if (helping === "direct" && org.scores.helping >= 85) helpingBonus = 5;
    if (helping === "no" && org.scores.helping >= 85 && org.scores.interest < 70) helpingBonus = -3;
    let strengthBonus = 0;
    if (strengths.includes("eng_read") || strengths.includes("eng_speak")) {
      if (["kotra_intern","kita_intern","kita_regular","gto","worldvision","compassion","koica_yp","goodneighbors"].includes(org.id)) strengthBonus += 4;
    }
    if (strengths.includes("ai_output") && ["nipa_intern","kotra_intern","kita_intern"].includes(org.id)) strengthBonus += 4;

    const base = org.scores.faith*w.faith + org.scores.interest*w.interest + org.scores.commute*w.commute
      + org.scores.stability*w.stability + org.scores.feasibility*w.feasibility + org.scores.helping*w.helping;
    const total = blocked ? 0 : Math.round(base + callingBonus + faithOrgBonus + helpingBonus + strengthBonus);
    return { org, total, blocked, blockReason, faith: org.scores.faith, interest: org.scores.interest };
  }).sort((a,b) => b.total - a.total);

  return { ranked, calling, faithOrgPref, honesty, commute, study, employment, helping, skills, itInvest, strengths, w };
}

function renderResult(main) {
  const r = computeResults();
  const top = r.ranked.filter(x => !x.blocked).slice(0, 5);
  const blocked = r.ranked.filter(x => x.blocked);
  const callingText = { poor:"가난하고 약한 이웃을 직접 섬김 (마 25:40)",
    steward:"맡겨진 자원을 정직하게 관리하는 청지기 (마 25:14-30)",
    justice:"공의를 행하고 구조를 바로잡음 (미 6:8)",
    witness:"세상 속에서 빛과 소금이 되는 일반 직업 (마 5:13-16)",
    discern:"아직 분별 중" }[r.calling];

  let html = '<div class="faith-banner"><b>본인의 부르심:</b> ' + callingText
    + '<br><b>가중치 우선순위:</b> 신앙·윤리(' + Math.round(r.w.faith*100) + '점) 〉 흥미(' + Math.round(r.w.interest*100)
    + ') 〉 통근(' + Math.round(r.w.commute*100) + ') 〉 안정(' + Math.round(r.w.stability*100)
    + ') 〉 가능성(' + Math.round(r.w.feasibility*100) + ') 〉 도움(' + Math.round(r.w.helping*100) + ')</div>'
    + '<div class="result-section"><h2>적합 기관 Top 5 (가중 점수순)</h2>';

  top.forEach((item, idx) => {
    const o = item.org;
    const rankClass = idx===0 ? "rank1" : (idx<3 ? "rank2" : "rank3");
    html += '<div class="job-card ' + rankClass + '">'
      + '<div class="score-box"><div class="score-main">' + item.total + '점</div>'
      + '<div class="score-detail">신앙 ' + item.faith + ' · 흥미 ' + item.interest + '</div></div>'
      + '<span class="rank-badge">' + (idx+1) + '순위</span>'
      + '<h3>' + o.name + '</h3>'
      + '<div class="meta">' + o.type + ' · ' + o.location + ' · ' + o.salary + '</div>'
      + '<div class="reason"><b>왜 이 기관:</b> ' + o.why + '</div>'
      + '<details><summary>가치 정합도 상세</summary><div>' + o.faithDetail + '</div></details>'
      + '<details><summary>업무 내용</summary><div>' + o.desc + '</div></details>'
      + '<div class="action">📅 <b>채용 일정:</b> ' + o.schedule + '</div>'
      + '<div class="action">⚠️ <b>주의:</b> ' + o.cautions + '</div></div>';
  });
  html += '</div>';

  if (blocked.length) {
    html += '<div class="result-section"><h2>제외된 기관 (조건 미충족)</h2>'
      + '<div style="font-size:13px;color:#666">통근·공부 시간 제약으로 자동 제외:</div>'
      + '<ul style="margin-top:8px;padding-left:20px;font-size:14px;color:#666">'
      + blocked.map(b => '<li>' + b.org.name + ' — ' + b.blockReason + '</li>').join("")
      + '</ul></div>';
  }

  html += renderRoadmap(r, top);
  html += renderEssayGuide(r, top);
  html += renderDiscernment(r);

  html += '<div class="actions-bar">'
    + '<button class="btn btn-secondary btn-small" onclick="state.current=0;save();render()">처음부터 다시 답하기</button>'
    + '<button class="btn btn-secondary btn-small" onclick="window.print()">결과 인쇄·PDF 저장</button>'
    + '<button class="btn btn-secondary btn-small" onclick="exportAnswers()">답변 내보내기</button>'
    + '<button class="btn btn-small" onclick="reset()">전체 초기화</button></div>';

  main.innerHTML = html;
}

function renderRoadmap(r, top) {
  const top1 = top[0] && top[0].org;
  const top2 = top[1] && top[1].org;
  if (!top1) return "";
  const needsOpic = top.some(t => ["kotra_intern","kita_regular","koica_yp"].includes(t.org.id));
  const needsHistory = top.some(t => ["gto","gh","anyang"].includes(t.org.id));

  const steps = [];
  steps.push({ title:"이번 주 — 신앙·환경 결정 확정",
    body:"0단계 답변을 다시 보고, 본인 부르심·레드라인이 명확한지 점검. 가족·교회 멘토와 함께 짧게 기도하며 분별." });
  steps.push({ title:"1~2주차 — 1순위 기관 자기소개서 초안",
    body: top1.name + "의 채용공고·직무기술서를 다운로드해 정독. 본인 경험(파라텍 UAE 조사·엘렉스 시장조사·AI 활용)을 직무 키워드와 매칭해 1차 초안 작성." });
  if (needsOpic) steps.push({ title:"1~2개월차 — OPIc IH 준비",
    body:"온라인 강의 1~2개 수강, 매일 30분 답변 녹음. 시험 매주 시행, 6주 준비로 IH 가능." });
  if (needsHistory) steps.push({ title:"한국사능력검정 2급 응시",
    body:"연 6회 시행(historyexam.go.kr). 1~2개월 준비. 공기업 가산점 확보." });
  steps.push({ title:"병행 — 경력 공백(2025-07~2026-01) 정리",
    body:"AI 학습·자격증·교회 활동·외국인 회화 모임 등 실제 활동을 사실 기반으로 표 정리." });
  steps.push({ title: (top2 ? top2.name : "2순위 기관") + " 병행 모니터링",
    body:"주 1회 채용 페이지 확인, 알림 설정. 1순위 합격까지 백업 옵션 유지." });
  steps.push({ title:"장기 — 6개월~1년 인턴 후 정규직 도전",
    body:"현재 경력 6개월·공백 7개월은 정규 공채에 약점. 인턴 경험을 추가해 재도전이 현실적." });

  let html = '<div class="result-section"><h2>준비 로드맵</h2>';
  steps.forEach((s,i) => {
    html += '<div class="roadmap-step"><div class="roadmap-num">' + (i+1) + '</div>'
      + '<div class="roadmap-content"><h4>' + s.title + '</h4><p>' + s.body + '</p></div></div>';
  });
  html += '</div>';
  return html;
}

function renderEssayGuide(r, top) {
  if (!top[0]) return "";
  const top1 = top[0].org;
  const isChristian = top1.scores.faith >= 90 && top1.industry.includes("nonprofit");
  let html = '<div class="result-section"><h2>자기소개서 방향 (1순위 기준)</h2>';
  if (isChristian) {
    html += '<div class="info-box"><b>' + top1.name + '은 기독교 정체성이 명시된 단체</b>이므로, 신앙적 동기를 자연스럽게 드러내도 좋습니다. 단, \'열정·헌신\' 같은 추상어 대신 구체적 경험으로 표현하세요.</div>';
    html += '<p><b>핵심 메시지:</b> "마 22:39의 이웃 사랑이 추상적 감정이 아니라 정직한 일터에서의 실천이라고 믿습니다. 무역·해외영업·AI 활용 경험을 ' + top1.name + '의 ' + (top1.fitFor.includes("poor")?"취약계층 자립":"공익 미션") + '에 직접 연결하고 싶습니다."</p>';
  } else {
    html += '<div class="info-box"><b>' + top1.name + '은 공공기관/일반 단체</b>이므로, 자기소개서에 직접적인 신앙 언어는 자제. 대신 정직·공정·공익이라는 가치 언어로 번역해 표현.</div>';
    html += '<p><b>핵심 메시지:</b> "정직한 공익 운영을 중요하게 여기며, 무역·영어·AI 활용 경험을 ' + top1.name + '의 미션에 기여하고 싶습니다."</p>';
  }
  html += '<p style="margin-top:10px"><b>구조 권장:</b></p>'
    + '<ol style="padding-left:20px;font-size:14px;color:#444">'
    + '<li>지원동기 — 본인 가치관과 기관 미션의 접점 (구체적 사례 1개)</li>'
    + '<li>경험·역량 — 파라텍 또는 엘렉스 사례 1개를 STAR 기법으로 (수치 포함)</li>'
    + '<li>입사 후 포부 — 직무기술서 키워드를 활용한 6개월·1년 계획</li></ol>'
    + '<p style="margin-top:10px;font-size:13px;color:#666"><b>금지 표현:</b> "영어를 매우 잘 합니다", "전문가입니다", "열정으로 헌신하겠습니다", "최고가 되겠습니다" — 본인 실제 수준과 맞지 않거나 검증 어려운 표현은 면접에서 무너집니다.</p>'
    + '<p style="margin-top:6px;font-size:13px;color:#666"><b>권장 동사:</b> 수행, 정리, 검토, 조사, 활용, 대응, 기여, 진행 — 사실 기반의 차분한 어조.</p>';

  if (r.strengths.length > 0) {
    html += '<p style="margin-top:14px"><b>본인이 자신 있다고 한 강점을 자기소개서에 우선 배치:</b></p>'
      + '<ul style="padding-left:20px;font-size:14px;color:#444">'
      + r.strengths.map(s => '<li>' + strengthLabel(s) + '</li>').join("") + '</ul>';
  } else {
    html += '<div class="warning-box">강점 항목을 하나도 선택하지 않으셨습니다. 자기소개서에서 무엇을 차별화 포인트로 쓸지 다시 점검 필요.</div>';
  }
  html += '</div>';
  return html;
}

function strengthLabel(val) {
  const map = {
    eng_read:"영어 읽기·쓰기 — 영문 자료 조사·요약 사례로 활용",
    eng_speak:"영어 회화 — OPIc 점수 확보 시 강점 명시",
    trade_knowledge:"무역 실무 지식 — 무역영어 1급·수출마스터 2급 인용",
    research:"해외 기업 리서치 — 파라텍 UAE 조사 사례 구체화",
    b2b:"B2B 고객 응대 — 인도 바이어 응대·의전 경험",
    ai_output:"AI 도구로 산출물 — 시간 절감 수치(%·시간)로 표현",
    doc:"문서·자료 정리 — 카탈로그·보고서 정량화",
    presentation:"발표·기획서 — 구체 사례와 결과 명시"
  };
  return map[val] || val;
}

function renderDiscernment(r) {
  let html = '<div class="result-section"><h2>분별 가이드 (기도·점검 질문)</h2>'
    + '<div class="faith-banner">결과 점수가 높다고 하나님이 그곳으로 부르셨다는 뜻은 아닙니다. 이 앱은 본인의 답을 정리한 도구일 뿐이며, 최종 분별은 기도·말씀·신뢰하는 공동체와 함께 하시기 바랍니다.</div>';
  const top1 = r.ranked.filter(x => !x.blocked)[0];
  if (top1) {
    html += '<p style="margin-bottom:10px"><b>1순위 ' + top1.org.name + '에 대한 점검 질문 5가지:</b></p>'
      + '<ol style="padding-left:20px;font-size:14px;color:#444;line-height:1.9">'
      + '<li>이 일을 5년 동안 한다고 상상할 때, 마음에 평안이 있는가? 불안이 있는가?</li>'
      + '<li>이 자리가 정직·공정 기준에 흔들리지 않을 환경인가?</li>'
      + '<li>이 일이 \'이웃을 내 몸 같이 사랑하는\' 구체적 통로가 되는가?</li>'
      + '<li>가족·교회 멘토에게 이 선택을 설명할 때 부끄러움 없이 말할 수 있는가?</li>'
      + '<li>본인 강점이 이곳에서 자라날 수 있는 환경인가?</li></ol>';
  }
  const callingGuide = {
    poor:"마 25:40의 부르심을 따른다면, 점수가 다소 낮더라도 행복한나눔·기빙플러스·굿네이버스를 우선 고려해 볼 가치가 있습니다.",
    steward:"청지기 부르심을 따른다면, KOTRA·KITA·공기업처럼 공적 자원을 정직하게 운영하는 자리가 정합.",
    justice:"공의의 부르심을 따른다면, 구조적 불의를 다루는 자리(공공기관 정책 부서, 인권·노동 NGO)를 추가로 탐색해 볼 가치 있음.",
    witness:"빛과 소금의 부르심은 어디든 갈 수 있다는 뜻이지만, \'아무 데나\'는 아닙니다. 점수 상위 기관 중 본인 강점이 자라는 곳을 고르세요.",
    discern:"아직 분별 중이라면 인턴 트랙을 우선 추천. 6개월 짧게 경험하면서 부르심이 또렷해지는 경우가 많습니다."
  };
  if (callingGuide[r.calling]) html += '<div class="info-box" style="margin-top:14px"><b>부르심별 추가 안내:</b> ' + callingGuide[r.calling] + '</div>';

  const warnings = [];
  if (r.itInvest === "no_invest" && r.skills.length < 3)
    warnings.push("AI·IT 강점을 어필하시려면 도구 활용 사례를 더 축적할 필요. 학습 의향 \'없음\' + 경험 적음 조합은 자기소개서 차별화 어려움.");
  if (!r.strengths.includes("eng_speak") && r.ranked.filter(x => !x.blocked).slice(0,3).some(t => ["kotra_intern","kita_regular","koica_yp"].includes(t.org.id)))
    warnings.push("영어 회화 자신감이 낮은 상태에서 KOTRA/KITA/KOICA 계열은 면접 시 불리. OPIc IH 또는 회화 모임 지속 권장.");
  if (r.honesty === "flex")
    warnings.push("정직 기준에 \'상황에 따라 유연\' 답변은 처음 강조한 신앙 가치(정직·공정)와 다소 어긋납니다. 0단계 답변을 다시 보실 것을 권합니다.");
  if (warnings.length) {
    html += '<div class="warning-box" style="margin-top:14px"><b>점검 필요 사항:</b><ul style="margin-top:6px;padding-left:18px">'
      + warnings.map(w => '<li style="margin-bottom:4px">' + w + '</li>').join("") + '</ul></div>';
  }

  html += '<div style="margin-top:18px;padding:14px;background:#f4e9d0;border-radius:6px;font-size:14px;font-style:italic;color:#5a4815">"사람이 마음으로 자기의 길을 계획할지라도 그의 걸음을 인도하시는 이는 여호와시니라" — 잠언 16:9</div></div>';
  return html;
}

function exportAnswers() {
  const data = { exported_at: new Date().toISOString(), answers: state.answers };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "career_answers_" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(url);
}

load();
render();
