<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>잠긴 페이지</title>
<style>
:root{color-scheme:light;--bg:#faf9f5;--fg:#141413;--mu:#6b6a63;--line:#dedcd3;--acc:#b5532f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1d1c19;--fg:#f2f1ec;--mu:#a9a79e;--line:#3a3934;--acc:#e8916f}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:420px;margin:0 auto;padding:16vh 20px 40px;display:grid;gap:14px}
h1{font-size:22px;line-height:1.3;margin:0}p{margin:0;color:var(--mu)}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:inherit}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
.err{color:var(--acc);font-weight:700}
</style></head><body>
<main id="lock" hidden>
<h1>🔒 받은 링크로만 열 수 있어요</h1>
<p>링크를 처음부터 끝까지 그대로 열어 주세요. 주소 끝 <b>#</b> 뒤의 글자가 열쇠예요.</p>
<form id="f"><input id="k" placeholder="받은 링크를 여기에 붙여 넣기" aria-label="받은 링크" autocomplete="off" autocapitalize="off" spellcheck="false"><button>열기</button></form>
<p id="e" class="err" hidden></p>
</main>
<script>
// 잠긴 게임: 게임 전체를 AES-GCM으로 잠가 이 파일에 넣었어요. 열쇠는 링크의 # 뒤에만 있어요(서버로 가지 않음, 저장소에도 없음).
// 맞는 열쇠면 풀어서 이 자리에 게임을 그대로 띄우고, 이 기기에 열쇠를 기억해 두어 다음엔 주소만으로도 열려요
(() => {
  const SITE = /*@@SITE@@*/null;
  const KEEP = 'word-game-site-key';
  const bytes = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const keyIn = s => { const m = String(s || '').trim().match(/(?:^|[#&])(?:k=)?([A-Za-z0-9_-]{43})(?=$|&)/); return m ? m[1] : ''; };
  const kept = () => { try { return localStorage.getItem(KEEP) || ''; } catch (e) { return ''; } };
  const open = async k => {
    if (!k || !SITE || !(window.crypto && crypto.subtle)) return false;
    let html;
    try {
      const key = await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
      html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(SITE.iv) }, key, bytes(SITE.data)));
    } catch (e) { return false; }
    try { localStorage.setItem(KEEP, k); } catch (e) { }
    // 이 페이지를 다 읽은 뒤에 바꿔 넣어요 (읽는 도중에 바꾸면 잠금 화면의 제목·모양이 게임에 남아요)
    if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
    document.open(); document.write(html); document.close();
    return true;
  };
  const show = msg => {
    document.getElementById('lock').hidden = false;
    const e = document.getElementById('e'); e.hidden = !msg; e.textContent = msg || '';
  };
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const k = keyIn(document.getElementById('k').value);
    if (!(await open(k))) show(k ? '이 링크로는 열 수 없어요. 받은 링크를 다시 확인해 주세요.' : '링크 끝 # 뒤까지 모두 붙여 넣어 주세요.');
  });
  (async () => {
    if (!(window.crypto && crypto.subtle)) return show('이 브라우저에서는 열 수 없어요. 최신 브라우저로 열어 주세요.');
    const k = keyIn(location.hash);
    if (await open(k)) return;
    if (kept() !== k && await open(kept())) return;
    show(k ? '이 링크로는 열 수 없어요. 받은 링크를 다시 확인해 주세요.' : location.hash.length > 1 ? '링크가 잘린 것 같아요. 받은 링크 전체를 그대로 열어 주세요.' : '');
  })();
})();
</script>
</body></html>
