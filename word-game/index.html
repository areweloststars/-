  }
  function triHits(tri, b, m = 2) {
    const [p, q, t] = tri;
    for (let i = 0; i <= 12; i++) {
      const u = i / 12;
      for (const e of [p, q, [(p[0] + q[0]) / 2, p[1]]]) {
        const X = e[0] + (t[0] - e[0]) * u, Y = e[1] + (t[1] - e[1]) * u;
        if (X > b[0] - m && X < b[2] + m && Y > b[1] - m && Y < b[3] + m) return true;
      }
    }
    return false;
  }

  /* ---------- 칸 배치 ---------- */
  function layout(n, W, H) {
    const pad = Math.max(6, Math.round(Math.min(W, H) * 0.034));
    const tall = H > W * 1.4;
    const hasG = n.ground !== 'none';
    // 세로로 긴 칸은 땅을 조금 올려 빈 하늘을 줄여요
    const gTop = hasG ? Math.round(H * (tall ? 0.72 : 0.8)) : H;
    const foot0 = hasG ? Math.round(H - (H - gTop) * 0.4) : H - pad;
    const sj = buildSubject(n, W, H);
    const sw = sj.box[2] - sj.box[0], sh = sj.box[3] - sj.box[1];
    // 들 수 없으면 소품으로
    let props = n.props.slice();
    if (n.hold && !sj.hold) props = [n.hold, ...props].slice(0, 2);
    const mark = n.mark;
    const markM = mark !== 'none' ? lim(Math.round(H * 0.155), 24, 46) : 0;
    // 크기 한계: 칸 높이의 80%, 칸 너비, 선 굵기.
    // 큰 칸에서는 선이 조금 굵어져도 더 크게 그려요. 세로로 긴 칸(2칸·3칸 쪽)은 넓이로 따져요
    const big = H > W * 1.2 ? lim(Math.sqrt(W * H) / 238, 1, 1.5) : lim(Math.min(W, H) / 238, 1, 1.35);
    // 세로로 긴 칸에서 큰 동물은 등 쪽이 칸 밖으로 조금(폭의 30%까지) 잘려도 돼요
    const back = tall && sj.cropSide ? 0.3 : 0;
    let sCap = Math.min((H * 0.8) / sh, (W - 8) / (sw * (1 - back)), sj.sMax * big);
    if (sj.isEmoji) sCap = Math.min(H * 0.4, (W - 8) / sw, 120 * big);
    if (!sj.crop && !sj.float && !sj.isEmoji) sCap = Math.min(sCap, (foot0 - 6) / (-sj.box[1]));
    const sMin = sCap * 0.3;
    const signs = signLayouts(n.sign, n.signStyle, W, H, pad);
    const flips = sj.dir ? [1, -1] : (sj.person && sj.hold) || sj.person && n.subject.pose === 'point' ? [1, -1] : [1];
    const xs = W / 2;

    const ratioOf = b => (b.s * (sj.isEmoji ? 1.22 : sh)) / H;
    let curProps = props;

    let best = search(props);
    // 소품 때문에 주인공이 많이 작아지면(소품 없을 때의 70% 밑, 또는 칸 높이의 45% 밑) 소품을 하나씩 빼요.
    // 주인공이 소품보다 중요해요. 들 수 없어서 소품이 된 물건(맨 앞)부터, 그다음 뒤에 적힌 소품을 빼요
    if (props.length) {
      const free = search([]);
      let holdProp = !!(n.hold && !sj.hold);

    curProps = props;
    if (!best) {
      // 마지막 수단: 주인공만 작게 가운데에
      const s = sMin, p = props.length ? Math.min(Math.round(H * 0.12), Math.round(64 * big)) : 0;
      best = { s, p, x: W / 2, foot: sj.crop ? H : foot0, S: null, flip: 1, side: props.length === 2 ? 'S' : 'R', propR: [], markC: null, holdR: null, mouthP: [W / 2, H / 2], fallback: true };
      best.propR = propRects(best.p, best.side, foot0);
    }
    return { ...best, sj, props, pad, gTop, hasG, markM, foot0 };

    // 말풍선은 머리 가까이로 내려요 (꼬리가 길게 늘어지지 않게). 내려서 꼬리가 z 글자나 표시를 지나가게 되면 덜 내려요
    function settle(f, S) {
      const r = S.r, hd = f.headR;
      const avoid = [f.zzR, f.markC ? box(f.markC[0], f.markC[1], markM, markM) : null].filter(Boolean);
      let shift = Math.min(hd[1], hd[3]) - lim(Math.round(H * 0.075), BUBBLE_GAP, 34) - r[3];
      const obs = [...(f.partsR || []), hd, ...f.propR, ...avoid];
      if (f.holdR) obs.push(f.holdR);
      for (const o of obs) if (o[0] < r[2] + 6 && o[2] > r[0] - 6 && o[1] >= r[3] - 0.5) shift = Math.min(shift, o[1] - 8 - r[3]);
      shift = Math.min(shift, (hasG ? gTop : H) - 12 - r[3]);
      for (; shift > 2; shift -= Math.max(3, shift / 3)) {
        const S2 = { ...S, r: [r[0], r[1] + shift, r[2], r[3] + shift] };
        const tip = tailTip(S2.r, hd, f.mouthP[0], W, avoid, sj.person ? null : f.partsR);
        if (!triHitsAny(tailTri(S2.r, tip), avoid)) return { S: S2, tip, tailZ: false };
      }
      const tip = tailTip(r, hd, f.mouthP[0], W, avoid, sj.person ? null : f.partsR);
      // 그래도 꼬리가 z 글자를 지나가면 z는 그리지 않아요
      return { S, tip, tailZ: !!(f.zzR && triHits(tailTri(r, tip), f.zzR)) };
    }

    function search(list) {
      curProps = list;
      const propSides = list.length === 2 ? ['R', 'L', 'S'] : list.length === 1 ? ['R', 'L'] : ['-'];
      const propSizes = list.length ? [0.2, 0.17, 0.14, 0.12].map(f => Math.min(Math.round(H * f), Math.round(64 * big))) : [0];
      let top = null;
      for (const sg of signs) for (const S of signRects(sg, W, H, pad)) for (const flip of flips) for (const side of propSides) {
        let found = null;
        for (let s = sCap; s >= sMin && !found; s *= 0.96) {
          for (const p of propSizes) {
            const res = tryPlace(s, p, S, flip, side);
            if (res) { found = res; break; }
          }
        }
        if (!found) continue;
        // 숨 쉴 틈: 빠듯하면 조금 줄여 가운데로
        if (found.s < sCap * 0.999) {
          const res2 = tryPlace(found.s * 0.94, found.p, S, flip, side);
          if (res2 && res2.bad <= found.bad) found = res2;
        }
        let Sf = S; // 말풍선은 머리 가까이로 내린 자리(가로 위치는 같아요)
        if (S && S.style === 'bubble') { const st = settle(found, S); Sf = st.S; found = { ...found, tip: st.tip, tailZ: st.tailZ }; }

        }
        if (S && S.pos === 'tc' && S.style !== 'banner') score -= 0.01;

        score -= 0.04 * Math.abs(found.x - xs) / W;
        if (list.length && n.hold && !sj.hold && side !== 'S') { // 들 물건이 소품이 되면 바라보는 쪽에
          const facing = (sj.dir || 1) * flip;

        if (found.tailZ) score -= 0.12;
        if (found.markOv) score -= 0.1 * Math.min(1, found.markOv / (markM * markM));
        if (!top || score > top.score) top = { ...found, S: Sf, flip, side, score };
      }
      return top;
    }
    function propRects(p, side, foot) {
      const props = curProps;
      if (!props.length || !p) return [];
      const w = p * EMO_W, h = p * EMO_H, y1 = Math.min(foot + p * 0.08, H - 3), y0 = y1 - h;
      const gap = Math.round(p * 0.12);
      const L = x => [x, y0, x + w, y1];
      if (side === 'L') return props.length === 2 ? [L(pad), L(pad + w + gap)] : [L(pad)];
      if (side === 'R') return props.length === 2 ? [L(W - pad - w * 2 - gap), L(W - pad - w)] : [L(W - pad - w)];
      return [L(pad), L(W - pad - w)];
    }
    function tryPlace(s, p, S, flip, side) {

      const bb0 = T(sj.box, 0);
      if (bb0[1] < 3) return null;
      if (!sj.crop && bb0[3] > H + 1) return null;
      const edge = sj.crop ? -s * 20 : 3;

      const block = [];
      const addBlock = (part, ob, m) => { // part는 x=0 기준 사각형
        if (part[1] >= ob[3] + m || part[3] <= ob[1] - m) return;
        block.push([ob[0] - m - part[2], ob[2] + m - part[0]]);
      };
      const partsP = sj.parts.map(r => T(r, 0));

      if (sj.hold) { const q = sj.hold.q * s; const c = [flip * sj.hold.c[0] * s, foot + sj.hold.c[1] * s]; holdP = box(c[0], c[1], q * EMO_W, q * EMO_H); }
      const obst = [];
      if (S) obst.push([S.r, 7, 'sign']);
      for (const r of pr) obst.push([r, 3, 'prop']);
      for (const [ob, m, kind] of obst) {
        for (const part of partsP) addBlock(part, ob, m);
        if (zzP) addBlock(zzP, ob, m);
        addBlock(headP, ob, m + 3);
        if (holdP) addBlock(holdP, ob, kind === 'sign' ? 5 : 3);
      }
      if (holdP) { block.push([-Infinity, 3 - holdP[0]]); block.push([W - 3 - holdP[2], Infinity]); if (holdP[1] < 3) return null; }
      // 말풍선 꼬리: 입이 풍선 아래, 너무 옆으로 비껴가지 않게
      let mouthRel = [flip * sj.mouth[0] * s, foot + sj.mouth[1] * s];
      if (S && S.style === 'bubble') {
        const dy = headP[1] - S.r[3];
        if (dy < BUBBLE_GAP) return null;
        const reach = Math.max(10, dy * 1.1);

        block.push([-Infinity, S.r[0] - reach - mouthRel[0]]);

      }

// 예전 기본 단어장(교재 Day 02)의 진행 기록은 SAVE.decks.day02에 지우지 않고 그대로 둠
const OLD_BUILTIN_ID = 'day02';
let DECK = DECK_BUILTIN;
let BUILTIN = null;
const PROG_KEYS = ['best', 'wrong', 'seen', 'lives', 'bank', 'done'];

function snapshotBuiltin() { BUILTIN = { words: Object.assign({}, WORDS), scenes: SCENES.slice(), art: Object.assign({}, ART) }; }
function applyDeckData(d) {
  for (const k of Object.keys(WORDS)) delete WORDS[k];
  Object.assign(WORDS, d.words);
  SCENES.length = 0; SCENES.push(...d.scenes);
  for (const k of Object.keys(ART)) delete ART[k];
  Object.assign(ART, d.art);
  for (const k of Object.keys(TPL)) delete TPL[k];
  for (const k of Object.keys(IMG)) delete IMG[k];
  if (SP) SP.key = null;
  if (PP) PP.key = null;
}
function stashProgress() {
  if (!SAVE.decks || typeof SAVE.decks !== 'object') SAVE.decks = {};
  SAVE.decks[SAVE.deck || DECK_BUILTIN.id] = Object.fromEntries(PROG_KEYS.map(k => [k, SAVE[k]]));
}
function loadProgress(id) {
  const p = (SAVE.decks || {})[id] || {};
  SAVE.best = p.best && typeof p.best === 'object' ? p.best : {};
  SAVE.wrong = p.wrong && typeof p.wrong === 'object' ? p.wrong : {};
  SAVE.seen = p.seen && typeof p.seen === 'object' ? p.seen : {};
  SAVE.lives = typeof p.lives === 'number' && p.lives > 0 ? Math.min(LIVES, p.lives) : LIVES;
  SAVE.bank = Math.max(0, +p.bank || 0);
  SAVE.done = Math.max(0, +p.done || 0);
  SAVE.deck = id;
}
// 저장된 단어장(JSON) → 앱이 쓰는 WORDS·SCENES·ART
function deckRuntime(deck) {
  const words = {}, scenes = [], art = {};
  for (const [id, w] of Object.entries(deck.words || {})) {
    if (!w || typeof w !== 'object') continue;
    const ans = (Array.isArray(w.ans) ? w.ans : []).filter(g => g && Array.isArray(g.ok)).map(g => ({ t: String(g.t), ok: g.ok.map(String).filter(Boolean) })).filter(g => g.ok.length);
    if (!ans.length) continue; // 정답이 없는 단어는 깰 수 없으니 뺌
    // 화면·복습에 보일 뜻은 게임이 정답으로 받는 뜻으로 (사진 글자 오류가 남은 옛 단어장도 깔끔하게)
    words[id] = Object.assign({}, w, { id, m: ans.map(g => g.t).join(', ') || String(w.m || ''), ans });
  }
  const has = id => Object.prototype.hasOwnProperty.call(words, id);
  (Array.isArray(deck.scenes) ? deck.scenes : []).forEach((s, i) => {
    if (!s || !Array.isArray(s.words)) return;
    // 자막의 단어 표시는 이 단어장에 실제로 있는 단어만
    const lines = (Array.isArray(s.lines) ? s.lines : []).filter(l => typeof l === 'string').map(l => l.replace(/\{([^|}]+)\|([^}]+)\}/g, (all, id, t) => has(id) ? all : t));
    const sc = { key: String(s.key), title: String(s.title || '에피소드'), words: s.words.filter(has), lines, n: i + 1 };
    if (!sc.words.length) return;
    sc.n = scenes.length + 1;
    scenes.push(sc);
    const P = comicPanels(sc.words.length);
    sc.words.forEach((id, k) => { words[id].scene = sc.key; words[id].spot = P[k]; });
    const specs = (deck.panels && deck.panels[sc.key]) || [];
    const all = s.words; // 그림 칸 설계는 원래 단어 순서대로 저장돼 있음
    art[sc.key] = genScene(sc.words.map(id => specs[all.indexOf(id)] || { subject: { kind: 'emoji', emoji: '📘' }, sign: shortW(id).slice(0, 18) }));
  });
  return { words, scenes, art };
}
// 시작할 때: 마지막으로 쓰던 단어장을 다시 엶 (저장된 진행 기록은 그 단어장 것)
function bootDeck() {
  if (!SAVE.decks || typeof SAVE.decks !== 'object') SAVE.decks = {};
  // 예전 기본 단어장을 쓰던 기록(단어장 표시가 없던 더 옛날 기록 포함)은 그 이름 그대로 보관하고, 창작 데모를 새로 시작
  if (SAVE.deck === OLD_BUILTIN_ID || (!SAVE.deck && SAVE.best && Object.keys(SAVE.best).length)) { SAVE.deck = OLD_BUILTIN_ID; stashProgress(); loadProgress(DECK_BUILTIN.id); }
  const id = typeof SAVE.deck === 'string' && SAVE.deck ? SAVE.deck : DECK_BUILTIN.id;
  SAVE.deck = id;
  if (id === DECK_BUILTIN.id) return;
  const d = DeckStore.get(id);
  let rt = null;
  try { rt = d ? deckRuntime(d) : null; } catch (e) { rt = null; }
  if (rt && rt.scenes.length) { DECK = { id: d.id, name: d.name, builtin: false }; applyDeckData(rt); }
  else { stashProgress(); loadProgress(DECK_BUILTIN.id); }
}
// 단어장 바꾸기. 바라던 단어장을 열었으면 true
function switchDeck(id) {
  stashProgress();
  const d = id && id !== DECK_BUILTIN.id ? DeckStore.get(id) : null;
  let ok = !id || id === DECK_BUILTIN.id;
  if (!d) { DECK = DECK_BUILTIN; applyDeckData(BUILTIN); loadProgress(DECK_BUILTIN.id); }
  else {
    let rt = null;
    try { rt = deckRuntime(d); } catch (e) { rt = null; }
    if (!rt || !rt.scenes.length) { DECK = DECK_BUILTIN; applyDeckData(BUILTIN); loadProgress(DECK_BUILTIN.id); toast('이 단어장은 망가져서 열 수 없어요. 기본 단어장을 열었어요'); }
    else { DECK = { id: d.id, name: d.name, builtin: false }; applyDeckData(rt); loadProgress(d.id); ok = true; }
  }
  persist();
  return ok;
}

/* ---------- 단어장 보관함: 이 기기(localStorage) + 가능하면 Claude 저장소(db, 내 계정 전용) ---------- */
const DeckStore = (() => {
  const KEY = 'voca-decks-v1', DEL = 'voca-decks-del-v1';
  let cache = {}, tomb = {}, db = null, uid = null, listeners = [];
  const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  function loadLocal() {
    try { cache = obj(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { cache = {}; }
    try { tomb = obj(JSON.parse(localStorage.getItem(DEL) || '{}')); } catch (e) { tomb = {}; }
  }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(cache)); localStorage.setItem(DEL, JSON.stringify(tomb)); return true; } catch (e) { return false; } }
  const valid = d => d && typeof d === 'object' && d.id && Array.isArray(d.scenes) && !d.deleted;
  const coll = () => db.doc('data/users/' + uid + '/profile').collection('decks');
  const changed = () => listeners.forEach(f => { try { f(); } catch (e) { } });
  loadLocal();
  return {
    list() { return Object.values(cache).filter(valid).sort((a, b) => (b.updated || 0) - (a.updated || 0)); },
    get(id) { return Object.prototype.hasOwnProperty.call(cache, id) && valid(cache[id]) ? cache[id] : null; },
    onChange(f) { listeners.push(f); },
    get cloud() { return !!db; },
    async put(deck) {
      deck.updated = Date.now();
      if (uid && !deck.owner) deck.owner = uid;
      cache[deck.id] = deck; delete tomb[deck.id];
      const local = saveLocal();
      let cloud = false;
      if (db) { try { await coll().doc(deck.id).set(deck); cloud = true; } catch (e) { cloud = false; } }
      changed();
      return { local, cloud };
    },
    // 지울 때는 '지웠다'는 표시를 남겨서, 다른 기기나 늦게 연결된 저장소가 다시 올리지 않게
    async del(id) {
      const now = Date.now();
      delete cache[id]; tomb[id] = now; saveLocal();
      if (db) { try { await coll().doc(id).set({ id, deleted: true, updated: now }); } catch (e) { } }
      changed();
    },
    // 내 계정 저장소에 연결해서, 다른 기기에서 만든 단어장도 가져옴
    async connect() {
      try {
        if (!window.claude || typeof claude.use !== 'function') return;
        const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
        if (!d || !u) return;
        const id = await u.id();
        if (!id) return;
        db = d; uid = id;
        const snap = await coll().get();
        let any = false;
        const ids = new Set();
        for (const doc of snap.docs) {
          const v = doc.data(); ids.add(doc.id);
          if (!v || !v.id) continue;
          const mine = cache[v.id], up = +v.updated || 0;
          if (v.deleted) { // 다른 기기에서 지운 단어장
            if (mine && (+mine.updated || 0) <= up) { delete cache[v.id]; any = true; }
            if ((+tomb[v.id] || 0) < up) { tomb[v.id] = up; any = true; }
            continue;
          }
          if ((+tomb[v.id] || 0) >= up) { try { await coll().doc(v.id).set({ id: v.id, deleted: true, updated: +tomb[v.id] }); } catch (e) { } continue; } // 이 기기에서 지웠는데 저장소엔 남아 있던 것
          if (!Array.isArray(v.scenes)) continue;
          if (!mine || up > (+mine.updated || 0)) { cache[v.id] = JSON.parse(JSON.stringify(v)); any = true; }
        }
        // 이 기기에만 있던 내 단어장(또는 로그인 전에 만든 것)만 계정 저장소에 올림. 다른 사람 단어장은 올리지 않음
        for (const v of Object.values(cache)) {
          if (!valid(v) || ids.has(v.id) || tomb[v.id] || (v.owner && v.owner !== uid)) continue;
          v.owner = uid; any = true;
          try { await coll().doc(v.id).set(v); } catch (e) { }
        }
        if (any) { saveLocal(); changed(); }
      } catch (e) { db = null; }
    }
  };
})();

/* ================= 사진으로 새 단어장 만들기 =================
   1) 단어장 사진 → 이 기기 안에서 글자 인식(OCR)으로 영어 단어와 뜻을 읽음 (API 없이)  2) 학생이 확인·수정
   3) 바로 만들기: 단어를 에피소드로 나누고, 뜻을 보고 그림 칸(이모지·사람·동물)을 자동으로 골라 게임으로
      (Claude를 쓸 수 있는 화면에서는 고르면 이야기·팁·예문까지 Claude가 써 줌)
   4) 그림 꾸미기: 단어마다 그림 칸을 눌러서 주인공·배경·글씨를 바꿈 → genScene()이 만화 한 쪽으로 그림 */
const MK = { useAI: false, run: null, art: null, step: 'pick', images: [], rows: [], name: '', ctl: null, err: '', note: '', log: [], sample: null, caps: null, ready: false, deck: null, paste: '', pasteOpen: null };

  if (c === 'rate_limited') return 'Claude 사용량이 잠깐 많아요. 조금 뒤에 다시 눌러 주세요.';
  if (c === 'session_expired') return '로그인이 끝났어요. 다시 로그인한 뒤 해 주세요.';

  return '잠깐 연결이 불안정해요. 다시 눌러 주세요.';
}
// 품사 표시(n. v. adj. …)와 발음기호([ˈ…], /…/)는 단어·뜻에서 뺌
const POS_TOK = /(^|\s)\(?(?:n|v|a|adj|adv|ad|prep|conj|vt|vi|pron|int)\.\)?(?=\s|$)/gi;
const IPA_TOK = /\[[^\]가-힣]*\]|\/[^/\s가-힣][^/가-힣]{0,30}\//g;
function mkCleanEn(s) { return String(s || '').replace(IPA_TOK, ' ').replace(POS_TOK, ' ').replace(/[{}|<>"]/g, '').replace(/\s+/g, ' ').replace(/^[\s\-–—:=~.,]+|[\s\-–—:=~.,]+$/g, '').trim().slice(0, 40); }
function mkCleanKo(s) { return String(s || '').replace(IPA_TOK, ' ').replace(POS_TOK, ' ').replace(/[{}|<>]/g, '').replace(/\s+/g, ' ').replace(/^[\s\-–—:=.,]+|[\s\-–—:=,]+$/g, '').trim().slice(0, 60); }
// 쓸 수 있는 줄: 영어와 (글자가 있는) 뜻이 다 있음
const mkRowOk = r => !!(mkCleanEn(r.en) && mkCleanKo(r.ko) && mkAnsFrom(null, mkCleanKo(r.ko)).length);
const mkValidRows = () => mkDedupe(MK.rows).filter(mkRowOk);

B. "words": 단어마다 객체 하나(키는 영어 단어 그대로):
 - "ipa": 미국식 발음기호(슬래시 없이), "kr": 한글 발음, "pos": n|v|a|d|p|x
 - "ans": 뜻 묶음 배열. 교재 뜻은 사진 글자 인식으로 읽은 것이라 깨진 글자(없는 낱말, 이상한 글자)가 섞일 수 있어. 깨져 보이면 그 영어 단어의 올바른 한국어 뜻으로 바로잡아. 교재 뜻을 쉼표로 나눈 뜻 하나가 묶음 하나(괄호 속 말은 설명이니 묶음으로 나누지 마). 묶음 = [화면에 보일 뜻, 학생이 칠 만한 다른 표현들(어간, 띄어쓰기만 다른 형태, 아주 가까운 동의어)]. 예: [["탐험하다","탐험"],["조사하다","조사"]]. 다른 묶음의 말이 서로 포함되지 않게.
 - "tip": 외우기 팁(어원이나 연상, 한국어 한 문장), "ex": 쉬운 영어 예문(단어를 [대괄호]로 감싸), "exKo": 예문 해석
 - "panel": 이 단어의 그림 칸 설계(아래 형식). 한 칸 = 이야기의 그 장면, 주인공 하나를 크게. "sign"은 장면 속 표지판·대사처럼 뜻을 떠올리게 하는 말(한국어 2줄 이내, 줄당 9자 이내). 정답 뜻을 그대로 쓰지는 마.
 - "pic": 그 그림 칸에 무엇이 있고 왜 이 뜻인지 1~2문장(90자 이내, 한국어)

          mkLogSet(li, 'ok', `에피소드 ${k + 1} ‘${ep.title}’ 완성`);

  if (!$('#make').hidden) renderMake();

/* ---------- 이벤트 ---------- */
function bindMake() {
  const el = $('#make');
  // 직접 입력한 단어 목록은 화면이 다시 그려져도 남게
  el.addEventListener('input', e => {
    if (e.target.id === 'mkpaste') MK.paste = e.target.value;
    else if (e.target.id === 'arsign' && MK.art && MK.art.spec) { MK.art.spec.sign = e.target.value; arPreview(); }
    else if (e.target.id === 'aremo' && MK.art && MK.art.spec && e.target.value.trim()) { const sp = genNormalize({ subject: { kind: 'emoji', emoji: e.target.value } }); if (sp.subject.emoji !== '⭐' || e.target.value.includes('⭐')) { MK.art.spec.subject = sp.subject; arPreview(); } }
  });
  el.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('mkpaste')) MK.pasteOpen = e.target.open; }, true);
  // 사진 붙여넣기 (파일 고르기 창이 안 열리는 앱 화면에서도 됨)
  el.addEventListener('paste', e => {
    if (MK.step !== 'pick' || e.target.id === 'mkpaste') return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => /^image\//.test(f.type));
    if (!files.length) { if (e.target.id === 'mkdrop') { const t = e.clipboardData && e.clipboardData.getData('text'); e.preventDefault(); if (t && t.trim()) { MK.paste = (MK.paste ? MK.paste + '\n' : '') + t.trim(); MK.pasteOpen = true; renderMake(); toast('붙여넣은 글자를 아래 입력 칸에 넣었어요'); } else toast('사진을 찾지 못했어요. 갤러리에서 사진을 ‘복사’한 뒤 붙여넣어 주세요'); } return; }
    e.preventDefault();
    for (const file of files) { if (MK.images.length >= OCR_MAX) break; MK.images.push({ file, url: URL.createObjectURL(file) }); }
    MK.err = ''; renderMake(); toast(`사진 ${files.length}장을 넣었어요`);
  });
  el.addEventListener('beforeinput', e => { if (e.target.id === 'mkdrop' && !/paste/i.test(e.inputType || '')) e.preventDefault(); });
  el.addEventListener('change', e => {
    const f = e.target.closest('[data-mkfile]'); if (!f) return;
    const max = OCR_MAX;
    for (const file of Array.from(f.files || [])) { if (MK.images.length >= max) break; MK.images.push({ file, url: URL.createObjectURL(file) }); }
    f.value = ''; MK.err = ''; renderMake();
  });
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-mk]'); if (!b) return;
    const a = b.dataset.mk;
    Sound.unlock();
    if (a.startsWith('ar') && a !== 'arpick' && a !== 'ardone' && a !== 'arcancel' && a !== 'arsave' && MK.art && MK.art.spec) { arAct(a, b.dataset.v || ''); const y = window.scrollY; renderMake(); window.scrollTo(0, y); return; }
    if (a === 'home') { if (MK.step === 'reading' || MK.step === 'making') { toast('만드는 중이에요. 다 만들면 알려 드릴게요'); } goHome(); }
    else if (a === 'rmimg') { const i = +b.dataset.i, im = MK.images[i]; if (im) { URL.revokeObjectURL(im.url); MK.images.splice(i, 1); } renderMake(); }
    else if (a === 'read') mkRead();
    else if (a === 'stop') { if (MK.step === 'reading') { ocrStop(); MK.step = 'pick'; renderMake(); } else if (MK.ctl) MK.ctl.abort(); }
    else if (a === 'art') { if (MK.deck) openArt(MK.deck.id); }
    else if (a === 'arpick') { const d = arDeck(); if (!d) return; const key = b.dataset.key, k = +b.dataset.k; MK.art.sel = { key, k }; MK.art.spec = genNormalize(JSON.parse(JSON.stringify(((d.panels || {})[key] || [])[k] || {}))); renderMake(); window.scrollTo(0, 0); }
    else if (a === 'arcancel') { MK.art.sel = null; MK.art.spec = null; renderMake(); }
    else if (a === 'arsave') arSave();
    else if (a === 'ardone') { const back = MK.art && MK.art.back; MK.art = null; if (back === 'done' && MK.deck) { MK.step = 'done'; renderMake(); window.scrollTo(0, 0); } else { MK.step = 'pick'; goHome(); } }
    else if (a === 'parse') {
      MK.paste = ($('#mkpaste') || {}).value || '';
      const parsed = mkParse(MK.paste), rows = mkDedupe(parsed);
      if (!rows.length) { MK.err = '‘영어 - 뜻’ 모양의 줄을 찾지 못했어요.'; renderMake(); return; }
      MK.note = [parsed.skipped ? `읽지 못한 줄 ${parsed.skipped}개는 뺐어요.` : '', rows.length > MK_MAX ? `단어가 많아서 앞의 ${MK_MAX}개만 가져왔어요.` : ''].filter(Boolean).join(' ');
      MK.rows = rows.slice(0, MK_MAX); MK.err = ''; MK.step = 'review'; voiceWarm(); renderMake();
    }
    else if (a === 'rmrow') { MK.rows.splice(+b.dataset.i, 1); renderMake(); }
    else if (a === 'addrow') { MK.rows.push({ en: '', ko: '', pos: 'x' }); renderMake(); const ins = document.querySelectorAll('#make .mken'); if (ins.length) ins[ins.length - 1].focus(); }
    else if (a === 'make' || a === 'makeai') { const nm = $('#mkname'); if (nm) MK.name = nm.value; MK.useAI = a === 'makeai'; mkMake(); }
    else if (a === 'restart') { MK.step = 'pick'; MK.rows = []; MK.err = ''; MK.note = ''; renderMake(); }
    else if (a === 'play') { const d = MK.deck; MK.step = 'pick'; MK.deck = null; if (d) switchDeck(d.id); goHome(); }
  });
}

  openOverlay(`<h2>단어장</h2>
    <ul class="decklist">
      ${row(DECK_BUILTIN.id, DECK_BUILTIN.name, Object.keys(BUILTIN.words).length, BUILTIN.scenes.length, DECK.id === DECK_BUILTIN.id, true)}

    <div class="ractions"><button type="button" class="btn good" data-ov="make">${ICON.camera}사진으로 새 단어장 만들기</button><button type="button" class="btn" data-ov="close">닫기</button></div>`);
}

const STORE_KEY = 'day02-voca-mission-v1';
const SAVE = { v: 2, dir: 'en', diff: 'normal', sound: true, narr: true, rate: 1, best: {}, wrong: {}, seen: {}, lives: 3, bank: 0, done: 0 };
function loadSave() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === 'object') {
        // 규칙이 바뀐 예전 기록(‘알아요’ 방식)의 클리어 기록은 새 게임에 넘기지 않음
        if (d.v !== 2) { delete d.best; delete d.lives; delete d.bank; delete d.done; }
        Object.assign(SAVE, d); SAVE.v = 2;
      }
    }
  } catch (e) { /* 저장소를 쓸 수 없는 환경이면 기록 없이 진행 */ }
}
function persist() { try { stashProgress(); localStorage.setItem(STORE_KEY, JSON.stringify(SAVE)); } catch (e) { } }

/* 휴대폰 '뒤로'(안드로이드 뒤로 제스처): 앱을 떠나지 않고 한 단계씩 돌아가게 방문 기록을 맞춰 둠
   홈 = 0칸, 다른 화면 = 1칸, 전체화면이면 1칸 더. 화면이 바뀔 때마다 navSync()가 기록 깊이를 맞춰요.
   (뒤로 이동은 비동기라, 이동이 끝나기 전에는 새 기록을 쌓지 않고 끝난 뒤에 다시 맞춤) */
const NAV = { depth: 0, skip: 0 };
const navWanted = () => ($('#home').hidden ? 1 : 0) + (FS.on ? 1 : 0);
function navSync() {
  if (NAV.skip > 0) return;
  const want = navWanted();
  try {
    while (NAV.depth < want) { history.pushState({ voca: NAV.depth + 1 }, ''); NAV.depth++; }
    if (NAV.depth > want) { const n = NAV.depth - want; NAV.skip++; NAV.depth = want; history.go(-n); }
  } catch (e) { NAV.skip = 0; }
}
function onNavBack() {
  const d = (history.state && +history.state.voca) || 0;
  if (NAV.skip > 0) { NAV.skip--; NAV.depth = d; navSync(); return; } // 앱 단추로 돌아가며 정리한 기록
  NAV.depth = d;
  if (FS.on && d < navWanted()) { exitFS(); return; }
  if ($('#home').hidden && d === 0) {
    // 미션 중이면 바로 나가지 않고 일시정지 창을 보여 줌
    if (!$('#play').hidden && M.active && !M.over) { if (!M.paused) pause(); navSync(); return; }
    goHome();
  }
}

const MARK = /\{([^|}]+)\|([^}]+)\}/g;
function parseLine(line) {
  let word = null;
  line.replace(MARK, (_, id) => { word = word || id; return ''; });
  return {
    word,
    plain: line.replace(MARK, (_, id, t) => t),
    sub: esc(line).replace(MARK, (_, id, t) => `<mark><i>${esc(shortW(id))}</i>${t}</mark>`),
    text: esc(line).replace(MARK, (_, id, t) => `<button type="button" class="wchip" data-id="${id}"><i>${esc(shortW(id))}</i>${t}</button>`)
  };
}
// 스토리 영상 뒤에 이어지는 단어 복습 한 장면
function recapItem(id, k, n) {
  const w = WORDS[id];

    if (e.target.closest('#picbtn')) { togglePic(); return; }
    const fresh = performance.now() - (M.barAt || 0) < 400;
    if (e.target.closest('#dont')) { if (fresh) return; Sound.unlock(); dont(); return; }
    if (e.target.closest('#next')) { if (fresh) return; nextCard(); return; }
  });
  document.addEventListener('click', e => {
    const dk = e.target.closest('[data-deck]');
    if (dk) { Sound.unlock(); Sound.play('tap'); if (dk.dataset.deck !== DECK.id && switchDeck(dk.dataset.deck)) toast(`‘${DECK.name}’ 단어장으로 바꿨어요`); goHome(); return; }
    const da = e.target.closest('[data-deckart]');
    if (da) { Sound.unlock(); Sound.play('tap'); openArt(da.dataset.deckart); return; }
    const dd = e.target.closest('[data-deckdel]');
    if (dd) {
      // 한 번 더 눌러야 지움 (실수 방지)
      if (!dd.dataset.armed) { dd.dataset.armed = '1'; dd.classList.add('armed'); dd.setAttribute('aria-label', '한 번 더 누르면 지워져요'); toast('한 번 더 누르면 이 단어장과 진행 기록이 지워져요'); return; }
      const id = dd.dataset.deckdel;
      if (DECK.id === id) switchDeck(DECK_BUILTIN.id);
      if (SAVE.decks) delete SAVE.decks[id];
      persist();
      DeckStore.del(id).then(() => { if ($('#ov .decklist')) openDecks(); });
      renderHome(); openDecks(); toast('단어장을 지웠어요');
      return;
    }
    const b = e.target.closest('[data-ov]');
    if (!b) return;
    const a = b.dataset.ov;
    if (a === 'resume') resume();
    else if (a === 'again') startPlay();
    else if (a === 'home') goHome();
    else if (a === 'story') openMission(M.kind, M.key);
    else if (a === 'next') { const n = nextMission(); if (n) openMission(n.kind, n.key); else goHome(); }
    else if (a === 'restart1') openMission('scene', SCENES[0].key);
    else if (a === 'make') openMake();
    else if (a === 'close') closeOverlay();
  });
  window.addEventListener('popstate', onNavBack);
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('keydown', e => {
    if (FS.on && e.key === 'Escape') { e.preventDefault(); exitFS(); return; }
    if (e.key === 'Escape' && $('#ov .decklist')) { e.preventDefault(); closeOverlay(); return; }
    if ($('#play').hidden || $('#ov') || !M.active) return;
    if (e.key === 'Escape') { e.preventDefault(); pause(); }
    else if (e.key === 'Enter' && M.state === 'answer' && document.activeElement !== $('#next')) { e.preventDefault(); if (performance.now() - (M.barAt || 0) >= 400) nextCard(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    if (M.active && !M.paused && !M.over) pause();
    if (!$('#story').hidden && (SV.on || SV.busy)) svPause(); // 화면이 꺼지면 스토리도 멈춤
    persist();
  });
  // 휴대폰 자판이 올라오면 보이는 높이에 맞춰 미션 화면을 줄여서 입력칸이 자판 바로 위에 오게
  setVVH();
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { setVVH(); if (!$('#play').hidden && window.scrollY) window.scrollTo(0, 0); });
  let rz = 0;
  window.addEventListener('resize', () => {
    setVVH();
    if (window.innerWidth > window.innerHeight) { const r = $('#vrot'); if (r) r.hidden = true; }
    clearTimeout(rz);
    rz = setTimeout(() => {
      if (PP && !$('#play').hidden && M.queue.length) { ppRefit(); fitWords(); }
      if (SP && !$('#story').hidden) spRelayout();
    }, 150);
  });
}

function boot(data) {
  loadSave();
  if (data && data.save && typeof data.save === 'object') Object.assign(SAVE, data.save);
  snapshotBuiltin();
  bootDeck();
  if (!DIFF[SAVE.diff]) SAVE.diff = 'normal';
  if (SAVE.dir !== 'en' && SAVE.dir !== 'ko') SAVE.dir = 'en';
  if (typeof SAVE.narr !== 'boolean') SAVE.narr = true;
  if (!RATES.includes(SAVE.rate)) SAVE.rate = 1;
  for (const k of ['best', 'wrong', 'seen', 'decks']) if (!SAVE[k] || typeof SAVE[k] !== 'object' || Array.isArray(SAVE[k])) SAVE[k] = {};
  SAVE.sound = SAVE.sound !== false;
  if (!(SAVE.lives > 0)) { SAVE.best = {}; SAVE.bank = 0; SAVE.lives = LIVES; }
  SAVE.lives = Math.min(LIVES, Math.round(SAVE.lives)); SAVE.bank = clamp(+SAVE.bank || 0, 0, BANK_MAX);
  const keep = new Set([...SCENES.map(s => s.key), 'boss', 'review']);
  for (const k in SAVE.best) if (!keep.has(k) || !SAVE.best[k] || typeof SAVE.best[k].elapsed !== 'number') delete SAVE.best[k];
  document.documentElement.lang = 'ko';
  bindEvents();
  bindMake();
  renderHome();
  showScreen('home');
  mkInit();
  // 내 Claude 계정 저장소에 연결되면 다른 기기에서 만든 단어장도 목록에 보임
  DeckStore.onChange(() => { if ($('#ov .decklist')) openDecks(); });
  DeckStore.connect();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('#play').hidden && M.queue.length) fitWords(); });
}
const HOT = window.claude && window.claude.hot;
try { if (HOT && HOT.snapshot) HOT.snapshot(() => ({ save: SAVE })); } catch (e) { }
if (HOT && HOT.ready) HOT.ready(boot); else boot((HOT && HOT.data) || {});

</script>

</body></html>
