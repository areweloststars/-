<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<meta name="theme-color" content="#ECEFF8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#12142E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="play.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
</head><body>
<title>그림 스토리 단어 미션</title>
<style>
/* Layout: 한 손으로 쓰는 모바일 미션 앱 — 위에는 도화선 타이머, 가운데 만화 칸 그림, 아래 단어 카드와 고정 버튼 */
:root {
  --bg: #ECEFF8;
  --surface: #FFFFFF;
  --surface2: #F2F4FB;
  --fg: #1D2140;
  --muted: #5A6086;
  --line: #D3D8EA;
  --frame: #1D2140;
  --tap: #B65A00;
  --meaning: #1A5FD0;
  --pic: #D9480F;
  --pic-ink: #FFFFFF;
  --good: #10915A;
  --on-good: #FFFFFF;
  --bad: #CF3448;
  --star: #F0A500;
  --hl: #FFD84D;
  --on-hl: #1D2140;
  --seg-on: #1D2140;
  --seg-on-fg: #FFFFFF;
  --scrim: rgba(14, 16, 38, .74);
  --chip-bg: #FFF0B3;
  --chip-line: #E9B400;
  --chip-en: #1A5FD0;
  --line-on: rgba(26, 95, 208, .12);
  --bonus: #8B5CF6;
  --life: #8B5CF6;
  --f-display: 'Black Han Sans', 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --f-word: 'Lilita One', 'Black Han Sans', 'Arial Rounded MT Bold', sans-serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-ipa: 'Noto Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12142E; --surface: #1C1F42; --surface2: #262A55; --fg: #F1F2FF; --muted: #A5AAD3; --line: #353B70;
    --frame: #05061A; --tap: #FFD23F; --meaning: #6CB8FF; --pic: #FF8A5B; --pic-ink: #1D2140; --good: #36D27E; --on-good: #0B1F14;
    --bad: #FF6474; --star: #FFD23F; --hl: #FFD23F; --on-hl: #1D2140; --seg-on: #F1F2FF; --seg-on-fg: #12142E;
    --scrim: rgba(4, 5, 18, .8); --chip-bg: rgba(255, 210, 63, .14); --chip-line: #FFD23F; --chip-en: #FFD23F; --line-on: rgba(108, 184, 255, .17); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12142E; --surface: #1C1F42; --surface2: #262A55; --fg: #F1F2FF; --muted: #A5AAD3; --line: #353B70;
  --frame: #05061A; --tap: #FFD23F; --meaning: #6CB8FF; --pic: #FF8A5B; --pic-ink: #1D2140; --good: #36D27E; --on-good: #0B1F14;
  --bad: #FF6474; --star: #FFD23F; --hl: #FFD23F; --on-hl: #1D2140; --seg-on: #F1F2FF; --seg-on-fg: #12142E;
  --scrim: rgba(4, 5, 18, .8); --chip-bg: rgba(255, 210, 63, .14); --chip-line: #FFD23F; --chip-en: #FFD23F; --line-on: rgba(108, 184, 255, .17); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: break-word; /* 한국어는 낱말 단위로 줄바꿈 */
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--meaning); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 28px; overflow-x: clip; }
@supports not (overflow: clip) { body { overflow-x: hidden; } }
[hidden] { display: none !important; }
.app.shake { animation: shake .55s; }

/* ---------- 홈 ---------- */
.eyebrow { font-family: var(--f-word); font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 6px 0 0; }
.home h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 8.6vw, 38px); line-height: 1.12; margin: 4px 0 8px; text-wrap: balance; }
.home h1 em { font-style: normal; color: var(--tap); }
.lede { color: var(--muted); font-size: 14.5px; margin: 0 0 12px; max-width: 42ch; }
.statrow { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--f-word); font-weight: 400; font-size: 15px; }
.stat .st { color: var(--star); }
.settings { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; margin-block: 16px; }
.setrow { display: grid; gap: 6px; justify-items: start; }
.setlab { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; background: var(--surface2); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 11px; border-radius: 9px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--seg-on); color: var(--seg-on-fg); }
.seg button small { font-weight: 500; opacity: .8; }
.sectlab { font-family: var(--f-display); font-size: 18px; margin: 20px 0 10px; display: flex; align-items: baseline; gap: 8px; }
.sectlab span { font-family: var(--f-body); font-size: 12.5px; color: var(--muted); }
.missions { display: grid; gap: 12px; }
.mcard {
  display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 3px solid var(--frame); border-radius: 16px; padding: 8px; cursor: pointer;
  box-shadow: 4px 4px 0 var(--frame); transition: transform .12s, box-shadow .12s;
}
.mcard:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--frame); }
.thumb { border: 2px solid var(--frame); border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: #DCE5F3; }
.thumb svg, .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.minfo { min-width: 0; display: grid; gap: 1px; }
.mnum { font-family: var(--f-word); font-size: 12px; letter-spacing: .07em; color: var(--muted); }
.mtitle { font-family: var(--f-display); font-size: 19px; line-height: 1.25; }
.mwords { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mstat { font-size: 12.5px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mstat .stars { color: var(--star); letter-spacing: 1px; font-size: 14px; }
.mstat .new { color: var(--tap); }
.mcard.boss .thumb { background: #2F3A6B; }
.reviewbtn { margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 2px dashed var(--bad); border-radius: 14px; background: transparent; cursor: pointer; text-align: left; }
.reviewbtn b { font-family: var(--f-display); font-weight: 400; font-size: 17px; color: var(--bad); }
.reviewbtn span { font-size: 12.5px; color: var(--muted); }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); }

/* ---------- 상단 바 ---------- */
.topbar { display: flex; align-items: center; gap: 8px; }
.iconbtn { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 2px solid var(--frame); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }
.toplab { flex: 1; min-width: 0; font-family: var(--f-word); font-size: 13px; letter-spacing: .07em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 만화 칸 그림 패널 ---------- */
.panel { position: relative; overflow: hidden; background: #DCE5F3; height: 220px; }
.panel .cam { position: absolute; left: 0; top: 0; width: 800px; height: 500px; transform-origin: 0 0; }
.panel svg.scene { display: block; width: 800px; height: 500px; max-width: none; }
.panel svg.fxo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.fx .dim { fill: rgba(16, 18, 42, .34); animation: fadeIn .35s ease-out both; }
.fx .ring-o { fill: none; stroke: #23253F; stroke-width: 8; animation: fadeIn .3s both; }
.fx .ring { fill: none; stroke: #FFD84D; stroke-width: 4.5; stroke-dasharray: 12 8; animation: fadeIn .3s both; }
.panel.flash .fx .ring { stroke-width: 7; }
.speed { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.speed svg { display: block; width: 100%; height: 100%; }
.speed polygon { fill: #23253F; }
.speed.go { animation: speed .6s ease-out; }
.ptag {
  position: absolute; left: 10px; top: 10px; max-width: calc(100% - 20px); background: var(--hl); color: var(--on-hl);
  border: 2px solid #23253F; border-radius: 10px; padding: 2px 10px 3px; font-weight: 700; font-size: 14px; line-height: 1.4;
  box-shadow: 2px 2px 0 #23253F; animation: tagIn .4s cubic-bezier(.2, 1.5, .4, 1) both; pointer-events: none;
}
.ptag b { font-family: var(--f-word); font-weight: 400; font-size: 16px; margin-right: 6px; }
.zbtn {
  position: absolute; right: 10px; top: 10px; z-index: 3; border: 2px solid #23253F; background: #FFFFFF; color: #23253F; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; padding: 4px 11px; cursor: pointer; box-shadow: 2px 2px 0 #23253F;
}

/* ---------- 스토리 화면 ---------- */
.stitle { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 7.6vw, 32px); line-height: 1.15; margin: 12px 0 10px; text-wrap: balance; }
.sframe { border: 3px solid var(--frame); border-radius: 16px; overflow: hidden; box-shadow: 5px 5px 0 var(--frame); background: var(--surface); }
.storylab { font-family: var(--f-display); font-size: 16px; margin: 14px 0 4px; color: var(--muted); }
.storylab span { font-family: var(--f-body); font-size: 12px; font-weight: 500; margin-left: 6px; }
.story { font-size: 16px; line-height: 1.9; margin: 0; word-break: keep-all; overflow-wrap: break-word; }
.wchip {
  display: inline; border: 0; border-bottom: 2px solid var(--chip-line); padding: 1px 6px; margin: 0 1px; border-radius: 7px 7px 3px 3px; background: var(--chip-bg);
  color: var(--fg); font-weight: 700; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; line-height: 1.6;
}
.wchip i { font-style: normal; font-family: var(--f-word); font-weight: 400; font-size: .92em; margin-right: 1px; color: var(--chip-en); }
.wchip.on { background: var(--hl); color: var(--on-hl); border-bottom-color: var(--frame); box-shadow: 0 0 0 2px var(--frame); }
.wchip.on i { color: var(--on-hl); }
.chiplist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chiplist .wchip { display: inline-block; }
.brief { margin-top: 18px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.brief-row { display: flex; gap: 10px; font-size: 14px; align-items: baseline; }
.brief-row b { flex: none; font-family: var(--f-display); font-weight: 400; font-size: 14px; color: var(--muted); min-width: 3.2em; white-space: nowrap; }
.brief-row strong { font-family: var(--f-word); font-weight: 400; font-size: 18px; color: var(--bad); font-variant-numeric: tabular-nums; }
.startbtn {
  margin-top: 16px; width: 100%; border: 3px solid var(--frame); border-radius: 18px; background: var(--bad); color: #FFFFFF; cursor: pointer;
  font-family: var(--f-display); font-size: 24px; padding: 14px; box-shadow: 5px 5px 0 var(--frame); display: flex; align-items: center; justify-content: center; gap: 10px;
}
.startbtn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--frame); }
.mosaic { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; background: var(--frame); aspect-ratio: 16 / 10; max-width: 100%; }
.mosaic div { overflow: hidden; background: #2F3A6B; }
.mosaic svg, .mosaic img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* ---------- 미션(플레이) 화면 ---------- */
.playbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 4px 10px; display: grid; gap: 8px; }
.pbtitle { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.pbtitle span { display: flex; align-items: center; gap: 7px; min-width: 0; font-family: var(--f-word); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.pbtitle em { font-style: normal; }
.pbtitle .left { font-family: var(--f-body); font-weight: 700; letter-spacing: 0; color: var(--fg); font-variant-numeric: tabular-nums; }
.pbtitle b { font-family: var(--f-display); font-weight: 400; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fuserow { display: flex; align-items: center; gap: 8px; }
.bomb { width: 30px; height: 30px; flex: none; }
.fuse { position: relative; flex: 1; height: 14px; border-radius: 999px; background: var(--surface2); border: 2px solid var(--frame); }
.fuse-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 999px; background: var(--fuse-c, var(--good)); transform-origin: left center; }
.spark-pos { position: absolute; left: 0; top: 0; bottom: 0; width: 0; pointer-events: none; }
.fuse-spark { position: absolute; left: 0; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; animation: flicker .18s steps(2) infinite; }
.clock { font-family: var(--f-word); font-size: 22px; min-width: 2.7em; text-align: right; font-variant-numeric: tabular-nums; }
.hurry .clock { color: var(--bad); animation: beat 1s ease-in-out infinite; }
.hurry .fuse { animation: fuseShake .3s linear infinite; }
.dots { display: flex; gap: 3px; }
.dots:empty { display: none; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; transition: background .2s, transform .2s; }
.dots i.on { border-color: var(--good); }
.dots i.on { background: var(--good); transform: scale(1.12); }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }

.cardwrap { position: relative; }
.card {
  background: var(--surface); border: 3px solid var(--frame); border-radius: 18px; box-shadow: 5px 5px 0 var(--frame);
  overflow: hidden; cursor: pointer; outline: none; -webkit-user-select: none; user-select: none;
}
.card.in { animation: cardIn .28s cubic-bezier(.2, .9, .3, 1.15) both; }
.card.outR { animation: outR .24s ease-in forwards; }
.card.outL { animation: outL .36s ease-in forwards; }
.card .panel { border-bottom: 3px solid var(--frame); }
.cbody { padding: 12px 16px 18px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.revealed .cbody { padding: 8px 14px 14px; gap: 4px; }
.revealed .cmeta, .revealed .keys { display: none; }
.revealed .q { font-size: 32px; }
.revealed .q.ko { font-size: 23px; }
.ipa .pos { font-size: 11px; }
.cmeta { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.pos, .cscene { font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.q { font-family: var(--f-word); font-size: 42px; line-height: 1.08; overflow-wrap: anywhere; max-width: 100%; }
.q.ko { font-family: var(--f-display); font-size: 31px; line-height: 1.25; text-wrap: balance; }
.q small, .a small { font-size: .58em; }
.taphint {
  display: flex; align-items: center; gap: 8px; margin-top: 4px; font-family: var(--f-display); font-size: 25px; color: var(--tap);
  animation: nudge 1.5s ease-in-out infinite;
}
.taphint svg { width: 30px; height: 30px; flex: none; }
.ans { display: none; width: 100%; }
.revealed .taphint { display: none; }
.revealed .ans { display: grid; gap: 8px; justify-items: center; }
.a { font-family: var(--f-display); font-size: 31px; line-height: 1.22; color: var(--meaning); text-wrap: balance; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.a.en { font-family: var(--f-word); font-size: 38px; overflow-wrap: anywhere; }
.ipa { display: flex; align-items: center; justify-content: center; gap: 4px 10px; flex-wrap: wrap; animation: fadeUp .4s .12s both; }
.ipa-t { font-family: var(--f-ipa); font-size: 19px; letter-spacing: .01em; }
.kr { font-size: 13px; color: var(--muted); }
.say { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface2); display: grid; place-items: center; cursor: pointer; padding: 0; }
.say svg { width: 18px; height: 18px; }
.picbtn {
  margin-top: 4px; border: 0; border-radius: 999px; background: var(--pic); color: var(--pic-ink); font-weight: 700; font-size: 15px;
  padding: 9px 18px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; box-shadow: 0 3px 0 var(--frame); animation: fadeUp .4s .2s both;
}
.picbtn svg { width: 18px; height: 18px; }
.picbtn[aria-expanded="true"] { box-shadow: none; transform: translateY(2px); }
.picpanel { width: 100%; text-align: left; background: var(--surface2); border: 2px dashed var(--pic); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; animation: dropIn .35s cubic-bezier(.2, 1.2, .4, 1) both; }
.picpanel p { margin: 0; font-size: 14.5px; line-height: 1.6; }
.pp-lab { display: block; font-size: 11.5px; font-weight: 700; color: var(--pic); letter-spacing: .05em; margin-bottom: 1px; }
.pp-en { font-family: var(--f-ipa); }
.pp-en b { color: var(--meaning); }
.pp-ko { color: var(--muted); font-size: 13.5px !important; }

.stamp {
  position: absolute; left: 50%; top: 16%; z-index: 4; pointer-events: none; font-family: var(--f-display); font-size: 30px; padding: 4px 16px; white-space: nowrap;
  border: 4px solid currentColor; border-radius: 12px; background: var(--surface); transform: translate(-50%, -50%) rotate(-10deg); animation: stampIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp.good { color: var(--good); }
.stamp.bad { color: var(--bad); }
.flashans {
  position: absolute; left: 12px; right: 12px; top: 44%; z-index: 4; pointer-events: none; text-align: center; background: var(--surface);
  border: 3px solid var(--frame); border-radius: 14px; padding: 8px 10px; box-shadow: 4px 4px 0 var(--frame); animation: pop .3s both;
}
.flashans b { font-family: var(--f-word); font-weight: 400; font-size: 22px; margin-right: 8px; }
.flashans span { font-family: var(--f-display); font-size: 20px; color: var(--meaning); }
.combo {
  position: absolute; right: 8px; top: -6px; z-index: 5; pointer-events: none; font-family: var(--f-word); font-size: 22px; color: var(--on-hl);
  background: var(--hl); border: 3px solid #23253F; border-radius: 12px; padding: 0 10px; transform: rotate(6deg); animation: comboIn .7s cubic-bezier(.2, 1.6, .4, 1) both;
}
.actions {
  position: sticky; bottom: 0; z-index: 6; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding-block: 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 72%, transparent);
}
.actions button { border: 3px solid var(--frame); border-radius: 16px; padding: 13px 8px; font-family: var(--f-display); font-size: 20px; cursor: pointer; box-shadow: 4px 4px 0 var(--frame); }
.actions button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--frame); }
.btn-dont { background: var(--surface); color: var(--bad); }
.btn-know { background: var(--good); color: var(--on-good); }
.keys { margin-top: 2px; font-size: 11.5px; color: var(--muted); text-align: center; }

/* ---------- 오버레이 ---------- */
.ov { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s both; }
.sheet {
  width: min(420px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); border: 3px solid var(--frame); border-radius: 20px;
  box-shadow: 6px 6px 0 var(--frame); padding: 20px 18px; text-align: center; animation: sheetIn .45s cubic-bezier(.2, 1.4, .4, 1) both;
}
.count { font-family: var(--f-word); font-size: 128px; line-height: 1; color: #FFFFFF; -webkit-text-stroke: 5px #23253F; paint-order: stroke fill; text-shadow: 6px 6px 0 #23253F; animation: countPop .4s cubic-bezier(.2, 1.6, .4, 1) both; }

.btn { border: 3px solid var(--frame); border-radius: 14px; padding: 11px 12px; font-family: var(--f-display); font-size: 18px; cursor: pointer; background: var(--surface); box-shadow: 3px 3px 0 var(--frame); }

/* ---------- 움직임 ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }
@keyframes tagIn { 0% { opacity: 0; transform: translateY(-8px) scale(.8); } 100% { opacity: 1; transform: none; } }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes speed { 0% { opacity: 0; transform: scale(1.3); } 25% { opacity: .8; } 100% { opacity: 0; transform: scale(1); } }
@keyframes cardIn { from { opacity: 0; transform: translateX(46px) rotate(2.5deg); } to { opacity: 1; transform: none; } }
@keyframes outR { to { opacity: 0; transform: translateX(115%) rotate(9deg); } }
@keyframes outL { 0% { transform: none; } 18% { transform: translateX(-12px); } 36% { transform: translateX(12px); } 52% { transform: translateX(-6px); } 100% { opacity: 0; transform: translateX(-115%) rotate(-9deg); } }
@keyframes stampIn { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-10deg) scale(2.2); } 100% { opacity: 1; transform: translate(-50%, -50%) rotate(-10deg) scale(1); } }
@keyframes comboIn { 0% { opacity: 0; transform: rotate(6deg) scale(.3); } 30% { opacity: 1; transform: rotate(6deg) scale(1.25); } 70% { opacity: 1; transform: rotate(6deg) scale(1); } 100% { opacity: 0; transform: rotate(6deg) translateY(-14px); } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-8px) scaleY(.92); } to { opacity: 1; transform: none; } }
@keyframes flicker { 0% { transform: scale(1) rotate(0); } 100% { transform: scale(1.25) rotate(25deg); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@keyframes fuseShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }
@keyframes shake { 0%, 100% { transform: none; } 15% { transform: translate(-10px, 4px) rotate(-1deg); } 30% { transform: translate(9px, -5px) rotate(1deg); } 45% { transform: translate(-7px, 3px); } 60% { transform: translate(6px, -2px); } 80% { transform: translate(-3px, 1px); } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes countPop { 0% { opacity: 0; transform: scale(2.4); } 55% { opacity: 1; transform: scale(.94); } 100% { opacity: 1; transform: scale(1); } }
@keyframes starIn { 0% { opacity: 0; transform: scale(0) rotate(-40deg); } 100% { opacity: 1; transform: none; } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .speed { display: none; }
}

/* ---------- 보조 ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 큰 화면(컴퓨터·태블릿 가로, 1000px 넘게): 이야기·미션 화면은 그림을 크게 보여 줘요.
   그림(16:10)과 그 아래 조절 줄이 화면 높이 안에 들어오는 너비로, 가장 넓게 1040px. 그림 아래 글은 읽기 좋게 640px 안에서.
   홈·만들기 화면(글과 입력칸)과 휴대폰 화면은 그대로예요 */
@media (min-width: 1000px) and (min-height: 600px) {

.vrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.vsel { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.vsel span { min-width: 2.7em; }
.vsel select { width: min(56vw, 250px); font: inherit; color: var(--fg); background: var(--surface2); border: 0; border-radius: 9px; padding: 7px 8px; min-height: 36px; }
.mcard.locked { opacity: .62; }
.mcard.locked .thumb img, .mcard.locked .thumb svg { filter: grayscale(.85) brightness(.85); }
.mcard.nope { animation: shakeX .35s; }
.thumb { position: relative; }
.lockic { position: absolute; inset: 0; display: grid; place-items: center; color: #FFFFFF; }
.lockic svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
.clearic { position: absolute; right: 4px; bottom: 4px; font-family: var(--f-word); font-size: 11px; background: var(--good); color: var(--on-good); border: 2px solid #23253F; border-radius: 6px; padding: 0 5px; }
.lockt { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.lockt svg { width: 13px; height: 13px; }
.resetrow { margin-top: 14px; text-align: center; }
.linkbtn { border: 0; background: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 6px; }
.linkbtn.armed { color: var(--bad); font-weight: 700; }
/* 결과 화면 */
.bankline { color: var(--bonus) !important; font-weight: 700; }
.bankline svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 3px; }
.rstats b.gain { color: var(--good); }
.unlock { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: var(--good) !important; animation: pop .5s .6s cubic-bezier(.2, 1.6, .4, 1) both; }
.unlock svg { width: 16px; height: 16px; }
.unlock.boss { color: var(--bonus) !important; }
.lifeloss { display: flex; justify-content: center; gap: 8px; margin: 0 0 8px; }
.lifeloss svg { width: 34px; height: 31px; }
.lifeloss .on svg path:first-child, .lifeloss .lost svg path:first-child { fill: var(--life); stroke: #23253F; stroke-width: 1.6; }
.lifeloss .off svg path:first-child { fill: var(--surface2); stroke: var(--muted); stroke-width: 1.4; }
.lifeloss svg .plus { fill: none; stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round; }
.lifeloss .lost { animation: lifeLost 1s .5s ease-in forwards; }
/* 스토리 복습 */
.rvtag { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 6px; background: #FFD84D; color: #23253F; font-size: .78em; vertical-align: 1px; }
.vprog i.rv b { background: #FFD84D; }
@keyframes shakeX { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes okGlow { 0% { box-shadow: 0 0 0 0 var(--good), 5px 5px 0 var(--frame); } 40% { box-shadow: 0 0 0 9px var(--good), 5px 5px 0 var(--frame); } 100% { box-shadow: 0 0 0 4px var(--good), 5px 5px 0 var(--frame); } }
@keyframes bankGain { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes bankBlink { 0% { opacity: 1; } 100% { opacity: .65; } }
@keyframes vigOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes lifeLost { 0% { transform: none; opacity: 1; } 30% { transform: scale(1.3) rotate(-12deg); } 100% { transform: translateY(14px) scale(.6) rotate(20deg); opacity: .25; } }
@media (max-width: 370px) {
  #play .q { font-size: 30px; }
  .btn-dont { padding: 0 9px; font-size: 15px; }
  .bank { font-size: 13px; padding: 1px 6px 1px 4px; }
}
@media (max-height: 520px) {
  #play .playbar { padding-bottom: 4px; gap: 4px; }
  #play .q { font-size: 28px; }
  #play .cbody { padding: 4px 10px 6px; gap: 3px; }
  #play .cmeta { display: none; }
  .answerbar { margin-top: 6px; }
  .ain, .btn-dont, .btn-go, .btn-next { height: 46px; }
}

/* ---------- 단어장 고르기 · 사진으로 새 단어장 만들기 ---------- */
.deckchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; margin: 0 0 6px; padding: 5px 10px 5px 8px; border: 2px solid var(--frame); border-radius: 999px; background: var(--surface); cursor: pointer; font-weight: 700; font-size: 13.5px; }
.deckchip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deckchip small { flex: none; color: var(--muted); font-weight: 600; font-size: 12px; }
.deckchip svg { width: 18px; height: 18px; flex: none; }
.makecta { width: 100%; margin: 0 0 12px; display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-align: left; cursor: pointer; border: 3px solid var(--frame); border-radius: 16px; background: var(--hl); color: var(--on-hl); box-shadow: 4px 4px 0 var(--frame); }
.makecta svg { width: 30px; height: 30px; flex: none; }
.makecta b { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.makecta small { font-size: 12.5px; line-height: 1.4; display: inline-block; margin-top: 2px; }
.makecta:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--frame); }
.decklist { list-style: none; margin: 4px 0 14px; padding: 0; display: grid; gap: 8px; text-align: left; }
.decklist li { display: flex; align-items: stretch; gap: 6px; }
.deckpick { flex: 1; min-width: 0; display: grid; gap: 1px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface2); cursor: pointer; text-align: left; }
.deckpick b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deckpick small { color: var(--muted); font-size: 12.5px; }
.decklist li.cur .deckpick { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.deckdel { flex: none; width: 44px; border: 2px solid var(--line); border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
.deckdel svg { width: 16px; height: 16px; }
.deckredo { flex: none; border: 2px solid var(--line); border-radius: 12px; background: transparent; color: var(--fg); cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0 10px; font: inherit; font-size: 12.5px; font-weight: 700; }
.deckredo svg { width: 14px; height: 14px; }
.deckdel.armed { border-color: var(--bad); background: var(--bad); color: #FFFFFF; }
.ractions .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.ractions .btn svg { width: 22px; height: 22px; }

.make .mksteps { list-style: none; counter-reset: s; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.make .mksteps li { counter-increment: s; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 7px 8px; font-size: 12px; line-height: 1.35; color: var(--muted); }
.make .mksteps li::before { content: counter(s); display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 4px; border-radius: 50%; background: var(--frame); color: #FFFFFF; font-size: 11px; font-weight: 700; vertical-align: 1px; }
.make .mksteps b { color: var(--fg); }
.mknote { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface2); border: 2px dashed var(--line); font-size: 13px; color: var(--muted); }
.mknote.mkai { margin: 12px 0 0; color: var(--fg); }
.mkdiag { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); text-align: left; }
.mkdiag summary { cursor: pointer; font-weight: 700; color: var(--fg); }
.mkdiag pre { white-space: pre-wrap; word-break: break-all; background: var(--surface2); border-radius: 8px; padding: 8px; font-size: 12px; max-height: 260px; overflow: auto; }
.mknote.mkai.ok { border: 2px solid var(--good); }
.mknote.mkai.bad { border: 2px solid var(--bad); }
.mknote.mkai .ocrbar { margin: 8px 0 4px; }
.mknote.mkai .btn { margin-top: 8px; }
.mkbench { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.mkbench .mksmall { margin: 6px 0 0; }
.mkbench pre { white-space: pre-wrap; word-break: break-all; background: var(--surface); border-radius: 8px; padding: 8px; margin: 8px 0 0; font-size: 12px; line-height: 1.45; max-height: 360px; overflow: auto; text-align: left; user-select: text; -webkit-user-select: text; }
.mkerr { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--bad); color: #FFFFFF; font-size: 13.5px; font-weight: 600; }
.mkpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mkbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 92px; text-align: center; }
.mkbtn svg { width: 32px; height: 32px; }
.mkbtn { position: relative; overflow: hidden; }
.mkfile { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; z-index: 1; }
.mkdrop { margin-top: 10px; min-height: 48px; padding: 12px 14px; border: 2px dashed var(--line); border-radius: 14px; background: var(--surface); color: var(--muted); font-size: 13.5px; line-height: 1.5; outline: none; caret-color: transparent; }
.mkdrop:empty::before { content: attr(data-ph); }
.mkdrop:focus { border-color: var(--meaning); }
.mkhelp { margin-top: 10px; font-size: 13px; color: var(--muted); }
.mkhelp summary { cursor: pointer; font-weight: 700; padding: 8px 2px; color: var(--fg); }
.mkhelp ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.mkbtn:focus-within { outline: 3px solid var(--meaning); outline-offset: 2px; }
.mkimgs { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
.mkimg { position: relative; flex: none; width: 92px; height: 120px; border: 2px solid var(--frame); border-radius: 10px; overflow: hidden; background: var(--surface2); }
.mkimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mkimg button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--frame); background: var(--surface); display: grid; place-items: center; padding: 0; cursor: pointer; }
.mkimg button svg { width: 14px; height: 14px; }
.mksmall { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.mkpaste { margin-top: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px 12px; }
.mkpaste summary { cursor: pointer; font-family: var(--f-display); font-size: 16px; display: flex; align-items: center; gap: 6px; padding: 4px 0; }
.mkpaste summary svg { width: 18px; height: 18px; }
.mkpaste textarea, .mklab input, .mkrow input { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface2); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.mkpaste textarea { margin: 8px 0; resize: vertical; min-height: 140px; }
.mkpaste textarea:focus, .mklab input:focus, .mkrow input:focus { outline: none; border-color: var(--meaning); }
.mklab { display: grid; gap: 4px; margin: 12px 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.mkrows { display: grid; gap: 6px; }
.mkrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 36px; gap: 5px; align-items: center; }
.mkrow .mken { font-family: var(--f-ipa); font-weight: 500; }
.mkrow button { width: 36px; height: 40px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.mkrow button svg { width: 16px; height: 16px; }
.mkguess { grid-column: 1 / -1; margin-top: -3px; font-size: 11.5px; color: var(--pic); }
.mkguess.bad { color: var(--bad); font-weight: 700; }
.mkrow .mksnip { grid-column: 1 / -1; display: block; max-width: 100%; max-height: 56px; width: auto; height: auto; object-fit: contain; object-position: left center; border: 1px solid var(--line); border-radius: 6px; background: #FFFFFF; }
.mkslow { color: var(--pic); font-weight: 600; }
.mkcopy { border-left: 3px solid var(--line); padding-left: 9px; }
.mkrow.flag input { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface2)); }
.mkcount { margin: 10px 0 0; font-weight: 700; font-size: 14px; }
.startbtn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: 2px 2px 0 var(--frame); }
.mkwait { display: flex; align-items: center; gap: 14px; margin: 12px 0; padding: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; }
.mkwait p { margin: 0; font-size: 14px; }
.mkwait small { color: var(--muted); }
.mkwait .btn { margin-left: auto; }
.spin { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--bad); animation: spin .9s linear infinite; }
.mklog { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.mklog li { display: flex; align-items: center; gap: 8px; }
.mklog li::before { content: ''; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.mklog li.run::before { border-color: var(--meaning); border-top-color: transparent; animation: spin .9s linear infinite; }
.mklog li.ok::before { content: '✓'; display: grid; place-items: center; background: var(--good); border-color: var(--good); color: var(--on-good); font-size: 11px; font-weight: 700; }
.mklog li.warn::before { content: '!'; display: grid; place-items: center; background: var(--star); border-color: var(--star); color: #23253F; font-size: 12px; font-weight: 700; }
.mklog li.warn { color: var(--muted); }
.dotdot::after { content: '…'; animation: dots 1.2s steps(4, end) infinite; display: inline-block; overflow: hidden; vertical-align: bottom; width: 0; }
.mkdone { text-align: center; }
.mkdone .badge span { font-size: 40px; }
.mkthumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0 4px; text-align: left; }
.mkthumbs div { display: grid; gap: 3px; font-size: 12px; font-weight: 700; }
.mkthumbs img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border: 2px solid var(--frame); border-radius: 8px; background: #F4EFE4; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dots { to { width: 1.2em; } }
@media (prefers-reduced-motion: reduce) { .spin, .mklog li.run::before { animation-duration: 2.4s; } }
/* 일시정지 중에는 문제를 가려서 멈춘 채로 생각하는 꼼수가 없게 */
#play.paused .cardwrap { visibility: hidden; }
.setbox summary small { font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-left: 6px; }
.setbox .settings { margin: 10px 0 4px; padding: 0; border: 0; background: none; }
.mkrow { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 36px; }
/* 보이는 높이가 아주 낮을 때(가로 화면 + 자판): 그림은 접고 단어와 입력칸이 꼭 보이게 */
.vv-short .app { padding-block: 4px; }
.vv-short #play:not([hidden]) { height: calc(var(--vvh, 100vh) - 8px); min-height: 0; }
.vv-short #play .card .panel { display: none; }
.vv-short #play .playbar { padding-bottom: 4px; gap: 2px; }
.vv-short #play .iconbtn { width: 34px; height: 34px; }
.vv-short #play .cmeta { display: none; }
.vv-short #play .cbody { padding: 4px 10px 6px; gap: 3px; max-height: none; }
.vv-short #play .q { font-size: 26px; }
.vv-short .answerbar { margin-top: 4px; }
.vv-short .ain, .vv-short .btn-dont, .vv-short .btn-go, .vv-short .btn-next { height: 42px; }

/* ---------- 스토리 플레이어: 자막과 조절 단추는 그림 아래 줄 (그림 속 단어 칸을 가리지 않게) ---------- */
.vbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px 10px; border-top: 3px solid var(--frame); background: var(--surface); }
.vbar .vctl, .vbar .vfull { position: static; z-index: auto; }
.vbar .vctl { display: flex; flex-wrap: wrap; gap: 6px; }
.vbar .vfull { margin-left: auto; }
.vbar .vbtn { height: 40px; padding: 0 12px 0 9px; font-size: 13.5px; background: var(--surface2); color: var(--fg); border-color: var(--frame); box-shadow: 2px 2px 0 var(--frame); }
.vbar .vbtn.off { background: var(--surface); color: var(--muted); }
.vbar .vbtn.vspeed { padding: 0 11px; font-size: 15px; }
.vbar .vbtn svg { width: 16px; height: 16px; }
.vbar .vsub { position: static; flex: 1 0 100%; min-height: calc(1.65em * 2); text-align: left; pointer-events: auto; font-size: 16px; }
.vbar .vsub p { display: block; padding: 0; background: none; color: var(--fg); font-size: 16px; line-height: 1.65; font-weight: 600; }
.vbar .vsub mark { color: var(--tap); }
@media (max-width: 380px) { .vbar .vfull span { display: none; } .vbar .vfull { padding: 0 10px; } }
/* 목소리가 안 나올 때 알림 (그림 아래) */
.vnote { flex: 1 0 100%; padding: 10px 12px; border: 2px solid var(--bad); border-radius: 12px; background: var(--surface2); font-size: 14px; line-height: 1.55; }
.vnote p { margin: 0 0 8px; }
.vnote b { color: var(--bad); }
.vnote .btn { font-size: 16px; padding: 8px 12px; }
.vnote .vdiag { margin: 8px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); word-break: break-all; }
/* 전체화면에서 재생 중에는 단추를 잠시 숨김 (그림을 누르면 다시 보여요) */
.panel.fs .vctl, .panel.fs .vfull { transition: opacity .3s; }
.panel.fs.quiet .vctl, .panel.fs.quiet .vfull { opacity: 0; pointer-events: none; }
/* 가로로 든 휴대폰(전체화면 아님): 그림과 자막 줄이 한 화면에 들어오게 */
@media (orientation: landscape) and (max-height: 520px) {
  .sframe { max-width: min(100%, calc((100vh - 120px) * 1.6)); margin-inline: auto; }
}
/* 오답 연습은 전체화면이 없어요 */

/* ---------- 결과 창: 단추는 늘 보이게, 틀린 단어가 많으면 접어 둠 ---------- */
.sheet .ractions { position: sticky; bottom: -20px; margin: 0 -18px -20px; padding: 10px 18px 14px; background: var(--surface); box-shadow: 0 -10px 14px -10px rgba(0, 0, 0, .35); z-index: 1; }
.missmore { margin: -6px 0 12px; text-align: left; }
.missmore summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--muted); padding: 8px 2px; }
.missmore .miss { margin-top: 4px; }
@media (max-height: 520px) {
  .badge { width: 170px; height: 92px; margin-top: -10px; }
  .badge span { font-size: 26px; }
  .bigstars svg { width: 38px; height: 38px; }
}

/* ---------- 보스(하트 5개): 도화선이 짧아지지 않게 ---------- */
.hearts.many svg { width: 15px; height: 14px; }
.fuse { min-width: 72px; }

/* ---------- 단어장 확인 줄: 좁은 화면에서는 영어/뜻을 두 줄로 ---------- */
@media (max-width: 440px) {
  .mkrow { grid-template-columns: minmax(0, 1fr) 36px; row-gap: 4px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
  .mkrow .mken { grid-column: 1; grid-row: 1; }
  .mkrow button { grid-column: 2; grid-row: 1; }
  .mkrow .mkko { grid-column: 1 / -1; grid-row: 2; }
  .mkguess { grid-row: 3; }
  .mkrow .mksnip { grid-row: 3; }
  .mkrow .mksnip ~ .mkguess { grid-row: 4; }
}
.mkwait .btn { flex: none; white-space: nowrap; }
.decklist small em { font-style: normal; color: var(--good); font-weight: 700; }

/* ---------- 뜻 이름표가 '전체 그림' 단추에 가리지 않게 ---------- */
.panel.zb .ptag { max-width: calc(100% - 128px); }

/* ---------- 다크 모드 대비 ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bonus: #B69CFF; --life: #B69CFF; }
  :root:not([data-theme="light"]) .btn-next { color: #0B1A33; }
  :root:not([data-theme="light"]) .startbtn, :root:not([data-theme="light"]) .btn.primary { background: #D63A4B; }
}
:root[data-theme="dark"] { --bonus: #B69CFF; --life: #B69CFF; }
:root[data-theme="dark"] .btn-next { color: #0B1A33; }
:root[data-theme="dark"] .startbtn, :root[data-theme="dark"] .btn.primary { background: #D63A4B; }
/* 잠긴 에피소드: 그림만 흐리게, 글자는 읽히게 */
.mcard.locked { opacity: 1; }
.mcard.locked .thumb { opacity: .55; }
.mcard.locked .minfo { color: var(--muted); }

/* ---------- 누르기 쉬운 크기 ---------- */
.rules summary { padding-block: 10px; }
.seg button { min-height: 40px; }
.deckchip { min-height: 40px; }
.mkimg button { width: 36px; height: 36px; }
.say { width: 40px; height: 40px; }
.linkbtn { min-height: 40px; }
.chip, .zbtn, .wchip { position: relative; }
.chip::after, .zbtn::after { content: ''; position: absolute; inset: -8px; }

/* ---------- 기기 안에서 사진 읽기(OCR) 진행 ---------- */
.ocrbar { flex: 1 1 100%; height: 10px; border-radius: 999px; background: var(--surface2); border: 2px solid var(--frame); overflow: hidden; }
.ocrbar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .25s; }

<script>
/* ================= SVG 그림 키트 ================= */
const INK = '#23253F';
const F_SIGN = "'Black Han Sans','IBM Plex Sans KR',sans-serif";
const F_EN = "'Lilita One','Black Han Sans',sans-serif";
const F_TXT = "'IBM Plex Sans KR',sans-serif";
const SK = ['#F8D9C0', '#EDB993', '#C68B63'];
const HR = { black: '#2B2433', brown: '#6B4430', dark: '#3A2B24', blond: '#D9AA4C', grey: '#B9BCC9', red: '#9C4630' };
const C = {
  red: '#E5544B', blue: '#4C7BE0', navy: '#2F3A6B', green: '#3FA36B', yellow: '#F4C24F', purple: '#8C66D9',
  teal: '#2EA6A0', orange: '#F08A3C', pink: '#EF7DA6', grey: '#8E94AA', white: '#FFFFFF', suit: '#2F3450',
  wood: '#A8744C', woodD: '#83552F', paper: '#FFFDF8', steel: '#9AA5BF', dark: '#20243A'
};

// 따옴표까지 바꿔서 HTML 속성(value="…", data-id="…") 안에 넣어도 안전하게
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
function at(o) { let s = ''; for (const k in o) { const v = o[k]; if (v === undefined || v === null || v === false) continue; s += ' ' + k + '="' + v + '"'; } return s; }
function E(t, o, inner) { return inner == null ? '<' + t + at(o) + '/>' : '<' + t + at(o) + '>' + inner + '</' + t + '>'; }
const SW = w => w ? { stroke: INK, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' } : {};
const rect = (x, y, w, h, f, rx = 0, sw = 3, ex = {}) => E('rect', { x, y, width: w, height: h, rx: rx || undefined, fill: f, ...SW(sw), ...ex });
const circ = (cx, cy, r, f, sw = 3, ex = {}) => E('circle', { cx, cy, r, fill: f, ...SW(sw), ...ex });
const ell = (cx, cy, rx, ry, f, sw = 3, ex = {}) => E('ellipse', { cx, cy, rx, ry, fill: f, ...SW(sw), ...ex });
const pth = (d, f = 'none', sw = 3, ex = {}) => E('path', { d, fill: f, ...SW(sw), ...ex });
const ln = (x1, y1, x2, y2, sw = 3, c = INK, ex = {}) => E('line', { x1, y1, x2, y2, stroke: c, 'stroke-width': sw, 'stroke-linecap': 'round', ...ex });
const pg = (pts, f, sw = 3, ex = {}) => E('polygon', { points: pts, fill: f, ...SW(sw), ...ex });
const tx = (x, y, s, size, f = INK, ex = {}) => E('text', { x, y, 'font-size': size, fill: f, 'text-anchor': 'middle', 'font-family': F_SIGN, ...ex }, esc(s));
const txE = (x, y, s, size, f = INK, ex = {}) => tx(x, y, s, size, f, { 'font-family': F_EN, ...ex });
const txT = (x, y, s, size, f = INK, ex = {}) => tx(x, y, s, size, f, { 'font-family': F_TXT, 'font-weight': 700, ...ex });
const G = (inner, t, ex = {}) => E('g', { transform: t, ...ex }, inner);

function limb(x1, y1, x2, y2, col, bend = 0, wo = 10, wi = 6.4) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1;
  const cx = (mx - dy / l * bend).toFixed(1), cy = (my + dx / l * bend).toFixed(1);
  const d = `M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`;
  return pth(d, 'none', 0, { stroke: INK, 'stroke-width': wo, 'stroke-linecap': 'round' }) +
    pth(d, 'none', 0, { stroke: col, 'stroke-width': wi, 'stroke-linecap': 'round' });
}
const HAIR = {
  short: 'M-14.6 -88C-16 -103 -6 -108 1 -107C9 -106 16 -101 14.6 -88C12 -95 6 -98.5 -1 -98C-6 -97.5 -11 -94 -14.6 -88Z',
  side: 'M-14.6 -87C-16.5 -104 -3 -109 4 -107.5C12 -106 16.5 -100 14.6 -87C13 -92 9 -97 3 -98C-2 -94 -9 -92 -14.6 -87Z',
  long: 'M-14.8 -84C-16.5 -104 -6 -109 0 -109C8 -109 16.5 -104 14.8 -84C13 -95 7 -99.5 1 -99.5C-6 -99.5 -12 -95 -14.8 -84Z',
  curly: 'M-15 -86C-20 -92 -16 -101 -10 -101C-9 -108 0 -110 3 -105C9 -110 18 -104 15 -97C20 -93 18 -86 15 -85C12 -92 6 -95 0 -94C-6 -95 -12 -92 -15 -86Z'
};
function face(f, glasses) {
  let b = '';
  const eye = x => ell(x, -90.5, 1.8, 2.4, INK, 0);
  if (f === 'happy') b += pth('M-7.5 -90Q-5 -93.5 -2.5 -90', 'none', 1.8) + pth('M2.5 -90Q5 -93.5 7.5 -90', 'none', 1.8);
  else b += eye(-5) + eye(5);
  if (f === 'angry' || f === 'shout') b += ln(-8, -96.5, -3, -94.5, 1.8) + ln(8, -96.5, 3, -94.5, 1.8);
  if (f === 'smile' || f === 'happy') b += pth('M-5 -83.5Q0 -78.5 5 -83.5', 'none', 1.9);
  if (f === 'shout') b += pth('M-4.6 -84.5Q0 -75 4.6 -84.5Z', INK, 1.2);
  if (f === 'open') b += pth('M-4.2 -84Q0 -77.5 4.2 -84Z', INK, 1.2);
  if (f === 'serious' || f === 'angry') b += ln(-3.8, -82.5, 3.8, -82.5, 1.9);
  if (f === 'wow') b += ell(0, -82, 2.4, 3, INK, 0);
  if (f === 'worry') b += pth('M-4 -81.5Q0 -84.5 4 -81.5', 'none', 1.9);
  if (f !== 'serious' && f !== 'angry') b += circ(-9, -85, 2.4, '#F49A9A', 0, { opacity: .65 }) + circ(9, -85, 2.4, '#F49A9A', 0, { opacity: .65 });
  if (glasses) b += circ(-5.5, -90.5, 4.4, 'none', 1.6) + circ(5.5, -90.5, 4.4, 'none', 1.6) + ln(-1.1, -90.5, 1.1, -90.5, 1.4);
  return b;
}
/* 사람: 발 위치(x,y) 기준, 키 약 108 */
function person(o) {
  const s = o.s ?? 1, skin = o.skin ?? SK[0], hair = o.hair ?? HR.black, top = o.top ?? C.blue, bot = o.bot ?? C.navy;
  const hs = o.hs ?? 'short', back = !!o.back;
  const lh = o.lh ?? [-17, -38], rh = o.rh ?? [17, -38];
  let b = '';
  if (hs === 'long') b += pth('M-16 -94C-19 -72 -18 -60 -12 -54L12 -54C18 -60 19 -72 16 -94Z', hair);
  if (hs === 'bob') b += pth('M-16.5 -94C-19 -80 -18 -73 -13 -71L13 -71C18 -73 19 -80 16.5 -94Z', hair);
  if (hs === 'pony') b += pth('M9 -101C25 -98 27 -79 19 -66C17 -77 14 -87 7 -93Z', hair);
  if (o.legs !== false) {
    if (o.skirt) b += limb(-6, -30, -7, -3, skin, 0, 8.5, 5) + limb(6, -30, 7, -3, skin, 0, 8.5, 5);
    else b += limb(-7, -38, -8, -3, bot, 0, 10, 6.5) + limb(7, -38, 8, -3, bot, 0, 10, 6.5);
    b += ell(-10, -1.6, 7.6, 4.2, INK, 0) + ell(10, -1.6, 7.6, 4.2, INK, 0);
  }
  if (o.skirt) b += pth('M-15 -42L15 -42L19 -24Q0 -20 -19 -24Z', o.skirt);
  b += pth('M-15 -74Q-17.5 -52 -15 -36L15 -36Q17.5 -52 15 -74Q0 -80.5 -15 -74Z', top);
  if (o.under) b += o.under;
  if (o.coat) b += pth('M-15 -74Q-17.5 -52 -15 -36L-4 -36L-4 -74ZM15 -74Q17.5 -52 15 -36L4 -36L4 -74Z', o.coat, 2);
  if (o.suit) {
    b += pth('M-6 -76.5L0 -63L6 -76.5Z', '#fff', 2);
    b += pth('M0 -72L-3.2 -66L0 -48L3.2 -66Z', o.tie || C.red, 1.8);
    b += pth('M-6 -76.5L-2 -58M6 -76.5L2 -58', 'none', 1.6);
  }
  if (o.vest) b += pth('M-15 -74Q-17.5 -52 -15 -36L-5 -36L-5 -74ZM15 -74Q17.5 -52 15 -36L5 -36L5 -74Z', o.vest, 2) + ln(-15, -50, -5, -50, 2.5, '#FFF4B0') + ln(5, -50, 15, -50, 2.5, '#FFF4B0');
  if (o.badge) b += circ(-8.5, -63, 3, '#F4C24F', 1.4);
  if (o.lanyard) b += pth('M-7 -76L0 -60L7 -76', 'none', 0, { stroke: o.lanyard, 'stroke-width': 1.8 }) + rect(-5, -60, 10, 12, '#fff', 1.5, 1.6);
  b += circ(0, -90, 14, back ? hair : skin);
  if (!back) {
    if (HAIR[hs] || hs === 'long' || hs === 'bob' || hs === 'pony' || hs === 'bun') {
      const key = hs === 'side' ? 'side' : hs === 'curly' ? 'curly' : (hs === 'long' || hs === 'bob' || hs === 'pony') ? 'long' : 'short';
      b += pth(HAIR[key], hair, 2.6);
    }
    if (hs === 'bun') b += circ(0, -107, 6.5, hair, 2.6);
    if (hs === 'bald') b += pth('M-14.4 -86C-15.5 -93 -13 -97 -9 -99L-8.5 -90Z', hair, 2.2) + pth('M14.4 -86C15.5 -93 13 -97 9 -99L8.5 -90Z', hair, 2.2);
    if (hs === 'cap') b += pth('M-15.5 -93C-15.5 -111 15.5 -111 15.5 -93Z', o.capc || C.yellow, 2.6) + rect(-19, -95, 38, 5.5, o.capc || C.yellow, 2.5, 2.4);
    b += face(o.face ?? 'smile', o.glasses);
  } else if (hs === 'bun') b += circ(0, -106, 6.5, hair, 2.6);
  const sh = [-12.5, -69], sr = [12.5, -69];
  b += limb(sh[0], sh[1], lh[0], lh[1], top, o.lb ?? -4) + circ(lh[0], lh[1], 4.7, skin, 2.2);
  b += limb(sr[0], sr[1], rh[0], rh[1], top, o.rb ?? 4) + circ(rh[0], rh[1], 4.7, skin, 2.2);
  if (o.extra) b += o.extra;
  return G(b, `translate(${o.x} ${o.y}) scale(${s})`);
}
function burst(cx, cy, r1, r2, n, f, sw = 2.5, rot = 0) {
  const p = [];
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = i / (n * 2) * Math.PI * 2 + rot; p.push((cx + Math.cos(a) * r).toFixed(1) + ',' + (cy + Math.sin(a) * r).toFixed(1)); }
  return pg(p.join(' '), f, sw);
}
function bubble(x, y, w, h, tx_, ty_, f = '#fff', sw = 3) {
  const r = Math.min(16, h / 2), bx = Math.max(x + r + 4, Math.min(x + w - r - 22, tx_ - 8));
  return pth(`M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${bx + 18}L${tx_} ${ty_}L${bx} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`, f, sw);
}
function bubbleUp(x, y, w, h, tx_, ty_, f = '#fff', sw = 3) { // 꼬리가 위로
  const r = Math.min(16, h / 2), bx = Math.max(x + r + 4, Math.min(x + w - r - 22, tx_ - 8));
  return pth(`M${x + r} ${y}H${bx}L${tx_} ${ty_}L${bx + 18} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`, f, sw);
}
function sparkle(cx, cy, r, f = '#FFF6C2') {
  const k = r * 0.2;
  return pth(`M${cx} ${cy - r}Q${cx + k} ${cy - k} ${cx + r} ${cy}Q${cx + k} ${cy + k} ${cx} ${cy + r}Q${cx - k} ${cy + k} ${cx - r} ${cy}Q${cx - k} ${cy - k} ${cx} ${cy - r}Z`, f, 1.6);
}
const check = (x, y, s = 1, c = C.green) => pth(`M${x - 6 * s} ${y}L${x - 1.5 * s} ${y + 5 * s}L${x + 7 * s} ${y - 6.5 * s}`, 'none', 0, { stroke: c, 'stroke-width': 3.4 * s, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
const cross = (x, y, r, c = C.red, w = 5) => ln(x - r, y - r, x + r, y + r, w, c) + ln(x + r, y - r, x - r, y + r, w, c);
function arrow(x1, y1, x2, y2, c = INK, w = 4, head = 11) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const p = (d) => `${(x2 - head * Math.cos(a + d)).toFixed(1)} ${(y2 - head * Math.sin(a + d)).toFixed(1)}`;
  return ln(x1, y1, x2, y2, w, c) + pth(`M${p(-0.55)}L${x2} ${y2}L${p(0.55)}`, 'none', 0, { stroke: c, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function pill(x, y, w, h, f, t, size, tc = INK, font = F_SIGN) {
  return rect(x, y, w, h, f, h / 2, 2.5) + tx(x + w / 2, y + h / 2 + size * 0.36, t, size, tc, { 'font-family': font });
}
const lines = (pts, sw = 3, c = INK) => pth('M' + pts.map(p => p.join(' ')).join('L'), 'none', 0, { stroke: c, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
function plant(x, y, s = 1, pot = C.orange) {
  return G(pth('M-14 -22L14 -22L10 0L-10 0Z', pot, 2.5) + pth('M0 -22C-4 -38 -18 -44 -20 -52C-8 -50 -2 -40 0 -26C2 -42 10 -54 20 -56C18 -44 6 -38 0 -22Z', C.green, 2.5) + ln(0, -22, 0, -46, 2.5), `translate(${x} ${y}) scale(${s})`);
}
function mugIcon(x, y, c, s = 1) { return G(rect(-10, -14, 20, 18, c, 4, 2.4) + pth('M10 -10Q17 -10 17 -5Q17 0 10 0', 'none', 2.4), `translate(${x} ${y}) scale(${s})`); }
function speedMarks(x, y, dir = 1, n = 3, len = 12, gap = 7, c = INK) { let b = ''; for (let i = 0; i < n; i++) b += ln(x, y + i * gap, x + dir * len, y + i * gap - 4, 2.4, c); return b; }

/* ================= 동화 캐릭터 키트 ================= */
// person()의 o.under(몸통 위·팔 아래) / o.extra(맨 위)에 넣는 조각. 좌표는 사람 발 기준(키 약 108)
const robe = (c, trim = '#F4C24F') => pth('M-15 -75Q-23 -40 -25 -2L25 -2Q23 -40 15 -75Q0 -81 -15 -75Z', c) + ln(0, -72, 0, -8, 2.2, trim);
const beard = (c = '#F4F4F4') => pth('M-12 -86Q-13 -66 0 -56Q13 -66 12 -86Q6 -81 0 -81Q-6 -81 -12 -86Z', c, 2.2) + pth('M-8 -85Q-3 -89 0 -85Q3 -89 8 -85', 'none', 2);
const crown = (c = '#F4C24F') => pth('M-12 -101L-13 -114L-6 -107L0 -116L6 -107L13 -114L12 -101Z', c, 2.2) + circ(0, -109, 2, '#E5544B', 0);
const helm = () => pth('M-15.5 -90C-15.5 -111 15.5 -111 15.5 -90Z', '#C9D1E0', 2.6) + rect(-1.6, -93, 3.2, 9, '#C9D1E0', 1, 1.6) + pth('M-2 -104C2 -120 18 -124 26 -114C16 -116 8 -112 4 -102Z', '#E5544B', 2);
const hood = () => pth('M-15.5 -91C-15 -104 -3 -112 20 -118C13 -107 16 -99 15.5 -91Z', '#2E8B4E', 2.6) + pth('M7 -104C14 -117 25 -124 32 -124C25 -115 17 -109 9 -102Z', '#E5544B', 1.8);
const turban = (c = '#F4F4F4') => ell(0, -100, 16, 10, c, 2.6) + circ(0, -104, 4, '#E5544B', 1.6) + pth('M4 -106C8 -116 12 -118 14 -116', 'none', 2);
const capHat = (c = '#E5544B') => pth('M-10 -100L-9 -111L9 -111L10 -100Z', c, 2.2) + ln(0, -111, 4, -116, 2);
const pointyHat = (c = '#F4C24F') => pth('M-14 -98L-1 -121L14 -98Z', c, 2.4) + rect(-16, -100, 32, 5, c, 2, 2.2) + pth('M8 -106C14 -116 20 -120 24 -118C20 -112 14 -108 10 -104Z', '#E5544B', 1.6);
const nose = (len, c = '#E2A85E') => pth(`M5 -88L${10 + len} -86.5L5 -84Z`, c, 2.2);
const bowArc = () => pth('M22 -92Q42 -62 22 -32', 'none', 0, { stroke: '#8B5A2B', 'stroke-width': 4, 'stroke-linecap': 'round' }) + ln(22, -92, 22, -32, 1.4, '#5A607E');

/* ---- 말 (오른쪽을 봄, 발 기준) ---- */
function horse(x, y, s = 1, c = '#F2EDE4', mane = '#8B5A2B') {
  let b = '';
  b += limb(-34, -42, -54, -10, c, -3, 11, 7) + limb(-22, -42, -20, -4, c, 2, 11, 7) + limb(26, -42, 44, -10, c, 2, 11, 7) + limb(36, -44, 60, -26, c, -3, 11, 7);
  for (const [hx, hy] of [[-54, -8], [-20, -2], [44, -8], [60, -24]]) b += circ(hx, hy, 4.5, INK, 0);
  b += pth('M-46 -60C-68 -62 -78 -44 -72 -26C-66 -38 -58 -46 -46 -50Z', mane, 2.4);
  b += ell(0, -56, 52, 25, c, 3);
  b += pth('M28 -70C36 -88 44 -102 52 -110L74 -98C70 -88 62 -76 46 -52Z', c, 3);
  b += pth('M50 -114C62 -118 84 -112 92 -100C94 -93 90 -88 83 -88C74 -90 66 -92 58 -93C50 -95 45 -106 50 -114Z', c, 3);
  b += circ(67, -105, 2.6, INK, 0) + ell(87, -95, 1.6, 1.2, INK, 0) + pth('M52 -113L55 -125L62 -114Z', c, 2.4);
  b += pth('M33 -72C40 -92 46 -106 55 -116C46 -114 38 -102 28 -86Z', mane, 2.2);
  b += pth('M-16 -80Q0 -87 16 -80L13 -66L-13 -66Z', '#E5544B', 2.4) + ln(0, -66, 0, -44, 2.4, '#8B5A2B');

}

/* ---- 용 (큰 용, 왼쪽을 봄, 장면 좌표에 직접) ---- */
function bigDragon(o = {}) {
  const g = '#4FAE6B', gd = '#3A8F55', belly = '#F6D86B';
  let b = '';
  // 꼬리
  b += pth('M520 300C580 310 600 270 590 240C610 250 618 286 600 312C580 340 520 336 490 320Z', g, 3);
  b += pth('M588 236L604 214L606 244Z', '#F08A3C', 2.4);

  b += pth('M520 120L548 146M572 104L580 136', 'none', 2.4);
  // 몸
  b += ell(440, 232, 88, 98, g, 3);
  b += ell(416, 248, 54, 74, belly, 3);
  for (let i = 0; i < 6; i++) b += pth(`M${372 + i * 2} ${196 + i * 22}Q416 ${206 + i * 22} ${460 - i * 2} ${196 + i * 22}`, 'none', 2, { stroke: '#D9B64A' });
  // 결함(빠진 비늘)
  if (o.hole) b += pth('M398 236L414 228L428 238L420 252L404 252Z', '#FF8FA0', 2.6);
  // 뒷다리·앞발
  b += ell(372, 318, 34, 20, g, 3) + ell(500, 318, 34, 20, g, 3);
  for (const fx of [350, 364, 378, 480, 494, 508]) b += pth(`M${fx} 330L${fx + 3} 340L${fx + 6} 330Z`, '#F4F4F4', 1.6);
  b += limb(372, 190, 340, 214, g, 6, 14, 9) + limb(470, 186, 506, 206, g, -6, 14, 9);
  // 목과 머리
  b += pth('M396 160C380 128 372 108 356 96L388 76C404 96 420 124 436 150Z', g, 3);

  /* ---- 2. recommend: '법' 책을 든 국회의원 할아버지 ---- */

    const badge = circ(-9.5, -61, 4.2, '#F4C24F', 1.8) + circ(-9.5, -61, 1.6, '#C2405C', 0);

    b += G(rect(-17, -22, 34, 42, '#8B2E3C', 3, 2.6) + rect(-13, -18, 26, 34, '#F4E3C3', 2, 0) + tx(0, 6, '법', 20, '#8B2E3C'), 'translate(36 154) rotate(-8)');
    addPanel(2, b, '#EEE8FB');

  /* ---- 3. weakness: 비늘 하나가 빠진 용의 가슴 (돋보기 속은 2배로 크게) ---- */
  {
    const s = 0.78, ox = -222, oy = -20;
    let b = '';
    b += G(drg({ hole: true, id: 3 }), `translate(${ox} ${oy}) scale(${s})`);
    const fx = HOLE[0] * s + ox, fy = HOLE[1] * s + oy, R = 33, m = 2.1;
    // 손잡이 (렌즈 아래 오른쪽)
    const hx = fx + R * 0.72, hy = fy + R * 0.72;
    b += ln(hx, hy, hx + 30, hy + 30, 13, INK) + ln(hx, hy, hx + 30, hy + 30, 7.5, C.woodD);
    // 렌즈 속: 같은 용을 m배 확대해서 빠진 비늘 주변만 보여 줌
    b += circ(fx, fy, R, BELLY, 0) + G(drg({ hole: true, only: true }), `translate(${fx} ${fy}) scale(${s * m}) translate(${-HOLE[0]} ${-HOLE[1]})`);
    b += circ(fx, fy, R + 1.5, 'none', 0, { stroke: '#E8EEF6', 'stroke-width': 5 }) + circ(fx, fy, R + 4.5, 'none', 3) + circ(fx, fy, R - 0.5, 'none', 2);
    b += pth(`M${fx - R * 0.62} ${fy - R * 0.3}Q${fx - R * 0.55} ${fy - R * 0.62} ${fx - R * 0.25} ${fy - R * 0.68}`, 'none', 0, { stroke: '#fff', 'stroke-width': 3.4, 'stroke-linecap': 'round', opacity: 0.9 });
    addPanel(3, b, '#E4F4E1');

  /* ---- 4. aim: 창이 빠진 비늘에 정확하게 명중 ---- */
  {

    const s = 0.68, ox = -134, oy = -14;

    b += ground(w, h, 212, '#CFE6B8');
    b += G(drg({ hole: true, dizzy: true, id: 4 }), `translate(${ox} ${oy}) scale(${s})`);
    const fx = HOLE[0] * s + ox, fy = HOLE[1] * s + oy;

    b += pth(`M${hx + 6} ${hy}L${fx - 48} ${fy + 14}`, 'none', 0, { stroke: C.red, 'stroke-width': 3.4, 'stroke-dasharray': '1 8', 'stroke-linecap': 'round' });

  /* ---- 5. announce: 왕궁 기자 회견 ---- */
  {
    let b = '';
    b += sign(30, 12, 130, 36, '왕궁 기자 회견', null, 18);

  /* ---- 6. passenger: 승객을 태운 용 버스가 정류장으로 ---- */
  {
    const [, , w, h] = P[6];
    let b = '';
    b += ground(w, h, 206, '#CFE6B8');

    b += ln(52, 196, 52, 214, 5.4, INK) + ln(52, 196, 52, 214, 2.6, '#8E94AA');
    b += sign(14, 148, 76, 50, '용 버스', '정류장', 18, C.blue);
    addPanel(6, b, '#E3F1FB');
  }

  return comicPage(panels);
}

/* ================= 장면 2. 토끼와 거북이 리턴즈 ================= */
/* ================= 장면: 토끼와 거북이 리턴즈 (만화 7칸) ================= */
// 공통 색
const raceC = { skin: '#9BD27B', shell: '#3E8E53', hare: '#F4EFE6', ear: '#F7B7C5' };

// 밝은 간판: 가운데 x, 위 y, 너비 w, 줄 [[글, 크기, 색]]
function raceSign(cx, y, w, rows, f = '#FFFDF8') {
  const gap = 6, pad = 11;
  const h = pad * 2 + rows.reduce((a, r) => a + r[1], 0) + gap * (rows.length - 1);
  let b = rect(cx - w / 2, y, w, h, f, 10, 3);
  let yy = y + pad;
  for (const [t, s, c] of rows) { b += tx(cx, yy + s * 0.84, t, s, c || INK); yy += s + gap; }
  return b;
}
// 바닥 띠
const raceGround = (w, h, y, c) => rect(0, y, w, h - y, c, 0, 0) + ln(0, y, w, y, 2.4);

// 거북이 (오른쪽을 봄, 발 기준). o.flip 왼쪽 보기, o.run 달리기, o.face(smile|happy|fierce|grin), o.tilt 고개 각도, o.boxes 택배 상자
function raceTurtle(x, y, s = 1, o = {}) {
  const sk = raceC.skin;
  let b = '';
  const band = { stroke: C.red, 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none' };
  b += pth('M-36 -12L-50 -7L-36 -3Z', sk, 2.2); // 꼬리
  if (o.run) b += limb(-22, -12, -38, -1, sk, 0, 15, 10.5) + limb(16, -12, 32, -2, sk, 0, 15, 10.5);
  else b += rect(-30, -16, 14, 16, sk, 5, 2.4) + rect(10, -16, 14, 16, sk, 5, 2.4);
  b += pth('M14 -16C20 -26 28 -32 36 -34L42 -18C34 -14 24 -12 14 -12Z', sk, 2.6); // 목
  b += pth('M-38 -13C-38 -50 34 -50 34 -13Z', raceC.shell, 3); // 등딱지
  b += pth('M-16 -38L-8 -26L-20 -16M8 -38L2 -26L14 -16M-8 -26H2', 'none', 2.2, { stroke: '#2D6B3E' });
  b += rect(-40, -16, 76, 7, '#6FB55A', 3, 2.4);
  // 머리
  let hd = '';
  hd += E('path', { d: o.run ? 'M33 -36C26 -40 18 -44 8 -44M33 -35C26 -33 18 -33 8 -29' : 'M33 -36L24 -43M33 -35L22 -30', ...band });
  hd += ell(47, -29, 16, 14.5, sk, 2.6);
  hd += pth('M33 -37Q47 -47.5 61 -38L61.6 -34Q47 -43.5 32.4 -33Z', C.red, 1.8);
  const f = o.face || 'smile';
  if (f === 'happy') hd += pth('M50 -27Q53.5 -31.5 57 -27', 'none', 2.2);
  else hd += ell(53, -27.5, 2.3, 3.1, INK, 0);
  if (f === 'fierce' || f === 'grin') hd += ln(48, -35, 58, -30.5, 2.4);
  if (f === 'fierce' || f === 'grin') hd += pth('M51.5 -21Q57 -14 62 -22Z', INK, 1.4);
  else hd += pth('M52 -21Q57 -17 61.5 -22', 'none', 2.1);
  hd += circ(45.5, -22, 2.8, '#F49A9A', 0, { opacity: .7 });
  b += o.tilt ? G(hd, `rotate(${o.tilt} 30 -20)`) : hd;
  if (o.boxes) b += rect(-27, -66, 30, 26, '#D9A05B', 2, 2.4) + ln(-12, -66, -12, -40, 1.8) + rect(3, -58, 22, 18, '#E8B878', 2, 2.4) + ln(14, -58, 14, -40, 1.8);
  return G(b, `translate(${x} ${y}) scale(${o.flip ? -s : s} ${s})`);
}

// 토끼 얼굴 조각 (오른쪽을 봄). 눈 (ex,ey)
function raceHareFace(ex, ey, mood) {
  let b = '';
  if (mood === 'smug' || mood === 'fierce') b += pth(`M${ex - 3.2} ${ey - 1.5}H${ex + 3.2}Q${ex + 3.2} ${ey + 3.2} ${ex} ${ey + 3.2}Q${ex - 3.2} ${ey + 3.2} ${ex - 3.2} ${ey - 1.5}Z`, INK, 0);
  else b += ell(ex, ey, 2.1, 2.8, INK, 0);
  if (mood === 'smug' || mood === 'fierce') b += ln(ex - 5, ey - 8, ex + 5, ey - 4.5, 2.4);
  b += circ(ex + 9, ey + 6, 2.7, '#F48FA6', 0); // 코
  if (mood === 'fierce') b += pth(`M${ex + 1} ${ey + 11}Q${ex + 6} ${ey + 17} ${ex + 10} ${ey + 10.5}Z`, INK, 1.4);
  else b += pth(`M${ex - 1} ${ey + 12}Q${ex + 4} ${ey + 15} ${ex + 9} ${ey + 10}`, 'none', 2);
  b += circ(ex - 6, ey + 9, 3, '#F49A9A', 0, { opacity: .6 });
  return b;
}
// 서 있는 토끼 (오른쪽을 봄, 발 기준): 팔짱 낀 자신만만 포즈
function raceHare(x, y, s = 1, o = {}) {
  const c = raceC.hare;
  let b = '';
  b += pth('M-2 -88C-12 -106 -14 -122 -9 -132C0 -124 6 -106 6 -90Z', c, 2.6); // 뒤 귀
  b += ell(-6, -4, 14, 5.5, c, 2.6); // 뒷발
  b += circ(-19, -26, 7, '#fff', 2.4); // 꼬리
  b += pth('M-16 -12C-24 -30 -20 -58 0 -62C18 -64 24 -40 20 -16C16 -6 -10 -4 -16 -12Z', c, 2.8); // 몸
  b += ell(12, -4, 15, 5.5, c, 2.6); // 앞발
  b += circ(6, -76, 17, c, 2.8); // 머리
  b += pth('M4 -90C0 -110 2 -128 10 -136C17 -124 18 -106 13 -90Z', c, 2.6); // 앞 귀
  b += pth('M8 -96C6 -108 7 -118 10 -126', 'none', 0, { stroke: raceC.ear, 'stroke-width': 3.4, 'stroke-linecap': 'round' });
  b += raceHareFace(14, -78, o.mood || 'smug');
  // 팔짱
  b += limb(-2, -54, 2, -40, c, 3, 10, 6.4) + limb(2, -40, 19, -46, c, 0, 10, 6.4) + circ(20, -46.5, 5, c, 2.2);
  return G(b, `translate(${x} ${y}) scale(${s})`);
}
// 달리는 토끼 (오른쪽으로 쌩, 발 기준)
function raceHareRun(x, y, s = 1) {
  const c = raceC.hare;
  let b = '';
  for (const sy of [-44, -33, -22]) b += ln(-62, sy, -80, sy, 3, '#8E94AA');
  b += limb(-20, -26, -52, -10, c, 5, 12, 8) + limb(16, -26, 46, -12, c, -5, 12, 8); // 다리
  b += pth('M22 -60C10 -76 -4 -86 -16 -88C-10 -78 2 -68 16 -58Z', c, 2.6); // 뒤 귀
  b += circ(-36, -38, 7, '#fff', 2.4); // 꼬리
  b += G(ell(-4, -34, 32, 17, c, 2.8), 'rotate(-8 -4 -34)'); // 몸
  b += circ(30, -50, 17, c, 2.8); // 머리
  b += pth('M26 -64C18 -84 6 -98 -6 -104C-2 -90 8 -74 20 -60Z', c, 2.6); // 앞 귀
  b += pth('M20 -70C14 -82 8 -90 0 -96', 'none', 0, { stroke: raceC.ear, 'stroke-width': 3.4, 'stroke-linecap': 'round' });
  b += raceHareFace(37, -53, 'fierce');
  return G(b, `translate(${x} ${y}) scale(${s})`);
}

// 관중 동물: 몸 + 만세 팔 + 머리(키트)
function raceFan(x, y, s, head, col, arms = true) {
  let b = '';
  if (arms) b += limb(-12, -16, -16, -56, col, 3, 10, 6.4) + circ(-16, -56, 5, col, 2.2) + limb(12, -16, 16, -56, col, -3, 10, 6.4) + circ(16, -56, 5, col, 2.2);
  b += pth('M-20 0Q-20 -24 0 -24Q20 -24 20 0Z', col, 2.6);
  b += head(0, -32, 1);
  return G(b, `translate(${x} ${y}) scale(${s})`);
}
// 번개(맞대결 눈싸움)
const raceBolt = (x, y, s = 1, r = 0) => G(pg('-4,-16 6,-16 1,-4 8,-4 -5,16 -1,2 -8,2', '#FFE45C', 2.2), `translate(${x} ${y}) rotate(${r}) scale(${s})`);

function scRace() {
  const P = comicPanels(7), panels = [];
  const wh = k => [P[k][2], P[k][3]];
  const zz = (x, y) => tx(x, y, 'z', 18, '#4C7BE0') + tx(x + 13, y - 20, 'Z', 23, '#4C7BE0') + tx(x + 28, y - 44, 'Z', 28, '#4C7BE0');

  // 0 rival: '토끼 VS 거북이 리턴즈!' 간판 아래 맞대결
  {
    const [w, h] = wh(0);
    let o = raceGround(w, h, 188, '#E9D9BC');
    o += raceSign(164, 12, 164, [['토끼 VS 거북이', 20], ['리턴즈!', 25, C.red]]);
    o += raceHare(54, 206, 1.12, { mood: 'smug' });
    o += raceTurtle(178, 214, 1.32, { flip: true, face: 'fierce', tilt: -18 });
    o += raceBolt(100, 132, 1.1, 30);
    panels.push(panelSvg(P[0], o, '#FBEFD9'));
  }
  // 1 boast: '이번에도 내가 1등!' 쌩 달려 나가는 토끼
  {
    const [w, h] = wh(1);
    let o = raceGround(w, h, 188, '#CFE6B8');
    o += raceHareRun(130, 202, 1.38);
    o += bubble(142, 12, 106, 64, 176, 110);
    o += tx(195, 39, '이번에도', 19) + tx(195, 65, '내가 1등!', 21, C.red);
    panels.push(panelSvg(P[1], o, '#E3F1FB'));
  }
  // 2 lead: 전광판 '현재 1위 토끼' + 지금 쿨쿨 자는 토끼
  {
    const [w, h] = wh(2);
    let o = raceGround(w, h, 188, '#CFE6B8');
    o += tree(194, 190, 1.22, '#7CC46A');
    o += ln(62, 80, 62, 192, 8, INK) + ln(62, 80, 62, 192, 4, '#8E94AA');
    // 전광판: 어두운 판에 밝은 글자
    o += raceSign(62, 12, 112, [['현재 1위', 24, '#FFD84D'], ['토끼', 24, '#FF8A8A']], '#2B2F55');
    o += hareSleep(170, 212, 1.65);
    o += G(pth('M28 -36C22 -43 14 -48 6 -51', 'none', 0, { stroke: raceC.ear, 'stroke-width': 2.6, 'stroke-linecap': 'round' }), 'translate(170 212) scale(1.65)');
    o += zz(118, 116);
    panels.push(panelSvg(P[2], o, '#EEE8FB'));
  }
  // 3 cheer: 관중 셋이 '거북이 힘내라!' 현수막을 번쩍 들고 응원
  {
    const [w, h] = wh(3);
    let o = raceGround(w, h, 194, '#D6DFEE');
    o += raceSign(w / 2, 46, 164, [['거북이', 22], ['힘내라!', 25, C.red]]);
    o += raceFan(37, 206, 1.5, bearHead, '#A0703F') + raceFan(95, 206, 1.5, frogHead, '#7CC46A') + raceFan(153, 206, 1.5, birdHead, '#4C9BE0');
    panels.push(panelSvg(P[3], o, '#F7E8E8'));
  }
  // 4 encourage: 다람쥐 응원단장 '할 수 있어!' → 힘이 나서 달리는 거북이
  {
    const [w, h] = wh(4);
    let o = raceGround(w, h, 178, '#CFE6B8');
    o += squirrel(58, 188, 1.15);
    o += raceTurtle(108, 221, 1.05, { run: true, face: 'fierce' });
    o += bubble(80, 14, 102, 66, 120, 118);
    o += tx(131, 41, '할 수', 21) + tx(131, 67, '있어!', 23, C.red);
    panels.push(panelSvg(P[4], o, '#E4F4E1'));
  }
  // 5 limit: 제한속도 10인데 지금 15! 과속 카메라 번쩍
  {
    const [w, h] = wh(5);
    let o = raceGround(w, h, 194, '#DADDE6');
    o += ln(95, 36, 95, 198, 7, INK) + ln(95, 36, 95, 198, 3.4, '#C9CEDF');
    o += G(burst(-30, 2, 21, 10, 9, '#FFF3A6', 2) + rect(-16, -11, 32, 22, '#3A3F57', 4, 2.6) + circ(-9, 0, 6, '#8FA3C8', 2), 'translate(103 34)');
    o += raceSign(95, 60, 140, [['제한속도 10', 20], ['지금 15!', 23, C.red]]);
    o += raceTurtle(86, 212, 1.1, { run: true, face: 'grin' });
    for (const sy of [164, 175, 186]) o += ln(10, sy, 24, sy, 3, '#8E94AA');
    panels.push(panelSvg(P[5], o, '#E8EEF6'));
  }
  // 6 deliver: 상금으로 차린 '느림보 택배' 개업
  {
    const [w, h] = wh(6);
    let o = raceGround(w, h, 196, '#E9D9BC');
    o += rect(16, 70, 158, 128, '#F3DDB8', 0, 3);
    for (let i = 0; i < 5; i++) o += pth(`M${16 + i * 31.6} 84H${47.6 + i * 31.6}V98Q${31.8 + i * 31.6} 110 ${16 + i * 31.6} 98Z`, i % 2 ? '#fff' : C.red, 2.4);
    o += rect(114, 120, 46, 76, '#C99A62', 4, 2.6);
    o += raceSign(w / 2, 14, 164, [['느림보 택배', 24, C.green], ['오늘 개업!', 19, C.red]]);
    o += raceTurtle(78, 218, 1.3, { boxes: true, face: 'happy' });
    panels.push(panelSvg(P[6], o, '#FBEFD9'));
  }
  return comicPage(panels);
}

/* ================= 장면 3. 아기돼지 삼형제의 벽돌집 ================= */
function brickWall(x, y, w, h, missing = 0) {
  let b = rect(x, y, w, h, '#D9694F', 0, 3);
  const bw = 28, bh = 14;
  for (let r = 0; r * bh < h; r++) {
    const yy = y + r * bh;
    if (r) b += ln(x, yy, x + w, yy, 1.6, '#8E3B2B');
    for (let xx = x + (r % 2 ? bw / 2 : bw); xx < x + w; xx += bw) b += ln(xx, yy, xx, Math.min(yy + bh, y + h), 1.6, '#8E3B2B');
  }
  return b;
}
const brick = (x, y, r = 0) => G(rect(-13, -7, 26, 14, '#D9694F', 2, 2.4) + ln(-4, -7, -4, 7, 1.4, '#8E3B2B'), `translate(${x} ${y}) rotate(${r})`);
/* ================= 장면: 아기돼지 삼형제의 벽돌집 (만화 7칸) ================= */
// 삼형제 색: 첫째 파랑 멜빵, 둘째 초록 멜빵, 막내 주황 멜빵 + 노란 안전모
const pigsC = { skin: '#F9B4C3', dark: '#F28DA5', nose: '#B0506A', big: '#4C7BE0', mid: '#3FA36B', small: '#F08A3C', hat: '#F4C24F', brick: '#D9694F', brickD: '#8E3B2B', roof: '#8E3B2B', straw: '#F2D27A', strawD: '#C9A13E' };

// 아기돼지 (앞을 봄, 발 기준, s=1일 때 키 약 140). 선 굵기는 크기와 상관없이 같게 보이도록 보정
// o.ov 멜빵 색, o.hat 안전모 색, o.lh / o.rh 손 위치(돼지 좌표), o.face smile|happy|open, o.front 손 위에 그릴 것(돼지 좌표)
function pigsPig(x, y, s = 1, o = {}) {
  const c = pigsC.skin, d = pigsC.dark, W = v => +(v * 0.95 / s).toFixed(2);
  let b = '';
  // 꼬리
  b += pth('M28 -40C40 -44 44 -32 37 -29C31 -27 32 -37 40 -36', 'none', W(2.4));
  // 다리
  b += rect(-17, -20, 12, 20, d, 4, W(2.6)) + rect(5, -20, 12, 20, d, 4, W(2.6));
  // 몸 + 멜빵
  b += circ(0, -46, 30, c, W(2.8));
  if (o.ov) {
    b += pth('M-30 -46H-14V-62H14V-46H30A30 30 0 0 1 -30 -46Z', o.ov, W(2.4));
    b += ln(-12, -62, -19, -73, W(2.6)) + ln(12, -62, 19, -73, W(2.6));
    b += circ(-8, -56, 2, '#fff', 0) + circ(8, -56, 2, '#fff', 0);

  // 귀
  b += pth('M-27 -112L-33 -137L-9 -125Z', c, W(2.6)) + pth('M27 -112L33 -137L9 -125Z', c, W(2.6));
  // 머리
  b += circ(0, -98, 30, c, W(2.8));
  b += ell(0, -90, 13, 9.5, d, W(2.4)) + ell(-4.5, -90, 2, 3, pigsC.nose, 0) + ell(4.5, -90, 2, 3, pigsC.nose, 0);
  const f = o.face || 'smile';
  if (f === 'happy') b += pth('M-16 -104Q-12 -109 -8 -104M8 -104Q12 -109 16 -104', 'none', W(2.4));
  else b += ell(-12, -104, 2.6, 3.4, INK, 0) + ell(12, -104, 2.6, 3.4, INK, 0);
  if (f === 'open') b += pth('M-6 -78Q0 -69 6 -78Z', INK, W(1.6));
  else b += pth('M-6 -77Q0 -72 6 -77', 'none', W(2.2));
  b += circ(-20, -87, 4.2, '#F49A9A', 0, { opacity: .75 }) + circ(20, -87, 4.2, '#F49A9A', 0, { opacity: .75 });
  if (o.hat) b += pth('M-25 -114C-25 -142 25 -142 25 -114Z', o.hat, W(2.6)) + rect(-31, -118, 62, 7, o.hat, 3.5, W(2.4)) + ln(0, -136, 0, -119, W(2.2));

  const lh = o.lh || [-34, -36], rh = o.rh || [34, -36];
  const arm = (sx, sy, [hx, hy], bend) => limb(sx, sy, hx, hy, c, bend, 7 + 2 * W(2.5), 7) + circ(hx, hy, 6, d, W(2.2));
  if (o.back) b += o.back;
  b += arm(-24, -62, lh, o.lb ?? -4) + arm(24, -62, rh, o.rb ?? 4);
  if (o.front) b += o.front;
  return G(b, `translate(${x} ${y}) scale(${s})`);
}

      const yy = y + r * bh;
      if (r) b += ln(x, yy, x + w, yy, mw, mortar);

  const strawHouse = (x, y, w) => {

// 피노키오 공통 색 (모든 칸에서 같은 모습: 초록 뾰족 모자 + 빨간 윗옷 + 파란 바지)

// 피노키오 모자: 파란 뾰족 모자 + 빨간 깃털 (키트 pointyHat)
const pinocchioHat = () => pointyHat(pinocchioC.hat);
// 피노키오 얼굴 (face:'blank'로 눈만 그린 뒤 코·입을 직접 그림). len = 코 길이
function pinocchioFace(f, len, skin) {
  let b = '';
  if (f === 'happy') b += ell(-5, -90.5, 2.8, 3.4, skin, 0) + ell(5, -90.5, 2.8, 3.4, skin, 0) + pth('M-7.5 -90Q-5 -93.5 -2.5 -90', 'none', 1.8) + pth('M2.5 -90Q5 -93.5 7.5 -90', 'none', 1.8);
  if (f === 'worry') b += ln(-8, -95, -3, -96.5, 1.8) + ln(8, -95, 3, -96.5, 1.8);
  if (f === 'smile' || f === 'happy') b += pth('M-4.5 -80.6Q0 -76.6 4.5 -80.6', 'none', 1.9);
  if (f === 'open') b += pth('M-4 -81Q0 -74.6 4 -81Z', INK, 1.2);
  if (f === 'worry') b += pth('M-4 -77.6Q0 -80.8 4 -77.6', 'none', 1.9);
  if (len != null) {   // 나무 코: 얼굴 가운데에서 오른쪽으로 뻗은 뾰족한 막대 (뿌리 쪽 테두리 없음)
    const t = 4 + len, d = `M0.5 -88.4L${t} -86.9Q${t + 2.2} -86.1 ${t} -85.3L0.5 -83.8`;
    b += pth(d + 'Z', pinocchioC.nose, 0) + pth(d, 'none', 1.9);

  return b;
}
// 피노키오 (발 기준). o.nose = 코 길이(사람 좌표, 기본 4), o.real = 진짜 소년(사람 피부, 나무 코 없음)
function pinocchioKid(o) {
  const real = !!o.real, f = o.face || 'smile';
  if (real) return person({ hs: 'short', hair: HR.dark, skin: SK[0], top: pinocchioC.top, bot: pinocchioC.bot, ...o, face: f, extra: pinocchioHat() + (o.extra || '') });
  const extra = pinocchioFace(f, o.nose ?? 14, pinocchioC.wood) + pinocchioHat() + (o.extra || '');
  return person({ hs: 'short', hair: HR.dark, skin: pinocchioC.wood, top: pinocchioC.top, bot: pinocchioC.bot, ...o, face: 'blank', extra });
}
// 밝은 간판: 가운데 x, 위 y, 너비 w, 줄 [[글, 크기, 색]]
function pinocchioSign(cx, y, w, rows) {
