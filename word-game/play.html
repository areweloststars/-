    b += rect(134, 50, 112, 160, C.wood, 8, 2.8) + rect(142, 64, 96, 138, '#FFFDF8', 3, 2.2);
    b += rect(170, 42, 40, 16, '#9AA5BF', 4, 2.4);
    b += tx(190, 98, '피노키오', 20, INK) + ln(152, 110, 228, 110, 2, '#C9CEDF');
    b += G(circ(0, 0, 33, 'none', 0, { stroke: C.red, 'stroke-width': 4 }) + circ(0, 0, 26, 'none', 0, { stroke: C.red, 'stroke-width': 1.8 }) + tx(0, 9, '참석', 25, C.red), 'translate(190 152) rotate(-12)');
    addPanel(0, b, '#FBEFD9');
  }

  /* ---- 1. knowledge: '정직 백과사전'을 들고 머리에 전구가 반짝 ---- */
  {
    const [w, h] = wh(1);
    let b = pinocchioGround(w, h, 198, '#E9D9BC');
    const s = 1.45, px = 116, py = 228;
    const bx = 62, by = 126, bw = 104, bh = 80;           // 책 표지
    const hy = (by + bh / 2 - py) / s, hx = (bw / 2 + 2) / s;  // 손 위치 (사람 좌표)
    b += pinocchioKid({ x: px, y: py, s, face: 'happy', lh: [-hx, hy], rh: [hx, hy] });
    b += pth(`M${bx + bw} ${by + 4}L${bx + bw + 8} ${by + 10}V${by + bh + 6}L${bx + bw} ${by + bh}Z`, '#F4EFE6', 2.4);
    b += rect(bx, by, bw, bh, C.purple, 5, 2.8) + rect(bx, by, 14, bh, '#6E4DB8', 4, 2.4);
    b += rect(bx + 22, by + 10, bw - 32, bh - 20, '#FFFDF8', 4, 2.2);
    b += tx(bx + 6 + bw / 2, by + 36, '정직', 20, INK) + tx(bx + 6 + bw / 2, by + 60, '백과사전', 18, INK);
    b += circ(px - hx * s, py + hy * s, 4.7 * s, pinocchioC.wood, 2.4) + circ(px + hx * s, py + hy * s, 4.7 * s, pinocchioC.wood, 2.4);
    // 전구 (반짝 떠오른 생각)
    const lx = 204, ly = 70;
    for (const [dx, dy] of [[-30, -6], [0, -34], [30, -6], [-21, -26], [21, -26]]) b += ln(lx + dx * 0.72, ly + dy * 0.72, lx + dx, ly + dy, 2.6, '#E0A92E');
    b += circ(lx, ly, 17, '#FFE45C', 2.6) + rect(lx - 8, ly + 14, 16, 12, '#C9CEDF', 3, 2.4) + pth(`M${lx - 5} ${ly + 3}Q${lx} ${ly - 6} ${lx + 5} ${ly + 3}`, 'none', 2);
    addPanel(1, b, '#EEE8FB');
  }

  /* ---- 2. warn: 칠판 '거짓말은 절대 안 돼!' + 밑줄을 콕 짚는 귀뚜라미 선생님 ---- */
  {
    const [w, h] = wh(2);
    let b = pinocchioGround(w, h, 204, '#E9D9BC');
    b += rect(8, 18, 152, 134, C.wood, 8, 2.8) + rect(16, 26, 136, 118, '#FFFDF8', 4, 2.2);
    b += rect(20, 152, 128, 8, C.woodD, 3, 2.4);
    b += tx(84, 66, '거짓말은', 22, INK) + tx(84, 106, '절대 안 돼!', 26, C.red);
    b += ln(28, 118, 140, 118, 4, C.red) + ln(36, 127, 132, 127, 4, C.red);
    b += pinocchioCricket(210, 228, 1.42);
    b += ln(176, 163, 140, 123, 4.4, INK) + ln(176, 163, 140, 123, 2, C.woodD);
    addPanel(2, b, '#E8EEF6');
  }

  /* ---- 3. grow: 거짓말할수록 코가 점점 길어짐 ---- */
  {
    const [w, h] = wh(3);
    let b = pinocchioGround(w, h, 200, '#CFE6B8');
    b += pinocchioSign(w / 2, 8, 150, [['거짓말할수록', 18], ['점점 길~게!', 20, C.red]]);
    const s = 1.25, px = 40, py = 228, len = 100;
    b += pinocchioKid({ x: px, y: py, s, face: 'worry', nose: len, lh: [-17, -36], rh: [17, -36] });
    const ny = py - 86 * s;
    for (const k of [0.36, 0.68]) { const x = px + (3 + len * k) * s; b += ln(x, ny - 9, x, ny + 9, 2.2, '#8B5A2B', { 'stroke-dasharray': '3 3' }); }
    b += arrow(78, ny + 24, 170, ny + 24, C.red, 3.6, 10);
    addPanel(3, b, '#E3F1FB');
  }

  /* ---- 4. sign: 새 둥지까지 생긴 아주 긴 코 = 거짓말 신호 ---- */
  {
    const [w, h] = wh(4);
    let b = pinocchioGround(w, h, 200, '#CFE6B8');
    const s = 1.25, px = 36, py = 228, len = 108;
    b += pinocchioKid({ x: px, y: py, s, face: 'worry', nose: len, lh: [-17, -36], rh: [17, -36] });
    const ny = py - 86 * s, nx = 146;
    // 둥지 + 새
    b += birdHead(nx + 4, ny - 22, 1.15, '#4C9BE0');
    b += pth(`M${nx - 24} ${ny - 8}C${nx - 22} ${ny + 8} ${nx + 22} ${ny + 8} ${nx + 24} ${ny - 8}Q${nx} ${ny - 16} ${nx - 24} ${ny - 8}Z`, '#B07A4A', 2.6);
    b += pth(`M${nx - 18} ${ny - 4}L${nx + 18} ${ny - 6}M${nx - 14} ${ny + 1}L${nx + 14} ${ny}`, 'none', 0, { stroke: '#6B4430', 'stroke-width': 1.8, 'stroke-linecap': 'round' });
    // 표지판
    b += ln(126, 168, 126, 206, 6, INK) + ln(126, 168, 126, 206, 2.6, '#8B5A2B');
    b += pinocchioSign(126, 128, 116, [['긴 코는', 18], ['거짓말 신호!', 18, C.red]]);
    addPanel(4, b, '#E4F4E1');
  }

  /* ---- 5. lie: 벽의 거짓말 측정기 바늘이 '거짓말'을 가리킴 ---- */
  {
    const [w, h] = wh(5);
    let b = '';
    const cx = 95, cy = 202, r = 70;
    b += rect(12, 62, 166, 162, '#FFFDF8', 14, 3);
    // 경고등
    b += rect(83, 52, 24, 12, '#9AA5BF', 3, 2.4) + pth('M80 54C80 34 110 34 110 54Z', '#FF6B6B', 2.6);
    for (const [dx, dy] of [[-28, -4], [0, -26], [28, -4]]) b += ln(95 + dx * 0.72, 42 + dy * 0.72, 95 + dx, 42 + dy, 2.6, C.red);
    // 눈금판
    b += pth(`M${cx - r} ${cy}A${r} ${r} 0 0 1 ${cx} ${cy - r}V${cy}Z`, '#9FDDAE', 2.6);
    b += pth(`M${cx} ${cy - r}A${r} ${r} 0 0 1 ${cx + r} ${cy}H${cx}Z`, '#FFA3AE', 2.6);
    b += tx(50, 112, '진실', 20, '#2E7D46') + tx(140, 112, '거짓말', 20, '#C2283C');
    const a = 52 * Math.PI / 180, nl = 60;
    b += ln(cx, cy, cx + Math.cos(a) * nl, cy - Math.sin(a) * nl, 5, INK) + circ(cx, cy, 7, INK, 0);
    addPanel(5, b, '#E8EEF6');
  }

  /* ---- 6. become: 진짜 소년이 되어 트로피를 번쩍! '꿈을 이뤘어요!' ---- */
  {
    const [w, h] = wh(6);
    let b = pinocchioGround(w, h, 200, '#CFE6B8');
    const s = 1.3, px = 112, py = 228;
    const rh = [36, -110], tx0 = px + rh[0] * s, ty0 = py + rh[1] * s;
    // 트로피 (오른손에 번쩍)
    b += G(pth('M-14 -30H14V-22Q14 -6 0 -4Q-14 -6 -14 -22Z', '#F4C24F', 2.4) + pth('M-14 -26Q-23 -26 -21 -18Q-19 -12 -12 -12M14 -26Q23 -26 21 -18Q19 -12 12 -12', 'none', 2.4) + rect(-3, -5, 6, 7, '#E0A92E', 1, 2) + rect(-10, 1, 20, 6, '#E0A92E', 2, 2.2), `translate(${tx0} ${ty0 - 4})`);
    b += pinocchioKid({ x: px, y: py, s, real: true, face: 'happy', lh: [-20, -60], lb: -6, rh, rb: 6 });
    b += bubble(8, 8, 96, 58, 92, 90);
    b += tx(56, 33, '꿈을', 20, INK) + tx(56, 57, '이뤘어요!', 20, C.red);
    addPanel(6, b, '#FBEFD9');
  }

  return comicPage(panels);
}

/* ================= 장면 5. 로빈 후드와 셔우드 숲 ================= */
const coin = (x, y, r = 7) => circ(x, y, r, '#F4C24F', 2.2) + circ(x, y, r * 0.55, 'none', 1.2, { stroke: '#C8942C' });
/* ================= 장면: 로빈 후드와 셔우드 숲 (만화 한 쪽, 7칸) ================= */
function scRobin() {
  const P = comicPanels(7), panels = [];
  // 칸 크기를 인라인 style로도 고정 (페이지 CSS의 svg 크기 규칙이 칸 svg를 늘리지 않게)
  const addPanel = (k, inner, bg) => panels.push(panelSvg(P[k], inner, bg));
  const wh = k => [P[k][2], P[k][3]];

  /* ---- 공통 색 ---- */
  const GREEN = '#2E8B4E', PANTS = '#5A4632', WOOD = '#A8744C', WOOD_D = '#83552F', NEW_WOOD = '#F2D29B';
  const GRASS = '#CFE6B8', FLOOR = '#E9D9BC', WATER = '#BFE0F5';
  const LEAF1 = '#D6ECCD', LEAF2 = '#A9D69C', LEAF3 = '#6DB77F', LEAF4 = '#4FA36A';

  /* ---- 공통 조각 ---- */
  const ground = (w, h, y, f) => rect(0, y, w, h - y, f, 0, 0) + ln(0, y, w, y, 2.4);
  // 밝은 간판: 가운데 cx, 위 y, 너비 w, 줄 [[글, 크기, 색]]
  const sign = (cx, y, w, rows) => {
    const gap = 6, pad = 10;
    const h = pad * 2 + rows.reduce((a, r) => a + r[1], 0) + gap * (rows.length - 1);
    let b = rect(cx - w / 2, y, w, h, '#FFFDF8', 9, 2.8);
    let yy = y + pad;
    for (const [t, s, c] of rows) { b += tx(cx, yy + s * 0.84, t, s, c || INK); yy += s + gap; }
    return b;
  };
  // 말풍선 + 글 (꼬리 끝 tX,tY)
  const say = (x, y, w, rows, tX, tY) => {
    const gap = 5, pad = 10;
    const h = pad * 2 + rows.reduce((a, r) => a + r[1], 0) + gap * (rows.length - 1);
    let b = bubble(x, y, w, h, tX, tY);
    let yy = y + pad;
    for (const [t, s, c] of rows) { b += tx(x + w / 2, yy + s * 0.84, t, s, c || INK); yy += s + gap; }
    return b;
  };
  // 로빈 후드: 모든 칸에서 같은 모습 (초록 두건 + 빨간 깃털, 초록 옷, 갈색 바지)
  const robin = o => person({ hs: 'short', hair: HR.brown, top: GREEN, bot: PANTS, face: 'happy', ...o, extra: hood() + (o.extra || '') });
  const coin = (x, y, r = 8) => circ(x, y, r, '#F4C24F', 2.4) + circ(x, y, r * 0.55, 'none', 0, { stroke: '#C8942C', 'stroke-width': 1.6 });
  // 멀리 보이는 숲: 둥근 나무 꼭대기가 칸 양 끝까지 이어지는 띠
  const canopy = (w, h, y, rs, f, off = 0) => {
    let x = -14 - off, d = `M${x} ${h + 4}V${y}`, i = 0;
    while (x < w + 14) { const r = rs[i++ % rs.length]; d += `A${r} ${r} 0 0 1 ${x + 2 * r} ${y}`; x += 2 * r; }
    return pth(d + `V${h + 4}Z`, f, 2.4);
  };

  /* 0 endless: 언덕 위 로빈이 손차양을 하고 끝없이 펼쳐진 숲을 바라봄 */
  {
    const [w, h] = wh(0);
    let o = '';
    o += canopy(w, h, 112, [7, 9, 8], LEAF1, 2);
    o += canopy(w, h, 140, [11, 13, 10], LEAF2, 7);
    for (let i = -1; i < 9; i++) o += pine(i * 32 + 12, 204, 0.62, LEAF3);
    o += rect(-4, 200, w + 8, 60, LEAF3, 0, 0) + ln(-4, 200, w + 4, 200, 2.4);
    o += pth(`M-10 ${h + 4}V206Q60 192 128 210Q146 218 150 ${h + 4}Z`, GRASS, 2.4); // 앞 언덕
    o += robin({ x: 66, y: 220, s: 1.12, lh: [-44, -82], lb: 6, rh: [44, -82], rb: -6 });
    o += say(122, 14, 114, [['끝이 안', 20], ['보여!', 22, C.red]], 112, 98);
    addPanel(0, o, '#E3F1FB');
  }

  /* 1 spend: 금화 자루를 거꾸로 들고 마을을 위해 아낌없이 씀 */
  {
    const [w, h] = wh(1);
    let o = ground(w, h, 204, FLOOR);
    // 거꾸로 든 자루 + 쏟아지는 금화
    // 거꾸로 든 자루: 불룩한 바닥이 위, 벌어진 입구가 아래
    // 천 돈주머니(둥근 몸통 + 묶음 끈 + 주름진 입구)를 기울여 금화를 쏟음
    const sack = G(pth('M-15 -36C-46 -26 -44 8 0 8C44 8 46 -26 15 -36Z', '#C99A63', 3) +
      pth('M-12 -14Q-20 -4 -14 2', 'none', 2.2) +
      pth('M-15 -38L-26 -58Q-19 -53 -13 -60Q-6 -53 0 -61Q6 -53 13 -60Q19 -53 26 -58L15 -38Z', '#C99A63', 2.6) +
      rect(-18, -42, 36, 8, '#8B5A2B', 3, 2.4), 'translate(166 78) rotate(122)');
    for (const [cx, cy] of [[206, 110], [198, 136], [216, 146], [204, 170], [220, 192]]) o += coin(cx, cy);
    o += robin({ x: 88, y: 224, s: 1.22, lh: [-22, -44], lb: -10, rh: [50, -108], rb: 8 });
    o += sack;
    o += say(10, 12, 112, [['마을 위해', 19], ['다 쓰자!', 22, C.red]], 74, 92);
    addPanel(1, o, '#FBEFD9');
  }

  /* 2 share: '셔우드 자선단체' 천막에서 로빈이 할머니께 빵을 건넴 */
  {
    const [w, h] = wh(2);
    let o = ground(w, h, 212, FLOOR);
    o += rect(24, 80, 136, 132, '#FFF4D6', 0, 2.6); // 천막 안
    o += robin({ x: 92, y: 212, s: 1.0, lh: [-18, -50], lb: -6, rh: [50, -66], rb: 8 });
    o += rect(14, 164, 156, 50, WOOD, 3, 2.8) + ln(14, 175, 170, 175, 2.4);
    o += ln(24, 80, 24, 166, 6, INK) + ln(24, 80, 24, 166, 3, WOOD_D) + ln(160, 80, 160, 166, 6, INK) + ln(160, 80, 160, 166, 3, WOOD_D);
    o += pth('M10 80L28 44H156L174 80Q160 92 146 80Q132 92 118 80Q104 92 92 80Q78 92 64 80Q50 92 38 80Q24 92 10 80Z', '#E5544B', 2.8);
    o += sign(92, 8, 148, [['셔우드 자선단체', 19]]);
    o += person({ x: 212, y: 228, s: 1.1, hs: 'bun', hair: HR.grey, top: '#8C66D9', bot: '#4A4F6B', face: 'happy', lh: [-26, -70], lb: -6, rh: [16, -40] });
    o += G(ell(0, 0, 15, 9, '#E2A85E', 2.6) + pth('M-6 -6Q-4 0 -6 6M0 -8Q2 0 0 8M6 -6Q8 0 6 6', 'none', 1.8), 'translate(162 148) rotate(-8)');
    addPanel(2, o, '#F7E8E8');
  }

  /* 3 repair: 무너진 다리를 새 판자로 튼튼하게 복구 */
  {
    const [w, h] = wh(3);
    let o = rect(0, 176, w, h - 176, WATER, 0, 0) + ln(0, 176, w, 176, 2.4);
    o += pth(`M-10 154H22Q38 170 40 ${h + 4}H-10Z`, GRASS, 2.4) + pth(`M${w + 10} 154H${w - 22}Q${w - 38} 170 ${w - 40} ${h + 4}H${w + 10}Z`, GRASS, 2.4);
    // 기둥 + 밧줄 난간
    const post = x => ln(x, 98, x, 150, 7, INK) + ln(x, 98, x, 150, 3.6, WOOD_D);
    o += post(22) + post(w - 22) + pth(`M22 104Q${w / 2} 128 ${w - 22} 104`, 'none', 0, { stroke: '#8B5A2B', 'stroke-width': 3, 'stroke-linecap': 'round' });
    // 상판: 가운데 새 판자 두 장
    o += rect(12, 150, w - 24, 14, WOOD, 3, 2.8);
    for (let x = 12 + 20; x < w - 12; x += 20) o += ln(x, 150, x, 164, 1.8, WOOD_D);
    o += rect(92, 150, 40, 14, NEW_WOOD, 0, 2.4) + circ(98, 157, 1.8, INK, 0) + circ(126, 157, 1.8, INK, 0) + ln(112, 150, 112, 164, 1.8, '#C9A46A');
    // 망치 든 로빈
    o += G(rect(-4, -26, 8, 32, WOOD_D, 2, 2.4) + rect(-16, -38, 32, 14, '#7A8199', 3, 2.6), 'translate(40 52) rotate(-20)');
    o += robin({ x: 66, y: 151, s: 1.0, lh: [-26, -98], lb: -6, rh: [20, -44], rb: 8 });
    o += sign(w - 48, 16, 80, [['다리', 19], ['복구 끝!', 19, C.green]]);
    addPanel(3, o, '#E3F1FB');
  }

  /* 4 different: 거인 리틀 존, 꼬마 궁수, 사슴 — 키도 모습도 제각각 */
  {
    const [w, h] = wh(4);
    let o = ground(w, h, 206, GRASS);
    o += ln(20, 92, 20, 222, 7, INK) + ln(20, 92, 20, 222, 3.6, WOOD_D); // 지팡이
    o += person({ x: 50, y: 224, s: 1.32, hs: 'curly', hair: HR.dark, skin: SK[2], top: WOOD, bot: PANTS, face: 'happy', lh: [-22, -60], lb: -6, rh: [20, -40], extra: beard('#3A2B24') });
    o += person({ x: 94, y: 224, s: 0.7, hs: 'short', hair: HR.red, top: '#E2A23B', bot: PANTS, face: 'happy', lh: [-18, -42], rh: [22, -62], rb: 4, extra: bowArc() });
    o += deer(145, 224, 0.7);
    o += sign(w / 2, 12, 150, [['키도 모습도', 19], ['제각각!', 21, C.red]]);
    addPanel(4, o, '#EEE8FB');
  }

  /* 5 observe: 터크 수사가 돋보기로 약초를 관찰하며 연구 */
  {
    const [w, h] = wh(5);
    let o = ground(w, h, 206, GRASS);
    // 약초
    const leaf = (r, s2) => G(pth('M0 0C-6 -10 -6 -22 0 -30C6 -22 6 -10 0 0Z', LEAF3, 2.2 / s2) + ln(0, -2, 0, -26, 1.4 / s2, '#2E7D46'), `rotate(${r}) scale(${s2})`);
    o += G(ln(0, 0, 0, -58, 2.8, '#2E7D46') + G(leaf(-55, 1.1), 'translate(0 -14)') + G(leaf(55, 1.1), 'translate(0 -28)') + G(leaf(-40, 1.1), 'translate(0 -42)') + G(leaf(0, 1.1), 'translate(0 -56)'), 'translate(44 214)');
    o += person({ x: 132, y: 226, s: 1.3, hs: 'bald', hair: HR.brown, top: '#8B5A2B', bot: '#5A4632', face: 'wow', under: robe('#8B5A2B', '#8B5A2B') + ln(-16, -44, 16, -44, 3, '#F4EFE6') + ln(6, -44, 8, -26, 2.6, '#F4EFE6'), lh: [-34, -64], lb: -6, rh: [16, -42] });
    // 돋보기 (손 → 렌즈): 렌즈 속 잎이 크게 보임
    o += ln(88, 143, 72, 152, 7, INK) + ln(88, 143, 72, 152, 3.4, WOOD_D);
    o += circ(52, 160, 22, '#EAF6FF', 0) + G(leaf(-40, 1.5), 'translate(54 176)') + circ(52, 160, 22, 'none', 3.6);
    o += say(10, 12, 124, [['약초 관찰 중!', 18]], 112, 74);
    addPanel(5, o, '#FBEFD9');
  }

  /* 6 forever: 울타리로 지키는 커다란 보호수 — 영원히 보존 */
  {
    const [w, h] = wh(6);
    let o = ground(w, h, 206, GRASS);
    o += tree(w / 2, 206, 1.72, LEAF4);
    for (let x = 18; x < w - 8; x += 22) o += rect(x - 4, 176, 8, 46, '#FFFDF8', 2, 2.2);
    o += rect(8, 186, w - 16, 6, '#FFFDF8', 2, 2.2) + rect(8, 204, w - 16, 6, '#FFFDF8', 2, 2.2);
    o += sign(w / 2, 172, 136, [['영원히 보존!', 20, C.green]]);
    addPanel(6, o, '#E3F1FB');
  }

  return comicPage(panels);
}

/* ================= 장면 6. 알라딘과 요술 램프 ================= */

function aladdinSign(cx, y, w, rows, f = '#FFFDF8') {
  const gap = 6, pad = 11;
  const h = pad * 2 + rows.reduce((a, r) => a + r[1], 0) + gap * (rows.length - 1);

  let yy = y + pad;
  for (const [t, s, c] of rows) { b += tx(cx, yy + s * 0.84, t, s, c || INK); yy += s + gap; }
  return b;
}

  return { words, scenes, art };
}
// 시작할 때: 마지막으로 쓰던 단어장을 다시 엶 (저장된 진행 기록은 그 단어장 것)
function bootDeck() {
  if (!SAVE.decks || typeof SAVE.decks !== 'object') SAVE.decks = {};
  // 예전 기본 단어장을 쓰던 기록(단어장 표시가 없던 더 옛날 기록 포함)은 그 이름 그대로 보관하고, 창작 데모를 새로 시작
  if (SAVE.deck === OLD_BUILTIN_ID || (!SAVE.deck && SAVE.best && Object.keys(SAVE.best).length)) { SAVE.deck = OLD_BUILTIN_ID; stashProgress(); loadProgress(DECK_BUILTIN.id); }
  const id = typeof SAVE.deck === 'string' && SAVE.deck ? SAVE.deck : DECK_BUILTIN.id;
  SAVE.deck = id;
  if (id === DECK_BUILTIN.id) return;
  const d = DeckStore.get(id);
  let rt = null;
  try { rt = d ? deckRuntime(d) : null; } catch (e) { rt = null; }
  if (rt && rt.scenes.length) { DECK = { id: d.id, name: d.name, builtin: false }; applyDeckData(rt); }
  else { stashProgress(); loadProgress(DECK_BUILTIN.id); }
}
// 단어장 바꾸기. 바라던 단어장을 열었으면 true
function switchDeck(id) {
  stashProgress();
  const d = id && id !== DECK_BUILTIN.id ? DeckStore.get(id) : null;
  let ok = !id || id === DECK_BUILTIN.id;
  if (!d) { DECK = DECK_BUILTIN; applyDeckData(BUILTIN); loadProgress(DECK_BUILTIN.id); }
  else {
    let rt = null;
    try { rt = deckRuntime(d); } catch (e) { rt = null; }
    if (!rt || !rt.scenes.length) { DECK = DECK_BUILTIN; applyDeckData(BUILTIN); loadProgress(DECK_BUILTIN.id); toast('이 단어장은 망가져서 열 수 없어요. 기본 단어장을 열었어요'); }
    else { DECK = { id: d.id, name: d.name, builtin: false }; applyDeckData(rt); loadProgress(d.id); ok = true; }
  }
  persist();
  return ok;
}

/* ---------- 단어장 보관함: 이 기기(localStorage) + 가능하면 Claude 저장소(db, 내 계정 전용) ---------- */
const DeckStore = (() => {
  const KEY = 'voca-decks-v1', DEL = 'voca-decks-del-v1';
  let cache = {}, tomb = {}, db = null, uid = null, listeners = [];
  const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  function loadLocal() {
    try { cache = obj(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { cache = {}; }
    try { tomb = obj(JSON.parse(localStorage.getItem(DEL) || '{}')); } catch (e) { tomb = {}; }
  }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(cache)); localStorage.setItem(DEL, JSON.stringify(tomb)); return true; } catch (e) { return false; } }
  const valid = d => d && typeof d === 'object' && d.id && Array.isArray(d.scenes) && !d.deleted;
  const coll = () => db.doc('data/users/' + uid + '/profile').collection('decks');
  const changed = () => listeners.forEach(f => { try { f(); } catch (e) { } });
  loadLocal();
  return {
    list() { return Object.values(cache).filter(valid).sort((a, b) => (b.updated || 0) - (a.updated || 0)); },
    get(id) { return Object.prototype.hasOwnProperty.call(cache, id) && valid(cache[id]) ? cache[id] : null; },
    onChange(f) { listeners.push(f); },
    get cloud() { return !!db; },
    async put(deck) {
      deck.updated = Date.now();
      if (uid && !deck.owner) deck.owner = uid;
      cache[deck.id] = deck; delete tomb[deck.id];
      const local = saveLocal();
      let cloud = false;
      if (db) { try { await coll().doc(deck.id).set(deck); cloud = true; } catch (e) { cloud = false; } }
      changed();
      return { local, cloud };
    },
    // 사이트에 함께 들어 있는 단어장 넣기: 없으면 넣고, 더 새 판이면 바꿈. 이 판 뒤에 지운 단어장, 사용자가 고친(더 새) 단어장은 그대로
    seed(deck) {
      if (!valid(deck)) return false;
      const ver = +deck.updated || 0, cur = cache[deck.id];
      if ((+tomb[deck.id] || 0) >= ver || (cur && (+cur.updated || 0) >= ver)) return false;
      cache[deck.id] = deck; delete tomb[deck.id];
      saveLocal(); changed();
      return true;
    },
    // 지울 때는 '지웠다'는 표시를 남겨서, 다른 기기나 늦게 연결된 저장소가 다시 올리지 않게
    async del(id) {
      const now = Date.now();
      delete cache[id]; tomb[id] = now; saveLocal();
      if (db) { try { await coll().doc(id).set({ id, deleted: true, updated: now }); } catch (e) { } }
      changed();
    },
    // 내 계정 저장소에 연결해서, 다른 기기에서 만든 단어장도 가져옴
    async connect() {
      try {
        if (!window.claude || typeof claude.use !== 'function') return;
        const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
        if (!d || !u) return;
        const id = await u.id();
        if (!id) return;
        db = d; uid = id;
        const snap = await coll().get();
        let any = false;
        const ids = new Set();
        for (const doc of snap.docs) {
          const v = doc.data(); ids.add(doc.id);
          if (!v || !v.id) continue;
          const mine = cache[v.id], up = +v.updated || 0;
          if (v.deleted) { // 다른 기기에서 지운 단어장
            if (mine && (+mine.updated || 0) <= up) { delete cache[v.id]; any = true; }
            if ((+tomb[v.id] || 0) < up) { tomb[v.id] = up; any = true; }
            continue;
          }
          if ((+tomb[v.id] || 0) >= up) { try { await coll().doc(v.id).set({ id: v.id, deleted: true, updated: +tomb[v.id] }); } catch (e) { } continue; } // 이 기기에서 지웠는데 저장소엔 남아 있던 것
          if (!Array.isArray(v.scenes)) continue;
          if (!mine || up > (+mine.updated || 0)) { cache[v.id] = JSON.parse(JSON.stringify(v)); any = true; }
        }
        // 이 기기에만 있던 내 단어장(또는 로그인 전에 만든 것)만 계정 저장소에 올림. 다른 사람 단어장은 올리지 않음
        for (const v of Object.values(cache)) {
          if (!valid(v) || ids.has(v.id) || tomb[v.id] || (v.owner && v.owner !== uid)) continue;
          v.owner = uid; any = true;
          try { await coll().doc(v.id).set(v); } catch (e) { }
        }
        if (any) { saveLocal(); changed(); }
      } catch (e) { db = null; }
    }
  };
})();

// 품사 표시(n. v. adj. …)와 발음기호([ˈ…], /…/)는 단어·뜻에서 뺌
const POS_TOK = /(^|\s)\(?(?:n|v|a|adj|adv|ad|prep|conj|vt|vi|pron|int)\.\)?(?=\s|$)/gi;
const IPA_TOK = /\[[^\]가-힣]*\]|\/[^/\s가-힣][^/가-힣]{0,30}\//g;
function mkCleanEn(s) { return String(s || '').replace(IPA_TOK, ' ').replace(POS_TOK, ' ').replace(/[{}|<>"]/g, '').replace(/\s+/g, ' ').replace(/^[\s\-–—:=~.,]+|[\s\-–—:=~.,]+$/g, '').trim().slice(0, 40); }
// 뜻 맨 앞의 '-'는 '-하는 것을'처럼 한글 바로 앞에 붙은 자리 표시면 남김
function mkCleanKo(s) { return String(s || '').replace(IPA_TOK, ' ').replace(POS_TOK, ' ').replace(/[{}|<>]/g, '').replace(/\s+/g, ' ').replace(/^(?:[\s–—:=.,]|-(?![가-힣]))+|[\s\-–—:=,]+$/g, '').trim().slice(0, 60); }
// 쓸 수 있는 줄: 영어와 (글자가 있는) 뜻이 다 있음
const mkRowOk = r => !!(mkCleanEn(r.en) && mkCleanKo(r.ko) && mkAnsFrom(null, mkCleanKo(r.ko)).length);

}

// "영어 - 뜻" 줄들을 단어 목록으로. 번호·글머리표·품사·표(탭) 칸도 정리하고, 못 읽은 줄 수도 셈
const HANGUL = /[가-힣]/, LATIN = /[A-Za-z]/;
function mkParse(text) {
  const rows = []; let skipped = 0;
  for (const raw of String(text || '').split(/\n+/)) {
    let line = raw.replace(/\r/g, '').trim(); if (!line) continue;
    let en = '', ko = '';
    if (line.includes('\t')) {
      // 표에서 복사: 영어 칸(숫자·품사 칸 제외)과 한글 칸
      const cells = line.split('\t').map(c => c.trim()).filter(Boolean);
      en = cells.find(c => LATIN.test(c) && !HANGUL.test(c) && !/^\(?(?:n|v|a|adj|adv|ad|prep|conj)\.?\)?$/i.test(c)) || '';
      ko = cells.find(c => HANGUL.test(c)) || '';
    } else {
      line = line.replace(/^(?:\(?\d{1,3}[.)]?|[①-⑳]|[•·▪■□☐✓✔*\-–—])\s*/, '');
      const m = line.match(/^(.+?)\s+[-–—]\s+(.+)$/) || line.match(/^([^가-힣:=]+?)\s*[:=]\s*(.+)$/) || line.match(/^([^가-힣]+?)\s{2,}(.+)$/);
      if (m && LATIN.test(m[1]) && !HANGUL.test(m[1])) { en = m[1]; ko = m[2]; }
      else {
        const k = line.search(HANGUL), j = line.search(LATIN);
        if (k > 0 && j >= 0 && j < k) { en = line.slice(0, k); ko = line.slice(k); }
        else if (k === 0 && j > 0) { ko = line.slice(0, j); en = line.slice(j); } // 한글이 먼저 나온 줄
      }
    }
    en = mkCleanEn(en); ko = mkCleanKo(ko);
    if (en && ko && LATIN.test(en)) rows.push({ en, ko, pos: 'x' }); else skipped++;

}
// 같은 단어(대소문자 무시)는 하나로: 뜻이 다르면 합침
function mkDedupe(rows) {
  const at = new Map(), out = [];
  for (const r of rows) {
    const en = mkCleanEn(r.en), k = en.toLowerCase(), ko = mkCleanKo(r.ko);
    if (!en) continue;
    if (at.has(k)) {
      const o = out[at.get(k)], have = o.ko.split(/\s*,\s*/);
      for (const part of ko.split(/\s*,\s*/)) if (part && !have.includes(part)) have.push(part);
      o.ko = have.filter(Boolean).join(', ').slice(0, 60);
      continue;
    }
    at.set(k, out.length);
    out.push({ en, ko, pos: POS_KEYS.includes(r.pos) ? r.pos : 'x', guess: !!r.guess, flag: r.flag || '' });
  }
  return out;
}

   ★ 토막에 겹치는 낱말이 하나도 없으면 답 전체를 뒤의 줄들과만 견줘요 (앞 줄 일을 까닭으로 되풀이해 쓰는 것은 괜찮게) */
const AI_STOP = new Set(Object.values(ST_LINK).flat().join(' ').split(' ').concat(['했어요', '했죠', '해요', '있었어요', '없었어요', '됐어요', '이었어요', '였어요', '했답니다', '됐답니다', '그래서', '그러자', '그때', '정말', '아주', '너무', '모두', '다시', '이제', '함께', '같이', '갑자기', '오늘', '오늘도']));

}
// 답 s가 단어 줄 x보다 다른 번호 줄에 맞으면 그 줄의 차례(0부터), 아니면 -1. req: aiReq 결과

// AI가 쓴 한 줄(t)을 단어 줄(x)에 맞춰 봐요. 쓸 수 있으면 { line: ★ 자리에 {영어|뜻}을 넣은 줄 }, 못 쓰면 { why: 까닭 }

    // 앱 문장을 그대로 베낀 줄은 고쳐 쓴 게 아니에요 (앱 문장이 그대로 남아요)

    if (!mk) return { why: '★가 없음' };

  // ('드디어 ★.'처럼 이름씨로 끝난 토막 글, '★처럼 반짝였어요'처럼 ★를 별 그림으로 읽은 줄은 버려요)

    const tail = (after.match(/^[가-힣]+/) || [''])[0];

}

// 한 글자 뜻('양', '배', '눈')은 다른 뜻으로 읽히기 쉬워요('양, 액수'의 '양'을 '하얀 양 떼'로): 단어의 다른 뜻을 덧붙여 알려 줘요 ('액수와 같은 뜻').

// 요청 준비: 앱이 만든 이야기(res)에서 단어 줄을 찾아 번호를 붙이고 단어 뜻 자리를 ★로 (AI 진단도 같은 방법으로 실제 크기의 요청 글을 만들어요)

  const parts = items.length ? aiParts(story, plainOf(lines[0] || ''), budget) : [];

}
// 단어장에 쓰려면 이야기 AI가 에피소드 단어 줄의 이만큼(2/3, 올림) 이상을 써야 해요. 모자라면 단어장을 만들지 않아요 (mkMake)
const AI_MIN_SHARE = 2 / 3;

    // 너무 작은 에피소드(1~2단어)는 앞 에피소드와 합침(최대 8단어)
    for (let i = eps.length - 1; i > 0; i--) if (!eps[i].keep && eps[i].words.length < 3 && eps[i - 1].words.length + eps[i].words.length <= 8) { eps[i - 1].words.push(...eps[i].words); eps.splice(i, 1); }
    for (let k = 0; k < eps.length; k++) {
      const ep = eps[k], key = `${id}-e${k + 1}`;
      let res = null;
      if (MK.useAI && mkCanAI() && !aiOff) {
        const li = mkLog(`에피소드 ${k + 1}/${eps.length} ‘${ep.title}’ 이야기·그림 만드는 중`);
        const wl = ep.words.map(w => `- ${w} | ${rows[w].ko} | ${rows[w].pos}`).join('\n');
        try {
          res = await MK.sample.json(`너는 한국 학생용 영어 단어 게임의 이야기 작가이자 그림 연출가야.
에피소드 제목: "${ep.title}"${ep.theme ? `\n이야기 주제: ${ep.theme}` : ''}
단어 (영어 | 교재 뜻 | 품사) — 이 순서대로 이야기에 한 번씩 등장:
${wl}

다음을 JSON으로만 만들어.
A. "lines": 이야기 자막 ${Math.min(9, ep.words.length + 2)}줄 안팎(한국어, 한 줄 45자 이내). 첫 줄은 이야기 시작(단어 없이). 그다음 줄부터 위 단어를 순서대로 한 줄에 정확히 하나씩 {영어단어|문장 속 한국어 뜻 표현} 모양으로 넣어(예: "용감한 소녀는 동굴 끝까지 {explore|탐험했답니다}!"). 표시 안의 영어 단어는 위 철자 그대로. 마지막에 단어 없는 웃긴 마무리 한 줄을 넣어도 돼. 코믹하고 따뜻하고 건전하게, 장면이 눈에 그려지게.
B. "words": 단어마다 객체 하나(키는 영어 단어 그대로):
 - "ipa": 미국식 발음기호(슬래시 없이), "kr": 한글 발음, "pos": n|v|a|d|p|x
 - "ans": 뜻 묶음 배열. 교재 뜻은 사진 글자 인식으로 읽은 것이라 깨진 글자(없는 낱말, 이상한 글자)가 섞일 수 있어. 깨져 보이면 그 영어 단어의 올바른 한국어 뜻으로 바로잡아. 교재 뜻을 쉼표로 나눈 뜻 하나가 묶음 하나(괄호 속 말은 설명이니 묶음으로 나누지 마). 묶음 = [화면에 보일 뜻, 학생이 칠 만한 다른 표현들(어간, 띄어쓰기만 다른 형태, 아주 가까운 동의어)]. 예: [["탐험하다","탐험"],["조사하다","조사"]]. 다른 묶음의 말이 서로 포함되지 않게.
 - "tip": 외우기 팁(어원이나 연상, 한국어 한 문장), "ex": 쉬운 영어 예문(단어를 [대괄호]로 감싸), "exKo": 예문 해석
 - "panel": 이 단어의 그림 칸 설계(아래 형식). 한 칸 = 이야기의 그 장면, 주인공 하나를 크게. "sign"은 장면 속 표지판·대사처럼 뜻을 떠올리게 하는 말(한국어 2줄 이내, 줄당 9자 이내). 정답 뜻을 그대로 쓰지는 마.
 - "pic": 그 그림 칸에 무엇이 있고 왜 이 뜻인지 1~2문장(90자 이내, 한국어)
그림 칸 형식 설명:
${typeof GEN_SPEC_DOC === 'string' ? GEN_SPEC_DOC : ''}

답 형식 예: {"lines": ["..."], "words": {"explore": {"ipa": "ɪkˈsplɔːr", "kr": "익스플로어", "pos": "v", "ans": [["탐험하다","탐험"],["조사하다","조사"]], "tip": "...", "ex": "Let's [explore] the old cave.", "exKo": "...", "panel": {}, "pic": "..."}}}`, { signal: ctl.signal, modelTier: 'default' });
          mkLogSet(li, 'ok', `에피소드 ${k + 1} ‘${ep.title}’ 완성`);
        } catch (e) {
          if (e && e.code === 'cancelled') throw e;
          noteErr(e);
          mkLogSet(li, 'warn', `에피소드 ${k + 1}: 자동 만들기가 안 돼서 간단하게 만들었어요`);
          res = null;
        }
      }
      if (!res) {
        // 줄거리 틀(mkStory: 인물·말썽 → 해결·단어 자리·뜻 그림)을 만들고, 이 기기의 이야기 AI가 단어 줄을 써요 (에피소드마다 다른 이야기)
        // (Claude가 쓰는 화면에서 Claude가 못 쓴 에피소드는 예전처럼 틀 그대로)
        res = mkStory(ep.words, rows, storySeed + k);
        ep.title = res.title;
        if (local) {
          const at = `에피소드 ${k + 1} ‘${ep.title}’에서`;
          // 쓰다가 그래픽 칩을 잃으면(엔진이 죽어요) 엔진을 버리고, 한 번만 다시 준비해서 같은 에피소드를 한 번 더 써요. 다른 오류면 멈춰요
          let c = -1, li = 0;
          for (let again = false; c < 0; again = true) {
            li = mkLog(`에피소드 ${k + 1}/${eps.length} ‘${ep.title}’ 이야기 AI가 ${again ? '다시 ' : ''}쓰는 중`);
            try {
              c = await aiRewrite(ai, res, rows, storySeed + k, ctl.signal, true);
            } catch (e) {
              if (e && e.code === 'cancelled') throw e;
              // 무슨 오류였는지 ('AI가 쓴 글 보기' 기록은 aiRewrite가 남겨요)
              const msg = aiMsgOf(e) || '알 수 없는 오류';
              if (!aiLost(e)) {
                mkLogSet(li, 'warn', `에피소드 ${k + 1}: AI가 쓰다가 오류가 났어요 (${msg.slice(0, 80)})`);
                throw mkFail(`${at} 이야기 AI가 쓰다가 오류가 나서 단어장을 만들지 않았어요 (오류: ${msg.slice(0, 160)}). 아래 ‘AI가 쓴 글 보기’를 캡처해서 알려 주세요.`);
              }
              // 그래픽 칩을 잃었어요: 이 엔진은 다시 쓸 수 없어요 (그대로 두면 다음 단어장도 바로 실패해요)
              aiDrop(); ai = null;
              const lost = `${at} 이야기 AI가 쓰는 중에 그래픽 칩 연결이 끊겼어요(휴대폰이 AI의 그래픽 작업을 멈췄어요).`, calm = '다른 앱을 닫고, 다 만들 때까지 화면을 켜 둔 채로 다시 해 보세요.';
              if (aiReloaded) { mkLogSet(li, 'warn', `에피소드 ${k + 1}: 그래픽 칩 연결이 또 끊겼어요`); throw mkFail(`${lost} AI를 다시 준비해서 한 번 더 써 봤지만 또 끊겨서 단어장을 만들지 않았어요. ${calm}`); }
              aiReloaded = true;
              mkLogSet(li, 'warn', `에피소드 ${k + 1}: 쓰는 중에 그래픽 칩 연결이 끊겼어요. AI를 다시 준비해서 한 번 더 써요`);
              await mkWhenVisible(ctl.signal);
              await mkSleep(AI.retryMs == null ? 1500 : AI.retryMs, ctl.signal);
              ai = await mkAiReady(ctl, '이야기 AI 다시 준비 중');
              if (!ai) throw mkFail(`${lost} AI를 다시 준비하지 못해서 단어장을 만들지 않았어요. ${(AI.err && AI.err.text) || ''} ${calm}`);
            }
          }
          // 이야기 AI가 단어 줄의 AI_MIN_SHARE(2/3, 올림) 이상을 써야 이 에피소드를 써요. 남은 몇 줄은 줄거리 틀 문장 그대로 (단어마다 칩이 있게)
          const n = aiWordLines(res, rows), need = Math.max(1, aiNeed(n));
          if (c < need) {
            mkLogSet(li, 'warn', `에피소드 ${k + 1}: AI 문장이 모자라요 (${n}줄 가운데 ${c}줄)`);
            throw mkFail(`${at} 이야기 AI가 단어 문장 ${n}줄 가운데 ${c}줄만 규칙(단어 자리·뜻)에 맞게 썼어요. ${need}줄 이상 써야 해서 단어장을 만들지 않았어요.${AI.copied ? ` 그 가운데 ${AI.copied}줄은 AI가 새로 쓰지 않고 앱이 보낸 문장을 그대로 베꼈어요. 다시 해 보면 다르게 쓸 수 있어요.` : ''} 아래 ‘AI가 쓴 글 보기’에서 줄마다 까닭을 볼 수 있어요.`);
          }
          mkLogSet(li, 'ok', `에피소드 ${k + 1} ‘${ep.title}’ 완성 (AI 문장 ${c}줄)`);
          aiLines += c; wordN += n;
        }
      }
      const out = mkEpisode(key, ep.title, ep.words, rows, res);
      deck.scenes.push(out.scene); Object.assign(deck.words, out.words); deck.panels[key] = out.specs;
    }
    deck.scenes = deck.scenes.filter(sc => sc.words.length);
    if (!deck.scenes.length) throw { code: 'empty_completion' };
    const saved = await DeckStore.put(deck);
    // 이야기 AI가 단어 줄을 몇 줄 썼는지 (그래픽 칩을 한 번 잃고 다시 썼으면 그 일도)
    MK.aiNote = !local ? '' : `이야기 AI(Gemma 4)가 이 기기에서 단어 문장 ${wordN}줄 가운데 ${aiLines}줄을 썼어요.` + (aiReloaded ? ' 쓰는 중에 그래픽 칩 연결이 한 번 끊겨서(휴대폰이 AI의 그래픽 작업을 멈췄어요), AI를 다시 준비해 그 에피소드를 다시 썼어요.' : '');
    if (MK.aiNote && MK.bg) MK.aiNote += ' ' + MK_BG.replace('다 만들 때까지', '다음에는 다 만들 때까지');
    // 'AI가 쓴 글 보기': AI를 준비하거나 쓴 기록이 있으면 (기기 정보도 한 줄)
    MK.aiDiag = (AI.diag || []).length ? AI.diag.slice() : null;
    MK.aiEnv = MK.aiDiag ? [aiEnvText(), aiDevText()].filter(Boolean).join('\n') : '';
    MK.saveNote = (aiOff ? `Claude를 쓸 수 없어서 일부 에피소드는 이야기 없이 간단하게 만들었어요. (${aiOff}) ` : '') +
      (saved.cloud ? '내 Claude 계정에도 저장했어요. 다른 기기에서 이 앱을 열어도 보여요.' : saved.local ? '이 기기에 저장했어요.' : '저장 공간이 없어 이번 방문 동안만 쓸 수 있어요.');
    MK.redo = null;
    if (redo && DECK.id === deck.id) switchDeck(deck.id); // 지금 쓰는 단어장이면 새 이야기로 다시 열어요
    MK.deck = deck; MK.step = 'done'; MK.images.forEach(im => URL.revokeObjectURL(im.url)); MK.images = []; MK.rows = []; MK.name = ''; MK.paste = ''; MK.note = '';
    Sound.play('project');
    voiceWarm(); // 게임을 열기 전에 목소리를 미리 준비 (이야기 AI가 일을 다 마친 뒤)
    // 만드는 동안 다른 화면에 가 있었으면 다 됐다고 알려 줌
    if ($('#make').hidden) toast(`‘${deck.name}’ 단어장이 완성됐어요! 홈 위 단어장 단추에서 골라요`);
  } catch (e) {
    MK.step = 'review'; MK.err = (e && e.text) || mkErrText(e) || '만들기를 멈췄어요.';
    // 이야기 AI가 준비하거나 쓰다가 멈췄어요: 단어장은 저장하지 않았어요. 까닭과 'AI가 쓴 글 보기', '다시 해 보기'를 보여 줘요 (입력한 단어는 그대로)
    if (e && e.fail) {
      MK.fail = true;
      MK.err += (MK.bg ? ' ' + MK_BG : '') + ' 입력한 단어는 그대로 있어요. ‘다시 해 보기’를 누르면 처음부터 다시 만들어요.';
      MK.aiDiag = (AI.diag || []).length ? AI.diag.slice() : null;
      MK.aiEnv = MK.aiDiag ? [aiEnvText(), aiDevText()].filter(Boolean).join('\n') : '';
    }
    if ($('#make').hidden && e && e.code !== 'cancelled') toast('단어장을 만들지 못했어요. ‘사진 찍어 새 단어장 만들기’를 다시 눌러 확인해 주세요');
  } finally {
    wakeFree('make');
    // 다른 화면에 가 있는 동안 다 만들었으면(실패해도) 여기서 이야기 AI를 내려놓아요. 만들기 화면에 있으면 그 화면을 나갈 때 내려놓아요 (showScreen)
    if ($('#make').hidden) aiRelease();
  }
  if (!$('#make').hidden) renderMake();
}

/* ---------- 이벤트 ---------- */
function bindMake() {
  const el = $('#make');
  // 화면으로 돌아오면: 화면 켜 두기를 다시 부탁하고, 만드는 중에 가려졌으면 무슨 일인지 알려 줘요
  document.addEventListener('visibilitychange', () => { wakeOnVis(); mkOnVis(); aiBenchOnVis(); });
  // 직접 입력한 단어 목록은 화면이 다시 그려져도 남게
  el.addEventListener('input', e => {
    if (e.target.id === 'mkpaste') MK.paste = e.target.value;
  });
  el.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('mkpaste')) MK.pasteOpen = e.target.open; }, true);
  // 사진 붙여넣기 (파일 고르기 창이 안 열리는 앱 화면에서도 됨)
  el.addEventListener('paste', e => {
    if (MK.step !== 'pick' || e.target.id === 'mkpaste') return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => /^image\//.test(f.type));
    if (!files.length) { if (e.target.id === 'mkdrop') { const t = e.clipboardData && e.clipboardData.getData('text'); e.preventDefault(); if (t && t.trim()) { MK.paste = (MK.paste ? MK.paste + '\n' : '') + t.trim(); MK.pasteOpen = true; renderMake(); toast('붙여넣은 글자를 아래 입력 칸에 넣었어요'); } else toast('사진을 찾지 못했어요. 갤러리에서 사진을 ‘복사’한 뒤 붙여넣어 주세요'); } return; }
    e.preventDefault();
    for (const file of files) { if (MK.images.length >= OCR_MAX) break; MK.images.push({ file, url: URL.createObjectURL(file) }); }
    MK.err = ''; renderMake(); toast(`사진 ${files.length}장을 넣었어요`);
  });
  el.addEventListener('beforeinput', e => { if (e.target.id === 'mkdrop' && !/paste/i.test(e.inputType || '')) e.preventDefault(); });
  el.addEventListener('change', e => {
    const f = e.target.closest('[data-mkfile]'); if (!f) return;
    const max = OCR_MAX;
    for (const file of Array.from(f.files || [])) { if (MK.images.length >= max) break; MK.images.push({ file, url: URL.createObjectURL(file) }); }
    f.value = ''; MK.err = ''; renderMake();
  });
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-mk]'); if (!b) return;
    const a = b.dataset.mk;
    Sound.unlock();
    if (a === 'home') { if (MK.step === 'reading' || MK.step === 'making') { toast('만드는 중이에요. 다 만들면 알려 드릴게요'); } goHome(); }
    else if (a === 'rmimg') { const i = +b.dataset.i, im = MK.images[i]; if (im) { URL.revokeObjectURL(im.url); MK.images.splice(i, 1); } renderMake(); }
    else if (a === 'read') mkRead();
    else if (a === 'stop') { if (MK.step === 'reading') { ocrStop(); MK.step = 'pick'; renderMake(); } else if (MK.ctl) MK.ctl.abort(); }
    else if (a === 'parse') {
      MK.paste = ($('#mkpaste') || {}).value || '';
      const parsed = mkParse(MK.paste), rows = mkDedupe(parsed);
      if (!rows.length) { MK.err = '‘영어 - 뜻’ 모양의 줄을 찾지 못했어요.'; renderMake(); return; }
      MK.note = [parsed.skipped ? `읽지 못한 줄 ${parsed.skipped}개는 뺐어요.` : '', rows.length > MK_MAX ? `단어가 많아서 앞의 ${MK_MAX}개만 가져왔어요.` : ''].filter(Boolean).join(' ');
      MK.rows = rows.slice(0, MK_MAX); MK.err = ''; MK.step = 'review'; if (!aiSoon()) voiceWarm(); renderMake(); // 이야기 AI를 쓸 기기는 다 만든 뒤에 받아요
    }
    else if (a === 'rmrow') { MK.rows.splice(+b.dataset.i, 1); renderMake(); }
    else if (a === 'addrow') { MK.rows.push({ en: '', ko: '', pos: 'x' }); renderMake(); const ins = document.querySelectorAll('#make .mken'); if (ins.length) ins[ins.length - 1].focus(); }
    else if ((a === 'make' || a === 'makeai' || a === 'retry' || a === 'aidl' || a === 'bench') && MK.benchCtl) toast('AI 진단 중이에요. 끝난 뒤에 해 주세요');
    else if (a === 'make' || a === 'makeai' || a === 'retry') { const nm = $('#mkname'); if (nm) MK.name = nm.value; if (a !== 'retry') MK.useAI = a === 'makeai'; mkMake(); } // 다시 해 보기: 같은 단어로 처음부터
    else if (a === 'bench') {
      // 아직 AI를 안 받았으면 진단하면서 받아요: 모바일 데이터면 한 번 더 물어요
      if (aiNeedsDownload() && aiMobileData() && !confirmTap(b, `<small>모바일 데이터로 연결돼 있어요. 진단하려면 이야기 AI(${aiSize()})를 먼저 받아요.</small><br>그래도 하려면 한 번 더 눌러요`)) return;
      mkBench();
    }
    else if (a === 'benchstop') { if (MK.benchCtl) MK.benchCtl.abort(); }
    else if (a === 'benchcopy') mkBenchCopy();
    else if (a === 'aidl') {
      // 모바일 데이터면 한 번 더 눌러야 받아요 (이야기 AI 약 3GB)
      if (!MK.aiWhy && aiNeedsDownload() && aiMobileData() && !confirmTap(b, `<small>모바일 데이터로 연결돼 있어요. 이야기 AI는 ${aiSize()}라서 와이파이에서 받는 게 좋아요.</small><br>그래도 받으려면 한 번 더 눌러요`)) return;
      mkAiPrefetch();
    }
    else if (a === 'aidlstop') { if (MK.aiDlCtl) MK.aiDlCtl.abort(); }
    else if (a === 'restart') { MK.step = 'pick'; MK.rows = []; MK.err = ''; MK.fail = false; MK.note = ''; MK.redo = null; renderMake(); }
    else if (a === 'play') { const d = MK.deck; MK.step = 'pick'; MK.deck = null; if (d) switchDeck(d.id); goHome(); }
  });
}

// AI 진단 하기 (화면을 켜 둔 채로). 1초마다 결과 글을 고쳐 쓰고 저장해요 (탭이 꺼져도 어디까지 했는지 남게)
async function mkBench() {
  if (MK.benchCtl || MK.step === 'making' || (MK.aiDl && MK.aiDl.state === 'run')) return;
  const ctl = MK.benchCtl = new AbortController();
  wakeHold('bench');
  const tick = setInterval(() => {
    const b = AI.bench;
    if (!b || b.state !== 'run') return;
    aiBenchSave(b);
    const el = document.getElementById('mkbenchout');
    if (el) el.textContent = aiBenchText(b);
  }, 1000);
  let b = null;
  try { b = await aiBenchRun(ctl.signal, () => mkAiPut()); } catch (e) { }
  finally { clearInterval(tick); if (MK.benchCtl === ctl) MK.benchCtl = null; wakeFree('bench'); mkAiPut(); }
  if (b && b.state !== 'stop') toast(b.state === 'done' ? 'AI 진단을 마쳤어요' : 'AI 진단이 멈췄어요. 결과를 복사해서 알려 주세요');
}
// 결과 복사: 클립보드에 넣고, 안 되면 글을 골라 둬요 (길게 눌러 복사)
function mkBenchCopy() {
  const pre = document.getElementById('mkbenchout'), t = pre ? pre.textContent : '';
  const pick = () => {
    try { const r = document.createRange(), s = window.getSelection(); r.selectNodeContents(pre); s.removeAllRanges(); s.addRange(r); } catch (e) { }
    toast('복사하지 못했어요. 골라 둔 글을 길게 눌러 복사해 주세요');
  };
  if (!pre) return;
  try { navigator.clipboard.writeText(t).then(() => toast('진단 결과를 복사했어요'), pick); } catch (e) { pick(); }
}

function mkRedoDeck(id) {
  const d = DeckStore.get(id); if (!d) return false;
  if (MK.step === 'making' || MK.step === 'reading') { toast('다른 단어장을 만드는 중이에요. 다 만든 뒤에 해 주세요'); return false; }
  const rows = [], seen = new Set();
  for (const sc of d.scenes || []) for (const en of sc.words || []) { const w = d.words && d.words[en]; if (w && w.m && !seen.has(en)) { seen.add(en); rows.push({ en, ko: String(w.m), pos: w.pos || 'x' }); } }
  if (!rows.length) return false;
  MK.rows = rows; MK.name = d.name; MK.err = ''; MK.deck = null;
  MK.redo = { id: d.id, created: d.created || Date.now(), source: d.source || 'text', eps: (d.scenes || []).map(sc => (sc.words || []).slice()) };

  MK.step = 'review';

}

  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('keydown', e => {
    if (FS.on && e.key === 'Escape') { e.preventDefault(); exitFS(); return; }
    if (e.key === 'Escape' && $('#ov .decklist')) { e.preventDefault(); closeOverlay(); return; }
    if ($('#play').hidden || $('#ov') || !M.active) return;
    if (e.key === 'Escape') { e.preventDefault(); pause(); }
    else if (e.key === 'Enter' && M.state === 'answer' && document.activeElement !== $('#next')) { e.preventDefault(); if (performance.now() - (M.barAt || 0) >= 400) nextCard(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    if (M.active && !M.paused && !M.over) pause();
    if (!$('#story').hidden && (SV.on || SV.busy)) svPause(); // 화면이 꺼지면 스토리도 멈춤
    persist();
  });
  // 휴대폰 자판이 올라오면 보이는 높이에 맞춰 미션 화면을 줄여서 입력칸이 자판 바로 위에 오게
  setVVH();
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { setVVH(); if (!$('#play').hidden && window.scrollY) window.scrollTo(0, 0); });
  let rz = 0;
  window.addEventListener('resize', () => {
    setVVH();
    if (window.innerWidth > window.innerHeight) { const r = $('#vrot'); if (r) r.hidden = true; }
    clearTimeout(rz);
    rz = setTimeout(() => {
      if (PP && !$('#play').hidden && M.queue.length) { ppRefit(); fitWords(); }
      if (SP && !$('#story').hidden) spRelayout();
    }, 150);
  });
}

/* ---------- 인터넷 없이 쓰기 (설치하는 웹 앱) ----------
   서비스 워커(word-game/sw.js)가 게임 페이지와 이 폴더의 파일을 이 기기 브라우저에 저장해요.
   한 번 열어 두면 인터넷 없이도 게임이 열려요 (열쇠는 잠금 페이지가 이 기기에 기억해 둬요).
   서비스 워커는 https나 이 컴퓨터(localhost)에서만 돌아요. Claude 화면 안에서는 켜지 않아요. */
const PWA = { reg: null };
function swRegister() {
  try {
    const sw = navigator.serviceWorker;
    if (!sw || window.claude) return;
    const local = /^(?:localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    if (!(location.protocol === 'https:' || (location.protocol === 'http:' && local))) return;
    const first = !sw.controller;
    // 처음 저장될 때: 서비스 워커가 맡기 전에 받은 이 폴더의 파일(글꼴 조각 등)을 한 번 더 불러 저장되게 해요 (보통 브라우저에 남아 있어서 금방이에요)
    if (first) sw.addEventListener('controllerchange', () => setTimeout(swWarm, 500), { once: true });
    PWA.reg = sw.register(new URL('sw.js', location.href).href, { scope: './' }).catch(() => null);
  } catch (e) { }
}
function swWarm() {
  try {
    const base = new URL('./', location.href).href;
    const seen = new Set();
    for (const e of performance.getEntriesByType('resource')) {
      const u = String(e.name || '').split('#')[0];
      if (!u.startsWith(base) || u === base || /index\.html|play\.html|sw\.js|\?/.test(u.slice(base.length)) || seen.has(u)) continue;
      seen.add(u);
      fetch(u).then(r => r.arrayBuffer()).catch(() => { });
    }
  } catch (e) { }
}
// 서비스 워커가 이 페이지를 맡을 때까지 기다려요 (처음 열 때는 조금 걸려요). 맡으면 true
function swControl(ms) {
  const sw = typeof navigator !== 'undefined' && navigator.serviceWorker;
  if (!sw || sw.controller || !PWA.reg) return Promise.resolve(!!(sw && sw.controller));
  return new Promise(ok => {
    const t = setTimeout(() => ok(!!sw.controller), ms);
    sw.addEventListener('controllerchange', () => { clearTimeout(t); ok(true); }, { once: true });
  });
}
// 인터넷 없이 쓰려고 미리 받아 둘 파일: 사진 읽기(OCR), 목소리(TTS), 이야기 AI를 돌리는 WebLLM(llm/). [경로, 바이트]
// (app/tests/offline.test.cjs가 실제 파일과 맞는지 봐요. llm/은 처음 열 때 받지 않으려고 sw.js가 미리 저장하지 않아요)
// 글꼴 조각은 fonts/fonts.css에 적힌 것을 모두 받아요. 이야기 AI 모델은 WebLLM이 따로 받아 저장해요
const OFFLINE_FILES = [
  ['llm/web-llm.js', 6821360], ['llm/worker.js', 1379], ['llm/gpu-watch.js', 7005],
  ['ocr/tesseract.min.js', 66695], ['ocr/worker.min.js', 123724], ['ocr/tesseract-core-lstm.wasm.js', 3938277],
  ['ocr/eng-traineddata.wasm', 2952873], ['ocr/kor-traineddata.wasm', 1572336], ['ocr/words-en.txt', 1139787], ['ocr/ko-lex.txt', 1900788],
  ['tts/voices.json', 1582], ['tts/espeak-ng.js', 178386], ['tts/espeak-ng-gz.wasm', 9137545], ['tts/ort.wasm.min.js', 49026],
  ['tts/ort-wasm-simd-threaded.mjs', 24618], ['tts/ort-wasm-simd-threaded.wasm', 11246032], ['tts/en-joe.0.wasm', 9000000], ['tts/en-joe.1.wasm', 7599901]
];
const OFFLINE_FONT = 11000; // 글꼴 조각 하나 (평균 바이트, 진행률용)
const OFFLINE_FONTS = 467;
const offlineMB = () => Math.round((OFFLINE_FILES.reduce((a, f) => a + f[1], 0) + OFFLINE_FONTS * OFFLINE_FONT) / 1048576);
// 다 받아 둔 적이 있는지: 사진 읽기·목소리 파일이 모두 저장소(서비스 워커)에 있으면 true
async function offlineHave() {
  try {
    if (typeof caches === 'undefined' || !(navigator.serviceWorker && navigator.serviceWorker.controller)) return false;
    for (const [p] of OFFLINE_FILES) if (!(await caches.match(new URL(p, location.href).href))) return false;
    return true;
  } catch (e) { return false; }
}
// 받아 두기: 파일을 한 번씩 불러요. 서비스 워커가 맡고 있으면 그때 이 기기에 저장해요. onProg(0~1)
// 돌려줌: { bad: 못 받은 파일, stored: 저장됐는지(서비스 워커가 맡았는지) }. 그만두면 { code: 'cancelled' }
async function offlinePrep(onProg, signal) {
  const stop = () => { if (signal && signal.aborted) throw { code: 'cancelled' }; };
  const stored = await swControl(20000);
  stop();
  const url = p => new URL(p, location.href).href;
  let fonts = [];
  try {
    const r = await fetch(url('fonts/fonts.css'), { signal });
    if (r.ok) fonts = [...new Set((await r.text()).match(/files\/[\w.-]+\.woff2/g) || [])].map(f => ['fonts/' + f, OFFLINE_FONT]);
  } catch (e) { stop(); }
  const list = OFFLINE_FILES.concat(fonts), total = list.reduce((a, f) => a + f[1], 0), bad = [];
  let got = 0;
  const tick = n => { got += n; if (onProg) onProg(Math.min(1, got / total)); };
  const one = async ([p, size]) => {
    let n = 0;
    try {
      const r = await fetch(url(p), { signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (r.body && r.body.getReader) {
        const rd = r.body.getReader();
        for (;;) { const { done, value } = await rd.read(); if (done) break; const k = Math.min(value.length, size - n); if (k > 0) { n += k; tick(k); } }
      } else await r.arrayBuffer();
    } catch (e) { stop(); bad.push(p); }
    if (n < size) tick(size - n);
  };
  const queue = list.slice();
  await Promise.all([0, 1, 2, 3].map(async () => { while (queue.length) { stop(); await one(queue.shift()); } }));
  return { bad, stored };
}

function boot(data) {
  loadSave();
  if (data && data.save && typeof data.save === 'object') Object.assign(SAVE, data.save);
  snapshotBuiltin();
  for (const d of PRIVATE_DECKS) DeckStore.seed(d);
  bootDeck();
  if (!DIFF[SAVE.diff]) SAVE.diff = 'normal';
  if (SAVE.dir !== 'en' && SAVE.dir !== 'ko') SAVE.dir = 'en';
  if (typeof SAVE.narr !== 'boolean') SAVE.narr = true;
  if (typeof SAVE.netVoice !== 'boolean') SAVE.netVoice = false;
  if (!RATES.includes(SAVE.rate)) SAVE.rate = 1;
  for (const k of ['best', 'wrong', 'seen', 'decks']) if (!SAVE[k] || typeof SAVE[k] !== 'object' || Array.isArray(SAVE[k])) SAVE[k] = {};
  SAVE.sound = SAVE.sound !== false;
  if (!(SAVE.lives > 0)) { SAVE.best = {}; SAVE.bank = 0; SAVE.lives = LIVES; }
  SAVE.lives = Math.min(LIVES, Math.round(SAVE.lives)); SAVE.bank = clamp(+SAVE.bank || 0, 0, BANK_MAX);
  const keep = new Set([...SCENES.map(s => s.key), 'boss', 'review']);
  for (const k in SAVE.best) if (!keep.has(k) || !SAVE.best[k] || typeof SAVE.best[k].elapsed !== 'number') delete SAVE.best[k];
  document.documentElement.lang = 'ko';
  bindEvents();
  bindMake();
  renderHome();
  showScreen('home');
  mkInit();
  // AI 진단 중에 탭이 꺼졌으면 (다음에 열 때) 결과가 남아 있다고 알려요
  try { const b = aiBenchLoad(); if (b && b.crashNew) { b.crashNew = false; setTimeout(() => toast('AI 진단 중에 탭이 꺼졌어요. 새 단어장 만들기 화면에서 결과를 볼 수 있어요'), 1200); } } catch (e) { }
  // 내 Claude 계정 저장소에 연결되면 다른 기기에서 만든 단어장도 목록에 보임
  DeckStore.onChange(() => { if ($('#ov .decklist')) openDecks(); });
  DeckStore.connect();
  swRegister();
  setTimeout(() => checkNewBuild(true), 3000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkNewBuild(false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('#play').hidden && M.queue.length) fitWords(); });
}
// 새 판 알림: 휴대폰에 옛 판이 열려 있으면(탭을 닫지 않았거나 브라우저가 기억해 둔 판) 띠를 보여 주고, 누르면 새로 고쳐요.
// 사이트 파일 속 지문("sum")을 이 판의 지문(잠금 페이지가 남긴 WG_BUILD)과 견줘요. 열 때와 화면으로 돌아올 때(10분에 한 번까지)
// 인터넷이 없으면 하지 않아요. 사이트 파일만 받아 보고, 이 기기의 단어·기록·열쇠는 아무것도 보내지 않아요
let buildCheckedAt = 0;
async function checkNewBuild(force) {
  const cur = window.WG_BUILD;
  if (!cur || !/^https?:$/.test(location.protocol) || $('#newbuild') || navigator.onLine === false) return false;
  if (!force && Date.now() - buildCheckedAt < 10 * 60 * 1000) return false;
  buildCheckedAt = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
    const m = (await r.text()).match(/"sum":"([0-9a-f]{12})/);
    if (!m || m[1] === cur) return false;
  } catch (e) { return false; }
  const bar = document.createElement('button');
  bar.type = 'button'; bar.id = 'newbuild'; bar.className = 'newbuild';
  bar.innerHTML = '<b>새 판이 나왔어요</b> · 눌러서 새로 고침';
  bar.addEventListener('click', () => { if (MK.step === 'making' && !confirmTap(bar)) return; location.reload(); });
  document.body.appendChild(bar);
  return true;
}
// 만드는 중이면 한 번 더 눌러야 새로 고쳐요 (만들던 단어장이 사라지니까)
// html: 처음 눌렀을 때 단추에 보일 글 (한 번 더 누르면 true)
function confirmTap(el, html = '<b>단어장을 만드는 중이에요</b> · 한 번 더 누르면 멈추고 새로 고쳐요') { if (el.dataset.armed) return true; el.dataset.armed = '1'; el.innerHTML = html; return false; }
const buildLabel = () => window.WG_BUILD ? `판 ${String(window.WG_BUILD).slice(0, 7)}` : '';
const HOT = window.claude && window.claude.hot;
try { if (HOT && HOT.snapshot) HOT.snapshot(() => ({ save: SAVE })); } catch (e) { }
if (HOT && HOT.ready) HOT.ready(boot); else boot((HOT && HOT.data) || {});

</script>
